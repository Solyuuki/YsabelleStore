<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse products, manage your cart, and shop online with Ysabelle Store."
    />
    <meta name="theme-color" content="#625bff" />
    <script>
      // Apply the saved theme before stylesheet paint. About and receipt printing stay unchanged.
      (() => {
        const path = location.pathname;
        const retailPaths = new Set([
          "/staff-login", "/dashboard", "/pos", "/products", "/categories", "/inventory",
          "/receiving", "/sales", "/deliveries", "/customer-support", "/forecast",
          "/historical-sales", "/reports", "/users", "/settings", "/not-found"
        ]);
        const scope = retailPaths.has(path) ? "retail" : "storefront";
        const safeRoute = path === "/about" || path === "/discover" ||
          new URLSearchParams(location.search).get("print") === "receipt";
        try {
          const key = "ysabellestore.appearance." + scope + ".v1";
          const dark = !safeRoute && localStorage.getItem(key) === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.appearanceScope = scope;
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').content = "#0d1425";
        } catch {
          document.documentElement.dataset.appearanceScope = scope;
        }
      })();
    </script>
    <link rel="icon" href="/brand/favicon.ico?v=fullmark-2e25e00f" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/brand/favicon-16x16.png?v=fullmark-2e25e00f"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32x32.png?v=fullmark-2e25e00f"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/brand/favicon-48x48.png?v=fullmark-2e25e00f"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=a4f0dde2" />
    <link
      rel="preload"
      href="/brand/ysabelle-store-mark-256.png?v=a4f0dde2"
      as="image"
      type="image/png"
    />
    <title>Ysabelle Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
