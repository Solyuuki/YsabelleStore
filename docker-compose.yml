services:
  mysql:
    image: mysql:8.0
    container_name: ysabelle-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ysabelle_store}
      MYSQL_USER: ${MYSQL_USER:-ysabelle_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ysabelle_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ysabelle_root_password}
    volumes:
      - ysabelle_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ysabelle_mysql_data:
