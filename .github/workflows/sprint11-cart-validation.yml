name: Sprint 11 Cart Validation

on:
  push:
    branches:
      - sprint/v0.11/sprint-11

permissions:
  contents: read

jobs:
  cart-operational-validation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      CUSTOMER_OAUTH_TRANSACTION_KEY: ci-only-oauth-transaction-key-32-bytes-minimum
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: sprint/v0.11/sprint-11

    steps:
      - name: Checkout Sprint 11
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            forecasting-service/requirements.txt
            catalog-image-engine/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install -r forecasting-service/requirements.txt
          python -m pip install -r catalog-image-engine/requirements.txt

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build disposable database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Run aggregate code verification
        run: npm run verify:code

      - name: Verify Sprint status
        run: npm run verify:status
