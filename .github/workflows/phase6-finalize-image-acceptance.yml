name: Phase 6 Final Image Acceptance Fix

on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"
    paths:
      - "scripts/phase6-finalize-image-acceptance.mjs"
      - ".github/workflows/phase6-finalize-image-acceptance.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: Close canonical image acceptance gap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 11
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical image acceptance closure
        run: node scripts/phase6-finalize-image-acceptance.mjs

      - name: Stage canonical inputs for state preparation
        shell: bash
        run: |
          git add database/seed/canonical-catalog-v1.sql
          git add database/canonical/releases/g2-s2-c2-a2.json
          git add database/canonical/product-images/candidate-reconciliation.json
          git add scripts/canonical-candidate-reconciliation-security.mjs
          git add scripts/canonical-release-security.mjs
          git add scripts/phase6-release-rehearsal.mjs
          git add database/prisma/MIGRATION_GENERATION_2.md
          git add docs/sprints/sprint-11/README.md

      - name: Prepare versioned canonical state
        run: npm run state:prepare

      - name: Restore immutable previous release
        shell: bash
        run: git restore --source=HEAD --staged --worktree database/canonical/releases/g2-s2-c2-a2.json

      - name: Format changed text sources
        run: npx prettier --write scripts/canonical-candidate-reconciliation-security.mjs scripts/canonical-release-security.mjs scripts/phase6-release-rehearsal.mjs database/prisma/MIGRATION_GENERATION_2.md docs/sprints/sprint-11/README.md

      - name: Stage formatted acceptance sources
        shell: bash
        run: |
          git add scripts/canonical-candidate-reconciliation-security.mjs
          git add scripts/canonical-release-security.mjs
          git add scripts/phase6-release-rehearsal.mjs
          git add database/prisma/MIGRATION_GENERATION_2.md
          git add docs/sprints/sprint-11/README.md

      - name: Verify canonical security
        run: |
          npm run migration:security
          npm run state:security
          npm run release:security
          npm run candidate-reconciliation:security
          npm run asset-distribution:security
          npm run changeset:security

      - name: Remove temporary finalizer
        shell: bash
        run: |
          git rm scripts/phase6-finalize-image-acceptance.mjs
          git rm .github/workflows/phase6-finalize-image-acceptance.yml

      - name: Commit final acceptance closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Staged final files:"
          git diff --cached --name-only
          HUSKY=0 git commit -m "fix(db): close production image acceptance gap"
          HUSKY=0 git push origin HEAD:sprint/v0.11/sprint-11
