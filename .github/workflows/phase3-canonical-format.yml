name: Phase 3 Canonical Format

on:
  push:
    branches:
      - "sprint/**"
    paths:
      - ".github/workflows/phase3-canonical-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Phase 3 canonical files
        run: |
          npx prettier --write \
            database/prisma/state/canonical-state.json \
            database/prisma/state/product-assets.manifest.json \
            database/canonical/releases/g2-s2-c2-a2.json \
            database/canonical/README.md \
            scripts/canonical-release-security.mjs \
            scripts/test/canonical-release-security.test.mjs \
            scripts/migration-upgrade-rehearsal.mjs \
            scripts/canonical-push-guard.mjs \
            scripts/test/canonical-push-guard.test.mjs \
            scripts/verify-code.mjs \
            package.json \
            .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            database/prisma/state/canonical-state.json \
            database/prisma/state/product-assets.manifest.json \
            database/canonical/releases/g2-s2-c2-a2.json \
            database/canonical/README.md \
            scripts/canonical-release-security.mjs \
            scripts/test/canonical-release-security.test.mjs \
            scripts/migration-upgrade-rehearsal.mjs \
            scripts/canonical-push-guard.mjs \
            scripts/test/canonical-push-guard.test.mjs \
            scripts/verify-code.mjs \
            package.json \
            .github/workflows/ci.yml
          HUSKY=0 git commit -m "style(db): format phase 3 canonical release"
          HUSKY=0 git push origin HEAD:${{ github.ref_name }}
