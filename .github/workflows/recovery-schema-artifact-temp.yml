name: Recovery Format Temporary

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-account-recovery"

permissions:
  contents: write

jobs:
  format-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-account-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format recovery-owned files
        run: >-
          npx prettier --write
          backend/src/routes/customerAuth.routes.ts
          backend/src/services/customerPasswordRecoveryService.ts
          backend/test/customer-password-recovery-http.test.ts
          backend/test/customer-password-recovery.test.ts
          docs/superpowers/plans/2026-08-27-customer-account-recovery.md
          frontend/src/pages/customer/CustomerAccountRecoveryPage.tsx
          frontend/src/styles/customer-auth-recovery.css
          scripts/customer-account-recovery-frontend-test.ts
      - run: git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/routes/customerAuth.routes.ts \
            backend/src/services/customerPasswordRecoveryService.ts \
            backend/test/customer-password-recovery-http.test.ts \
            backend/test/customer-password-recovery.test.ts \
            docs/superpowers/plans/2026-08-27-customer-account-recovery.md \
            frontend/src/pages/customer/CustomerAccountRecoveryPage.tsx \
            frontend/src/styles/customer-auth-recovery.css \
            scripts/customer-account-recovery-frontend-test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(auth): format account recovery"
          git push origin HEAD:m1/v0.9/feat/customer-account-recovery
