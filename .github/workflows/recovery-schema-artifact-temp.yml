name: Recovery Status Evidence Temporary

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-account-recovery"

permissions:
  contents: write

jobs:
  recovery-status-evidence:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: m1/v0.9/feat/customer-account-recovery
      YSABELLE_BASE_REF: feature/sprint9-account-security
      YSABELLE_BASE_SHA: 179dfad2986a97f9482ec039f4d8c8e194adfe18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-account-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python image-test dependencies
        run: python -m pip install -r catalog-image-engine/requirements.txt
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate
      - name: Reconfirm aggregate recovery code gate
        run: npm run verify:code
      - name: Generate factual validation evidence
        run: npm run status:update -- --validation Passed
      - name: Verify generated status evidence
        run: npm run verify:status
      - run: git diff --check
      - name: Commit generated evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-artifacts/m1-abarado docs/sprints/sprint-9
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(sprint9): record customer recovery validation evidence"
          HUSKY=0 git push origin HEAD:m1/v0.9/feat/customer-account-recovery
