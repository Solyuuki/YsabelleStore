name: Sprint 7 Phase 2 Frontend Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  customer-auth-frontend:
    if: github.head_ref == 'sprint/v0.7/sprint-7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend customer auth service contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-frontend-test.ts

      - name: Run frontend customer auth UI state contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-ui-contract-test.ts

      - name: Run frontend customer auth form contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-form-contract-test.ts

      - name: Print exact Phase 2 Prettier delta
        run: |
          npx prettier --write \
            frontend/src/components/customer/CustomerHeader.tsx \
            frontend/src/context/CustomerAuthContext.tsx \
            frontend/src/pages/customer/CustomerLoginPage.tsx \
            frontend/src/pages/customer/CustomerRegisterPage.tsx \
            frontend/src/services/customerAuthService.ts \
            scripts/customer-auth-form-contract-test.ts
          git diff --check
          git diff --no-ext-diff -- \
            frontend/src/components/customer/CustomerHeader.tsx \
            frontend/src/context/CustomerAuthContext.tsx \
            frontend/src/pages/customer/CustomerLoginPage.tsx \
            frontend/src/pages/customer/CustomerRegisterPage.tsx \
            frontend/src/services/customerAuthService.ts \
            scripts/customer-auth-form-contract-test.ts
