name: Phase 6 Guardrail Diagnostic

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-social-auth"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-guardrail-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolate-guardrail:
    name: Isolate repository guardrail failure
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      YSABELLE_BRANCH: ${{ github.head_ref || github.ref_name }}
      YSABELLE_BASE_REF: ${{ github.base_ref }}
      YSABELLE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      YSABELLE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: about-storefront-handoff
        run: node --test scripts/test/about-storefront-handoff.test.mjs
      - name: auth-brand-boundary
        run: node --test scripts/test/auth-brand-boundary.test.mjs
      - name: brand-logo-fallback
        run: node --test scripts/test/brand-logo-fallback.test.mjs
      - name: brand-logo-integration
        run: node --test scripts/test/brand-logo-integration.test.mjs
      - name: catalog-image-backfill-ui
        run: node --test scripts/test/catalog-image-backfill-ui.test.mjs
      - name: catalog-image-test-command
        run: node --test scripts/test/catalog-image-test-command.test.mjs
      - name: customer-about-location-premium
        run: node --test scripts/test/customer-about-location-premium.test.mjs
      - name: customer-about-origin-shelf-premium
        run: node --test scripts/test/customer-about-origin-shelf-premium.test.mjs
      - name: customer-about-scroll-stability
        run: node --test scripts/test/customer-about-scroll-stability.test.mjs
      - name: customer-account-storefront-orders-ui
        run: node --test scripts/test/customer-account-storefront-orders-ui.test.mjs
      - name: customer-auth-centered-login-shader
        run: node --test scripts/test/customer-auth-centered-login-shader.test.mjs
      - name: customer-auth-identifier-client
        run: node --test scripts/test/customer-auth-identifier-client.test.mjs
      - name: customer-auth-login-icon
        run: node --test scripts/test/customer-auth-login-icon.test.mjs
      - name: customer-auth-premium-hints
        run: node --test scripts/test/customer-auth-premium-hints.test.mjs
      - name: customer-auth-quick-sign-preview
        run: node --test scripts/test/customer-auth-quick-sign-preview.test.mjs
      - name: customer-auth-register-density
