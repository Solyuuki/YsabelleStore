name: Temporary Category Contract Format

on:
  push:
    branches:
      - "m3/v0.11/fix/customer-support-integration"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3/v0.11/fix/customer-support-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/category-management-frontend-contract-test.ts
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/category-management-frontend-contract-test.ts
          git commit --no-verify -m "style: format category management contract"
          git push --no-verify origin HEAD:m3/v0.11/fix/customer-support-integration
