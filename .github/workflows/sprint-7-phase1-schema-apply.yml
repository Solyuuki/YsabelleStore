name: Sprint 7 Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-formatting:
    if: github.head_ref == 'sprint/v0.7/sprint-7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 7 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.7/sprint-7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize repository formatting
        run: npm run format

      - name: Verify repository formatting
        run: npm run format:check

      - name: Verify whitespace integrity
        run: git diff --check

      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: normalize repository formatting"
          HUSKY=0 git push origin HEAD:sprint/v0.7/sprint-7
