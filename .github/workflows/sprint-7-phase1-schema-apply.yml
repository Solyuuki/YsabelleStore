name: Sprint 7 Format Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-formatting:
    if: github.head_ref == 'sprint/v0.7/sprint-7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 7 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.7/sprint-7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files reported by CI
        run: >-
          npx prettier --write
          .agents/skills/21st-ai/SKILL.md
          .agents/skills/ui-ux-pro-max/SKILL.md
          .github/workflows/sprint-7-phase1-schema-apply.yml
          backend/src/services/customerAuthService.ts
          backend/src/validators/customerAuth.validators.ts
          backend/test/customer-auth.test.ts
          docs/sprints/sprint-6/README.md
          docs/sprints/sprint-6/SPRINT-BACKLOG.md
          docs/sprints/sprint-7
          docs/superpowers/plans/2026-08-22-customer-authentication.md
          docs/superpowers/plans/2026-08-22-ci-guardrail-quality-repair.md
          scripts/agent-ui-skills-test.mjs
          scripts/test/dev-stack-modes.test.mjs
          scripts/test/guardrail-ci-context.test.mjs

      - name: Verify repository formatting
        run: npm run format:check

      - name: Verify whitespace integrity
        run: git diff --check

      - name: Commit formatting repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: normalize Sprint 7 formatting"
          HUSKY=0 git push origin HEAD:sprint/v0.7/sprint-7
