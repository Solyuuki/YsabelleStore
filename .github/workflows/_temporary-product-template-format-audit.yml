name: Temporary Product Template Format Audit
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
jobs:
  format-check-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print canonical Prettier diff
        run: |
          npx prettier --write frontend/src/components/catalog/ProductPackageImportDialog.tsx frontend/src/utils/productPackageTemplate.ts
          git diff --no-ext-diff -- frontend/src/components/catalog/ProductPackageImportDialog.tsx frontend/src/utils/productPackageTemplate.ts
