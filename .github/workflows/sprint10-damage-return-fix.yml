name: Sprint 10 damage return fix

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/sprint10-damage-return-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - name: Apply damage return workflow fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Backend receipt contract: damaged units must carry a human-readable return reason.
          replace_once(
              "backend/src/validators/restock.validators.ts",
              '    damagedQuantity: z.coerce.number().int().min(0).max(1_000_000).default(0),\n    acceptedQuantity:',
              '    damagedQuantity: z.coerce.number().int().min(0).max(1_000_000).default(0),\n    damageReason: optionalTextSchema(240),\n    acceptedQuantity:'
          )
          replace_once(
              "backend/src/validators/restock.validators.ts",
              '    if (line.acceptedQuantity > line.deliveredQuantity - line.damagedQuantity) {',
              '    if (line.damagedQuantity > 0 && !line.damageReason) {\n      context.addIssue({\n        code: z.ZodIssueCode.custom,\n        message: "Damaged units require a return reason.",\n        path: ["damageReason"]\n      });\n    }\n\n    if (line.acceptedQuantity > line.deliveredQuantity - line.damagedQuantity) {'
          )

          # Frontend API contract.
          replace_once(
              "frontend/src/services/restockApi.ts",
              '  damagedQuantity: number;\n  acceptedQuantity:',
              '  damagedQuantity: number;\n  damageReason?: string | null;\n  acceptedQuantity:'
          )

          # Persist return reason in the existing bounded receipt audit note and reuse a verified known cost.
          replace_once(
              "backend/src/services/restockLifecycleService.ts",
              '  damaged: number;\n  accepted: number;',
              '  damaged: number;\n  damageReason?: string | null;\n  accepted: number;'
          )
          replace_once(
              "backend/src/services/restockLifecycleService.ts",
              '    `damaged=${input.damaged}`,\n    `accepted=${input.accepted}`,\n    `other_rejected=${input.rejected}`,',
              '    `damaged=${input.damaged}`,\n    `accepted=${input.accepted}`,\n    `other_rejected=${input.rejected}`,\n    input.damageReason ? `damage_reason=${encodeURIComponent(input.damageReason)}` : null,'
          )
          replace_once(
              "backend/src/services/restockLifecycleService.ts",
              '              select: { id: true, status: true }',
              '              select: {\n                costPrice: true,\n                id: true,\n                inventoryBatches: {\n                  orderBy: { receivedAt: "desc" },\n                  select: { unitCost: true },\n                  take: 1\n                },\n                status: true\n              }'
          )
          replace_once(
              "backend/src/services/restockLifecycleService.ts",
              '            unitCost:\n              receiptLine.unitCost === undefined\n                ? undefined\n                : new Prisma.Decimal(receiptLine.unitCost)',
              '            unitCost:\n              receiptLine.unitCost === undefined\n                ? (orderLine.product.costPrice ?? orderLine.product.inventoryBatches[0]?.unitCost)\n                : new Prisma.Decimal(receiptLine.unitCost)'
          )
          replace_once(
              "backend/src/services/restockLifecycleService.ts",
              '        damaged: receiptLine.damagedQuantity,\n        delivered: receiptLine.deliveredQuantity,',
              '        damaged: receiptLine.damagedQuantity,\n        damageReason: receiptLine.damageReason,\n        delivered: receiptLine.deliveredQuantity,'
          )

          # Receiving UI: one simple reason for the damaged units in this receiving event.
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '  const [exceptionLineIds, setExceptionLineIds] = useState<string[]>([]);\n  const [receiptError,',
              '  const [exceptionLineIds, setExceptionLineIds] = useState<string[]>([]);\n  const [damageReason, setDamageReason] = useState("");\n  const [receiptError,'
          )
          for old in [
              '    setExceptionLineIds([]);\n    setReceiptError(null);\n    setLotDialogOpen(false);',
              '    setExceptionLineIds([]);\n    setReceiptError(null);\n    setLotDialogOpen(false);',
              '    setExceptionLineIds([]);\n    setReceiptError(null);\n  }\n\n  function updateRow'
          ]:
              p = Path("frontend/src/pages/ReceivingPage.tsx")
              text = p.read_text()
              if old not in text:
                  raise SystemExit("Expected receiving reset snippet not found")
              new = old.replace('    setReceiptError(null);', '    setDamageReason("");\n    setReceiptError(null);', 1)
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '      if (damaged > delivered) {\n        throw new Error(`${line.product.name}: damaged units cannot exceed delivered units.`);\n      }',
              '      if (damaged > delivered) {\n        throw new Error(`${line.product.name}: damaged units cannot exceed delivered units.`);\n      }\n\n      if (damaged > 0 && !damageReason.trim()) {\n        throw new Error("Enter a damage / return reason before confirming this delivery.");\n      }'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '        damagedQuantity: damaged,\n        deliveredQuantity: delivered,',
              '        damagedQuantity: damaged,\n        damageReason: damaged > 0 ? damageReason.trim() : null,\n        deliveredQuantity: delivered,'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '      setSelectedOrder(updated);\n      setReceiptMode(null);\n      setReceiptRows(initialReceiptRows(updated));\n      setExceptionLineIds([]);',
              '      if (hasReturns) {\n        setSelectedOrder(null);\n        setReturnReportOrder(updated);\n      } else {\n        setSelectedOrder(updated);\n      }\n      setReceiptMode(null);\n      setReceiptRows(initialReceiptRows(updated));\n      setExceptionLineIds([]);\n      setDamageReason("");'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '                      exceptionLineIds={exceptionLineIds}\n                      mode={receiptMode}\n                      onExceptionChange={setExceptionLineIds}',
              '                      damageReason={damageReason}\n                      exceptionLineIds={exceptionLineIds}\n                      mode={receiptMode}\n                      onDamageReasonChange={setDamageReason}\n                      onExceptionChange={setExceptionLineIds}'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '                      setReceiptRows(initialReceiptRows(selectedOrder));\n                      setExceptionLineIds([]);\n                      setReceiptError(null);',
              '                      setReceiptRows(initialReceiptRows(selectedOrder));\n                      setExceptionLineIds([]);\n                      setDamageReason("");\n                      setReceiptError(null);'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              'function ReceiptEditor({\n  exceptionLineIds,\n  mode,\n  onExceptionChange,',
              'function ReceiptEditor({\n  damageReason,\n  exceptionLineIds,\n  mode,\n  onDamageReasonChange,\n  onExceptionChange,'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '}: {\n  exceptionLineIds: string[];\n  mode: Exclude<ReceiptMode, "complete">;\n  onExceptionChange:',
              '}: {\n  damageReason: string;\n  exceptionLineIds: string[];\n  mode: Exclude<ReceiptMode, "complete">;\n  onDamageReasonChange: (value: string) => void;\n  onExceptionChange:'
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '  const exceptionLines = remainingLines.filter((line) => exceptionLineIds.includes(line.id));\n\n  return (',
              '  const exceptionLines = remainingLines.filter((line) => exceptionLineIds.includes(line.id));\n  const hasDamage = exceptionLines.some((line) => {\n    const row = rows[line.id];\n    return row ? asWholeNumber(row.damagedQuantity) > 0 : false;\n  });\n\n  return ('
          )
          replace_once(
              "frontend/src/pages/ReceivingPage.tsx",
              '      <section className="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">',
              '      {hasDamage ? (\n        <section className="rounded-lg border border-amber-200 bg-amber-50/70 p-4">\n          <Label htmlFor="damage-return-reason">Damage / return reason *</Label>\n          <Input\n            className="mt-1"\n            id="damage-return-reason"\n            maxLength={240}\n            onChange={(event) => onDamageReasonChange(event.target.value)}\n            placeholder="e.g. Dented cans during transport"\n            value={damageReason}\n          />\n          <p className="mt-1.5 text-xs text-amber-800">\n            This reason will appear on the supplier/manufacturer Return Report for every damaged\n            unit in this receiving event.\n          </p>\n        </section>\n      ) : null}\n\n      <section className="flex flex-col gap-3 rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">'
          )

          # Return snapshot now carries the recorded reason plus supplier-facing document metadata.
          p = Path("frontend/src/utils/restockReturnExport.ts")
          text = p.read_text()
          text = text.replace('  damagedQuantity: number;\n  deliveredQuantity:', '  damagedQuantity: number;\n  damageReason: string | null;\n  deliveredQuantity:', 1)
          text = text.replace('export type RestockReturnSnapshot = {\n  generatedAt:', 'export type RestockReturnDocumentInfo = {\n  deliveryReference?: string;\n  supplierName?: string;\n};\n\nexport type RestockReturnSnapshot = {\n  deliveryReference: string;\n  generatedAt:', 1)
          text = text.replace('  returnReference: string;\n  lines:', '  returnReference: string;\n  returnScope: "Damaged items only" | "Entire delivery";\n  supplierName: string;\n  lines:', 1)
          text = text.replace('/\\[Receipt [^\\]]+\\]\\s+delivered=(\\d+)\\s+damaged=(\\d+)\\s+accepted=(\\d+)\\s+other_rejected=(\\d+)/g;', '/\\[Receipt [^\\]]+\\]\\s+delivered=(\\d+)\\s+damaged=(\\d+)\\s+accepted=(\\d+)\\s+other_rejected=(\\d+)(?:\\s+damage_reason=([^\\s]+))?/g;', 1)
          text = text.replace('    rejectedQuantity: 0\n  };', '    rejectedQuantity: 0,\n    damageReason: null as string | null\n  };', 1)
          text = text.replace('    totals.rejectedQuantity += Number(match[4] ?? 0);', '    totals.rejectedQuantity += Number(match[4] ?? 0);\n    if (match[5]) {\n      try {\n        const decoded = decodeURIComponent(match[5]);\n        totals.damageReason = totals.damageReason\n          ? `${totals.damageReason}; ${decoded}`\n          : decoded;\n      } catch {\n        totals.damageReason = totals.damageReason ?? "Damage recorded during receiving";\n      }\n    }', 1)
          text = text.replace('export function buildRestockReturnSnapshot(order: RestockOrder): RestockReturnSnapshot | null {', 'export function buildRestockReturnSnapshot(\n  order: RestockOrder,\n  documentInfo: RestockReturnDocumentInfo = {}\n): RestockReturnSnapshot | null {', 1)
          text = text.replace('  if (lines.length === 0) return null;\n\n  return {\n    generatedAt:', '  if (lines.length === 0) return null;\n\n  const selectedLineCount = order.lines.filter((line) => line.isSelected).length;\n  const returnScope =\n    lines.length === selectedLineCount &&\n    lines.every((line) => line.deliveredQuantity > 0 && line.returnQuantity === line.deliveredQuantity)\n      ? "Entire delivery"\n      : "Damaged items only";\n\n  return {\n    deliveryReference: documentInfo.deliveryReference?.trim() ?? "",\n    generatedAt:', 1)
          text = text.replace('    returnReference: `RETURN-${order.orderNumber.replace(/^RO-/, "")}`\n  };', '    returnReference: `RETURN-${order.orderNumber.replace(/^RO-/, "")}`,\n    returnScope,\n    supplierName: documentInfo.supplierName?.trim() ?? ""\n  };', 1)
          text = text.replace('    ["Restock ticket", snapshot.orderNumber],\n    ["Generated",', '    ["Restock ticket", snapshot.orderNumber],\n    ["Supplier / Manufacturer", snapshot.supplierName],\n    ["Delivery / Invoice reference", snapshot.deliveryReference],\n    ["Return scope", snapshot.returnScope],\n    ["Generated",', 1)
          old_reason = '      line.damagedQuantity > 0 && line.rejectedQuantity > 0\n        ? "Damaged / rejected during receiving"\n        : line.damagedQuantity > 0\n          ? "Damaged on arrival"\n          : "Rejected during receiving"'
          text = text.replace(old_reason, '      line.damageReason ??\n        (line.damagedQuantity > 0 && line.rejectedQuantity > 0\n          ? "Damaged / rejected during receiving"\n          : line.damagedQuantity > 0\n            ? "Damaged on arrival"\n            : "Rejected during receiving")', 1)
          text = text.replace('      const reason =\n        line.damagedQuantity > 0 && line.rejectedQuantity > 0', '      const reason =\n        line.damageReason ??\n        (line.damagedQuantity > 0 && line.rejectedQuantity > 0', 1)
          text = text.replace('            ? "Damaged on arrival"\n            : "Rejected during receiving";\n      return `<tr>', '            ? "Damaged on arrival"\n            : "Rejected during receiving");\n      return `<tr>', 1)
          text = text.replace('<span class="label">Generated</span><span>${escapeHtml(generatedAtFormatter.format(new Date(snapshot.generatedAt)))}</span>', '<span class="label">Generated</span><span>${escapeHtml(generatedAtFormatter.format(new Date(snapshot.generatedAt)))}</span>\n      <span class="label">Return scope</span><span>${escapeHtml(snapshot.returnScope)}</span>', 1)
          text = text.replace('<div class="supplier"><strong>Supplier / Manufacturer:</strong> ________________________________________________</div>', '<div class="supplier"><strong>Supplier / Manufacturer:</strong> ${escapeHtml(snapshot.supplierName || "Not provided")}<br/><span class="muted">Delivery / Invoice reference:</span> ${escapeHtml(snapshot.deliveryReference || "Not provided")}</div>', 1)
          p.write_text(text)

          # PDF uses the same supplier information, scope and recorded reason.
          p = Path("frontend/src/utils/restockReturnPdf.ts")
          text = p.read_text()
          text = text.replace('  doc.text("Generated", metaX, 21);', '  doc.text("Generated", metaX, 21);\n  doc.text("Return scope", metaX, 26);', 1)
          text = text.replace('  doc.text(dateTimeFormatter.format(new Date(snapshot.generatedAt)), 146, 21);', '  doc.text(dateTimeFormatter.format(new Date(snapshot.generatedAt)), 146, 21);\n  doc.text(snapshot.returnScope, 146, 26);', 1)
          text = text.replace('  doc.text("Supplier / Manufacturer:", margin + 3, 40);\n  doc.setLineWidth(0.2);\n  doc.line(margin + 42, 40.5, pageWidth - margin - 3, 40.5);', '  doc.text("Supplier / Manufacturer:", margin + 3, 40);\n  doc.setFont("helvetica", "normal");\n  doc.text(snapshot.supplierName || "Not provided", margin + 42, 40);\n  if (snapshot.deliveryReference) {\n    doc.setFontSize(7);\n    doc.setTextColor(100, 116, 139);\n    doc.text(`Delivery / Invoice reference: ${snapshot.deliveryReference}`, margin + 3, 43);\n  }', 1)
          old_pdf_reason = '      line.damagedQuantity > 0 && line.rejectedQuantity > 0\n        ? "Damaged / rejected"\n        : line.damagedQuantity > 0\n          ? "Damaged on arrival"\n          : "Rejected during receiving"'
          text = text.replace(old_pdf_reason, '      line.damageReason ??\n        (line.damagedQuantity > 0 && line.rejectedQuantity > 0\n          ? "Damaged / rejected"\n          : line.damagedQuantity > 0\n            ? "Damaged on arrival"\n            : "Rejected during receiving")', 1)
          p.write_text(text)

          # Return report dialog asks only for the supplier/manufacturer identity and optional reference.
          p = Path("frontend/src/components/receiving/ReturnReportDialog.tsx")
          text = p.read_text()
          text = text.replace('import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";', 1)
          text = text.replace('import { Button } from "@/components/ui/button";', 'import { Button } from "@/components/ui/button";\nimport { Input } from "@/components/ui/input";\nimport { Label } from "@/components/ui/label";', 1)
          text = text.replace('  const [error, setError] = useState<string | null>(null);\n  const snapshot = useMemo(() => (order ? buildRestockReturnSnapshot(order) : null), [order]);', '  const [error, setError] = useState<string | null>(null);\n  const [supplierName, setSupplierName] = useState("");\n  const [deliveryReference, setDeliveryReference] = useState("");\n  const snapshot = useMemo(\n    () =>\n      order\n        ? buildRestockReturnSnapshot(order, { deliveryReference, supplierName })\n        : null,\n    [deliveryReference, order, supplierName]\n  );\n  const canExport = supplierName.trim().length >= 2;\n\n  useEffect(() => {\n    setSupplierName("");\n    setDeliveryReference("");\n    setError(null);\n  }, [order?.id]);', 1)
          text = text.replace('              <div>\n                <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">\n                  Export format', '              <div className="grid gap-4 sm:grid-cols-2">\n                <div>\n                  <Label htmlFor="return-supplier">Supplier / manufacturer *</Label>\n                  <Input\n                    className="mt-1"\n                    id="return-supplier"\n                    maxLength={160}\n                    onChange={(event) => setSupplierName(event.target.value)}\n                    placeholder="Supplier or manufacturer name"\n                    value={supplierName}\n                  />\n                </div>\n                <div>\n                  <Label htmlFor="return-delivery-reference">Delivery / invoice reference</Label>\n                  <Input\n                    className="mt-1"\n                    id="return-delivery-reference"\n                    maxLength={120}\n                    onChange={(event) => setDeliveryReference(event.target.value)}\n                    placeholder="Optional DR / invoice number"\n                    value={deliveryReference}\n                  />\n                </div>\n              </div>\n\n              <div>\n                <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">\n                  Export format', 1)
          text = text.replace('disabled={busy !== null}', 'disabled={busy !== null || !canExport}')
          p.write_text(text)

          # Tight regression coverage for the simple damage -> reason -> return report behavior.
          p = Path("scripts/restock-phase7-9-ui-contract-test.ts")
          text = p.read_text()
          marker = 'assert.match(receivingSource, /ReturnReportDialog/);'
          if marker in text and 'damage \/ return reason' not in text:
              text = text.replace(marker, marker + '\nassert.match(receivingSource, /Damage \\/ return reason/);\nassert.match(receivingSource, /setReturnReportOrder\\(updated\\)/);', 1)
          marker2 = 'assert.match(returnDialogSource, /Excel-compatible CSV/);'
          if marker2 in text and 'Supplier \/ manufacturer' not in text:
              text = text.replace(marker2, marker2 + '\nassert.match(returnDialogSource, /Supplier \\/ manufacturer/);', 1)
          p.write_text(text)

          # Self-remove helper so the final branch contains no temporary workflow.
          Path(".github/workflows/sprint10-damage-return-fix.yml").unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "ysabelle-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(receiving): streamline damaged return reporting"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
