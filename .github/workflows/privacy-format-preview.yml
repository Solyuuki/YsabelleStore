name: Privacy Format Preview
on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"
    paths:
      - ".github/workflows/privacy-format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write frontend/src/components/customer/PrivacyNotice.tsx
          git diff -- frontend/src/components/customer/PrivacyNotice.tsx
