name: UAT Formatting Diff (Temporary)
on:
  push:
    branches:
      - "m1/v0.13/fix/uat-compatibility-and-usability"
permissions:
  contents: read
jobs:
  preview-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install formatter
        run: npm install --no-save --ignore-scripts --no-audit --no-fund prettier@3.6.2
      - name: Print exact Prettier patch without committing
        run: |
          npx prettier --write frontend/src/pages/customer/CheckoutPage.tsx frontend/src/styles/theme-retail.css scripts/test/uat-compatibility-density.test.mjs
          git diff --unified=2 -- frontend/src/pages/customer/CheckoutPage.tsx frontend/src/styles/theme-retail.css scripts/test/uat-compatibility-density.test.mjs
