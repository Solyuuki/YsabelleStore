name: Sprint 10 Receiving Prettier

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  format-receiving:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sprint branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Receiving page
        run: npx prettier --write frontend/src/pages/ReceivingPage.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/ReceivingPage.tsx; then
            echo "ReceivingPage.tsx is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReceivingPage.tsx
          git commit -m "style(receiving): normalize production UI"
          git push origin HEAD:sprint/v0.10/sprint-10
