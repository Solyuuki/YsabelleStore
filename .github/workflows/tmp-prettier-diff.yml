name: Temporary Prettier Diff

on:
  push:
    branches:
      - m1/v0.9/feat/customer-mobile-otp
    paths:
      - .github/workflows/tmp-prettier-diff.yml

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write \
            backend/src/controllers/customerRememberedAuthController.ts \
            backend/test/customer-email-delivery.test.ts \
            frontend/src/components/customer/CustomerKnownAccounts.tsx \
            frontend/src/pages/customer/CustomerRegisterPage.tsx \
            frontend/src/styles/customer-known-accounts.css
          git diff -- \
            backend/src/controllers/customerRememberedAuthController.ts \
            backend/test/customer-email-delivery.test.ts \
            frontend/src/components/customer/CustomerKnownAccounts.tsx \
            frontend/src/pages/customer/CustomerRegisterPage.tsx \
            frontend/src/styles/customer-known-accounts.css
