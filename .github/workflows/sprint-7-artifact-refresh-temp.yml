name: Sprint 7 Integration Evidence Refresh

on:
  pull_request:
    branches:
      - sprint/v0.7/sprint-7

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
  JWT_SECRET: sprint-7-integration-evidence-secret
  FRONTEND_URL: http://localhost:5173
  YSABELLE_BRANCH: m1/v0.7/fix/sprint6-sprint7-integration
  YSABELLE_BASE_REF: sprint/v0.7/sprint-7

concurrency:
  group: sprint-7-integration-evidence-refresh
  cancel-in-progress: true

jobs:
  refresh-evidence:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout writable integration branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.7/fix/sprint6-sprint7-integration
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin sprint/v0.7/sprint-7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r catalog-image-engine/requirements.txt

      - name: Format temporary workflow for aggregate verification
        run: npx prettier --write .github/workflows/sprint-7-artifact-refresh-temp.yml

      - name: Build disposable CI database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Verify exact integration tree
        run: npm run verify:code

      - name: Generate truthful validation evidence
        run: |
          node scripts/artifact-update.mjs --validation Passed
          npx prettier --write docs/implementation-artifacts/m1-abarado/*.md
          npm run verify:status

      - name: Commit generated evidence and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/sprint-7-artifact-refresh-temp.yml
          git add docs/implementation-artifacts/m1-abarado .github/workflows/sprint-7-artifact-refresh-temp.yml
          git diff --cached --check
          git commit -m "docs(sprint7): record integration validation evidence"

      - name: Push generated evidence
        env:
          HUSKY: "0"
        run: git push origin HEAD:m1/v0.7/fix/sprint6-sprint7-integration
