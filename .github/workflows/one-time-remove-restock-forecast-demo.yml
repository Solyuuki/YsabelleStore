name: Remove temporary restock forecast demo once

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/one-time-remove-restock-forecast-demo.yml

permissions:
  contents: write

jobs:
  cleanup-restock-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Remove temporary forecast demo
        run: node scripts/remove-restock-forecast-demo.mjs

      - name: Format updated component
        run: npx prettier --write frontend/src/components/reports/RestockForecastPanel.tsx

      - name: Remove one-time cleanup files
        run: |
          rm scripts/remove-restock-forecast-demo.mjs
          rm .github/workflows/one-time-remove-restock-forecast-demo.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore(reports): remove temporary forecast demo"
          git push origin HEAD:sprint/v0.10/sprint-10
