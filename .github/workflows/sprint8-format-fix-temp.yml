name: Sprint 8 Formatting Repair

on:
  push:
    branches:
      - sprint/v0.8/sprint-8

permissions:
  contents: write

concurrency:
  group: sprint8-format-fix
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 8
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.8/sprint-8
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format exact failing files
        run: |
          npx prettier --write \
            backend/src/middleware/errorHandler.ts \
            backend/test/error-handler-security.test.ts \
            docs/sprints/sprint-8/INTEGRATION-CONFLICTS.md \
            scripts/test/server-reliability-contract.test.mjs
          git diff --check
      - name: Commit formatting and remove temporary workflow
        run: |
          rm -f .github/workflows/sprint8-format-fix-temp.yml
          git add backend/src/middleware/errorHandler.ts backend/test/error-handler-security.test.ts docs/sprints/sprint-8/INTEGRATION-CONFLICTS.md scripts/test/server-reliability-contract.test.mjs .github/workflows/sprint8-format-fix-temp.yml
          git diff --cached --check
          git commit -m "style(sprint8): format reliability integration files"
      - name: Push verified formatting repair
        env:
          HUSKY: "0"
        run: git push origin HEAD:sprint/v0.8/sprint-8
