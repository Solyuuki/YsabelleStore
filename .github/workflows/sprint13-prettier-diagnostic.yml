name: Sprint 13 Prettier Diagnostic (temporary)
on:
  push:
    branches:
      - sprint/v0.13/sprint-13
    paths:
      - .github/workflows/sprint13-prettier-diagnostic.yml
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show exact CSS formatter diff
        run: |
          npx prettier --write frontend/src/styles/theme-storefront-contrast.css
          git --no-pager diff -- frontend/src/styles/theme-storefront-contrast.css
