name: Calendar Format Autofix

on:
  push:
    branches:
      - sprint/v0.11/sprint-11
    paths:
      - backend/src/services/dashboardSalesCalendarService.ts
      - backend/src/services/forecastTargetService.ts
      - backend/test/forecast-delivery.test.ts
      - frontend/src/components/dashboard/SalesPulseCard.tsx
      - .github/workflows/calendar-format-autofix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.11/sprint-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format calendar implementation files
        run: |
          npx prettier --write \
            backend/src/services/dashboardSalesCalendarService.ts \
            backend/src/services/forecastTargetService.ts \
            backend/test/forecast-delivery.test.ts \
            frontend/src/components/dashboard/SalesPulseCard.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/services/dashboardSalesCalendarService.ts \
            backend/src/services/forecastTargetService.ts \
            backend/test/forecast-delivery.test.ts \
            frontend/src/components/dashboard/SalesPulseCard.tsx
          git commit -m "style(calendar): apply prettier formatting"
          git push --no-verify origin HEAD:sprint/v0.11/sprint-11
