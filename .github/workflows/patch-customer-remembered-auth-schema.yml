name: Patch remembered customer auth schema

on:
  push:
    branches:
      - m1/v0.9/feat/customer-mobile-otp
    paths:
      - .github/workflows/patch-customer-remembered-auth-schema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-mobile-otp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply schema patch
        run: node scripts/patch-customer-remembered-auth-schema.mjs
      - name: Validate generated schema text
        run: |
          grep -q 'model CustomerRememberedAuth' database/prisma/schema.prisma
          grep -q 'enum CustomerRememberedAuthMethod' database/prisma/schema.prisma
          test -f database/prisma/migrations/20260831190000_customer_remembered_quick_sign/migration.sql
      - name: Commit schema patch and remove temporary runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(auth): persist remembered customer trust'
          git push origin HEAD:m1/v0.9/feat/customer-mobile-otp
