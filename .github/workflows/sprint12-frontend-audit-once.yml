name: Sprint 12 frontend contract diagnostic
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
    paths:
      - .github/workflows/sprint12-frontend-audit-once.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Execute all frontend workspace contracts without early exit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('frontend/package.json','utf8'));
          const checks = pkg.scripts.test.split(' && ');
          const env = {...process.env, NODE_ENV:'test', PATH:path.resolve('node_modules/.bin') + ':' + process.env.PATH};
          let failures = 0;
          for (const [index, cmd] of checks.entries()) {
            const res = spawnSync(cmd, {cwd:path.resolve('frontend'),shell:true,encoding:'utf8',env,maxBuffer:15*1024*1024});
            const label = cmd.replace(/^tsx\s+--tsconfig\s+\S+\s+/, '');
            if (res.status===0) {console.log('PASS '+(index+1)+'/'+checks.length+' '+label);continue;}
            failures++;
            const output=(res.stdout||'')+'\n'+(res.stderr||'');
            const lines=output.split('\n');
            const errors=lines.filter(x=>/AssertionError|Error \[|SyntaxError|TypeError|The input did not match|not ok |Expected|ERR_ASSERTION/.test(x));
            console.log('FAIL '+(index+1)+'/'+checks.length+' '+label+' :: '+(errors.slice(0,2).join(' | ')||lines.slice(-8).join(' ')).slice(0,420));
          }
          console.log('FRONTEND_CONTRACT_SUMMARY: '+(checks.length-failures)+' passed, '+failures+' failed, '+checks.length+' total.');
          if (failures) process.exitCode=1;
          NODE
