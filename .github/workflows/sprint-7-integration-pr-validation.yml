name: Sprint 7 Integration PR Validation

on:
  pull_request:
    branches:
      - sprint/v0.7/sprint-7

permissions:
  contents: read

concurrency:
  group: sprint-7-integration-pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  resolved-merge:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: sprint-7-integration-pr-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: m1/v0.7/fix/sprint6-sprint7-integration
      YSABELLE_BASE_REF: sprint/v0.7/sprint-7
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.7/fix/sprint6-sprint7-integration
          fetch-depth: 0

      - name: Merge Sprint 6 and resolve exact conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin sprint/v0.6/sprint-6

          if git merge-base --is-ancestor origin/sprint/v0.6/sprint-6 HEAD; then
            echo "Sprint 6 already integrated."
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/sprint/v0.6/sprint-6
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "backend/package.json"
              "backend/src/controllers/storefrontController.ts"
              "docs/sprints/sprint-6/SPRINT-BACKLOG.md"
              "frontend/package.json"
              "frontend/src/app/CustomerApp.tsx"
              "frontend/src/components/customer/CustomerHeader.tsx"
            )
            printf '%s\n' "${conflicts[@]}" | sort > /tmp/actual.txt
            printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
            diff -u /tmp/expected.txt /tmp/actual.txt

            git checkout --ours backend/package.json
            git checkout --ours backend/src/controllers/storefrontController.ts
            git checkout --theirs docs/sprints/sprint-6/SPRINT-BACKLOG.md
            git checkout --ours frontend/package.json
            git checkout --ours frontend/src/app/CustomerApp.tsx
            git checkout --ours frontend/src/components/customer/CustomerHeader.tsx
          fi

          node <<'NODE'
          const fs = require('fs');
          const backend = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
          backend.scripts.test = [
            'tsx --test --test-concurrency=1',
            'test/auth-security.test.ts', 'test/customer-auth.test.ts',
            'test/customer-auth-http.test.ts', 'test/customer-order-account.test.ts',
            'test/cors.test.ts', 'test/catalog-image-process-gate.test.ts',
            'test/catalog-image-engine-runner.test.ts', 'test/catalog-image-storage.test.ts',
            'test/catalog-image-foundation.test.ts', 'test/catalog-image-approval.test.ts',
            'test/catalog-image-storefront.test.ts', 'test/catalog-image-url.test.ts',
            'test/catalog-image-backfill.test.ts', 'test/catalog-image-latest-candidate.test.ts',
            'test/catalog-quality.test.ts', 'test/data-flow.test.ts', 'test/storefront.test.ts',
            'test/storefront-product-detail.test.ts', 'test/forecast-delivery.test.ts',
            'test/forecast-fallback.test.ts', 'test/historical-sales-rules.test.ts',
            'test/inventory-import.test.ts'
          ].join(' ');
          backend.scripts.lint = 'eslint src test';
          fs.writeFileSync('backend/package.json', JSON.stringify(backend, null, 2) + '\n');

          const frontend = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
          frontend.scripts.lint = 'eslint src vite.config.ts tailwind.config.ts postcss.config.js';
          fs.writeFileSync('frontend/package.json', JSON.stringify(frontend, null, 2) + '\n');
          NODE

          python <<'PY'
          from pathlib import Path

          p = Path('backend/src/controllers/storefrontController.ts')
          s = p.read_text()
          auth = 'import { getAuthenticatedCustomer } from "../middleware/customerAuthMiddleware.js";\n'
          ciqe = 'import { resolveProductDetailImageUrl } from "../modules/catalog-image/catalogImageUrls.js";\n'
          if ciqe not in s:
              if auth not in s: raise SystemExit('missing auth import anchor')
              s = s.replace(auth, auth + ciqe)
          old = '    const product = await getStorefrontProduct(params.id);\n    response.json(createSuccessResponse("Storefront product loaded.", product));'
          new = '    const product = await getStorefrontProduct(params.id);\n    response.json(\n      createSuccessResponse("Storefront product loaded.", {\n        ...product,\n        detailImageUrl: resolveProductDetailImageUrl(product.imageUrl)\n      })\n    );'
          if old in s: s = s.replace(old, new)
          elif 'detailImageUrl: resolveProductDetailImageUrl(product.imageUrl)' not in s:
              raise SystemExit('missing product-detail merge anchor')
          p.write_text(s)

          p = Path('frontend/src/app/CustomerApp.tsx')
          s = p.read_text()
          anchor = 'import { CustomerLayout } from "@/layouts/CustomerLayout";\n'
          about = 'import { AboutExperiencePage } from "@/pages/customer/AboutExperiencePage";\n'
          if about not in s: s = s.replace(anchor, anchor + about)
          s = s.replace(
              'import "@/styles/customer.css";\nimport "@/styles/customer-auth.css";\n',
              'import "driver.js/dist/driver.css";\nimport "@/styles/customer.css";\nimport "@/styles/customer-auth.css";\nimport "@/styles/brand.css";\nimport "@/styles/shopping-guide.css";\n'
          )
          old = '  const pathname = new URL(location, window.location.origin).pathname.replace(/\\/$/, "") || "/";'
          new = '  const rawPathname =\n    new URL(location, window.location.origin).pathname.replace(/\\/$/, "") || "/";\n  const pathname =\n    window.location.protocol === "file:" && rawPathname.endsWith("/index.html")\n      ? "/"\n      : rawPathname;'
          if old in s: s = s.replace(old, new)
          elif 'rawPathname.endsWith("/index.html")' not in s: raise SystemExit('missing pathname anchor')
          s = s.replace(
              '  else if (pathname === "/about") page = <DiscoverPage navigate={navigate} />;',
              '  else if (pathname === "/about") page = <AboutExperiencePage navigate={navigate} />;'
          )
          p.write_text(s)

          p = Path('frontend/src/components/customer/CustomerHeader.tsx')
          s = p.read_text()
          s = s.replace(
              'import { CircleHelp, Menu, ShoppingBasket, Store, UserRound, X } from "lucide-react";',
              'import { CircleHelp, Menu, ShoppingBasket, UserRound, X } from "lucide-react";'
          )
          anchor = 'import { GlobalStorefrontSearch } from "./GlobalStorefrontSearch";\n'
          brand = 'import { YsabelleBrandMark } from "./YsabelleBrandMark";\n'
          if brand not in s: s = s.replace(anchor, anchor + brand)
          old = '          <span className="customer-brand__mark">\n            <Store aria-hidden="true" size={22} />\n          </span>'
          if old in s: s = s.replace(old, '          <YsabelleBrandMark eager />')
          elif '<YsabelleBrandMark eager />' not in s: raise SystemExit('missing brand anchor')
          p.write_text(s)
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install CIQE dependencies
        run: python -m pip install -r catalog-image-engine/requirements.txt

      - name: Format resolved integration surface
        run: >-
          npx prettier --write
          .github/workflows/sprint-7-integration-format.yml
          .github/workflows/sprint-7-integration-pr-validation.yml
          .github/workflows/sprint-7-integration-resolution.yml
          backend/package.json
          backend/src/controllers/storefrontController.ts
          docs/sprints/sprint-6/SPRINT-BACKLOG.md
          frontend/package.json
          frontend/src/app/CustomerApp.tsx
          frontend/src/components/customer/CustomerHeader.tsx
          scripts/brand-assets-test.mjs

      - name: Prisma generate and validate
        run: npm run prisma:generate && npm run prisma:validate

      - name: Build disposable database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Focused Sprint 6 and Sprint 7 regressions
        run: >-
          npx tsx --test --test-concurrency=1
          backend/test/auth-security.test.ts backend/test/customer-auth.test.ts
          backend/test/customer-auth-http.test.ts backend/test/customer-order-account.test.ts
          backend/test/catalog-image-process-gate.test.ts backend/test/catalog-image-engine-runner.test.ts
          backend/test/catalog-image-storage.test.ts backend/test/catalog-image-foundation.test.ts
          backend/test/catalog-image-approval.test.ts backend/test/catalog-image-storefront.test.ts
          backend/test/catalog-image-url.test.ts backend/test/catalog-image-backfill.test.ts
          backend/test/catalog-image-latest-candidate.test.ts

      - name: CIQE Python regressions
        run: npm run catalog-images:test

      - name: Backend workspace regressions
        run: npm test --workspace @ysabellestore/backend

      - name: Frontend auth regressions
        run: npm test --workspace @ysabellestore/frontend

      - name: Repository quality gates
        run: npm run format:check && npm run lint && npm run typecheck && npm run test:guardrails && npm run build

      - name: Production security audit
        run: npm run security:audit:production

      - name: Full read-only verification
        run: npm run verify:code
