name: Sprint 7 Dependency Remediation

on:
  push:
    branches:
      - sprint/v0.7/sprint-7

permissions:
  contents: write

concurrency:
  group: sprint7-dependency-remediation
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: sprint7-dependency-remediation-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout Sprint 7
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.7/sprint-7
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current dependencies
        run: |
          npm ci
          python -m pip install -r catalog-image-engine/requirements.txt

      - name: Reproduce high-severity audit finding
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the current dependency tree to reproduce the reported high-severity audit finding."
            exit 1
          fi
          echo "Confirmed: current Sprint 7 dependency tree reproduces a high-severity npm audit finding."

      - name: Apply narrow deepmerge-ts security override
        run: |
          npm pkg set overrides.deepmerge-ts=8.0.0
          npm install --package-lock-only
          npx prettier --write package.json package-lock.json .github/workflows/sprint7-dependency-audit-temp.yml .github/workflows/sprint7-dependency-remediation-temp.yml

      - name: Reinstall remediated dependency tree
        run: npm ci

      - name: Verify high-severity audit is cleared
        run: |
          npm audit --audit-level=high
          npm run security:audit
          npm run security:audit:production

      - name: Verify Prisma compatibility
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Run full repository verification
        run: |
          npm run verify:code
          npm run verify:status

      - name: Commit remediation and remove temporary workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/sprint7-dependency-audit-temp.yml
          rm -f .github/workflows/sprint7-dependency-remediation-temp.yml
          git add package.json package-lock.json .github/workflows/sprint7-dependency-audit-temp.yml .github/workflows/sprint7-dependency-remediation-temp.yml
          git diff --cached --check
          git commit -m "fix(security): clear Sprint 7 dependency audit findings"

      - name: Push verified remediation
        env:
          HUSKY: "0"
        run: git push origin HEAD:sprint/v0.7/sprint-7
