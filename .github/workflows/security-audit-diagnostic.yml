name: Security Audit Diagnostic

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/security-audit-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Show resolved vulnerable-package versions
        shell: bash
        run: |
          npm ls @xmldom/xmldom baseline-browser-mapping body-parser browserslist express fast-uri qs --all || true
      - name: Capture current npm audit report
        shell: bash
        run: |
          npm audit --json > audit-before.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-before.json', 'utf8'));
          console.log('BEFORE', JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          NODE
      - name: Dry safe audit remediation into lockfile
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          echo "--- package manifest / lock diff ---"
          git diff -- package.json package-lock.json frontend/package.json backend/package.json electron/package.json || true
      - name: Verify audit after lockfile remediation
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('AFTER', JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(name, v.severity, v.range, JSON.stringify(v.fixAvailable));
          }
          NODE
