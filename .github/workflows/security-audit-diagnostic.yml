name: Security Audit Diagnostic

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/security-audit-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Apply safe lockfile-only audit remediation
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify zero npm audit findings
        shell: bash
        run: |
          npm audit --json > audit-after.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const findings = report.metadata?.vulnerabilities ?? {};
          console.log('AUDIT AFTER FIX', JSON.stringify(findings, null, 2));
          if ((findings.total ?? 0) !== 0) {
            process.exit(1);
          }
          NODE
      - name: Commit lockfile remediation and remove diagnostic workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-audit-diagnostic.yml
          git add package-lock.json
          HUSKY=0 git commit -m "fix(security): refresh vulnerable transitive lock resolutions"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
