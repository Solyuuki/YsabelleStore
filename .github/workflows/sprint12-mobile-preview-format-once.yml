name: Sprint 12 mobile preview test format repair
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
    paths:
      - .github/workflows/sprint12-mobile-preview-format-once.yml
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format exact failing test with repo-pinned Prettier
        run: npx prettier --write scripts/test/mobile-preview.test.mjs
      - name: Verify formatting, code lint, and mobile test
        run: |
          npx prettier --check scripts/test/mobile-preview.test.mjs
          npm run lint
          node --test scripts/test/mobile-preview.test.mjs
          git diff --check
      - name: Commit exact formatted test without changing production code
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'sprint/v0.12/sprint-12';
            const expectedSha = context.sha;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
            if (current.data.object.sha !== expectedSha) {
              throw new Error('Branch advanced. Rejecting stale write.');
            }
            const target = 'scripts/test/mobile-preview.test.mjs';
            const contents = fs.readFileSync(target, 'utf8');
            const original = await github.rest.repos.getContent({
              owner, repo, path: target, ref: expectedSha
            });
            if (Array.isArray(original.data)) throw new Error('Expected file');
            const oldContents = Buffer.from(original.data.content, 'base64').toString('utf8');
            if (oldContents === contents) {
              core.info('File already formatted; no commit required');
              return;
            }
            const blob = await github.rest.git.createBlob({
              owner, repo, content: Buffer.from(contents).toString('base64'), encoding: 'base64'
            });
            const base = await github.rest.git.getCommit({ owner, repo, commit_sha: expectedSha });
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: base.data.tree.sha,
              tree: [{ path: target, mode: '100644', type: 'blob', sha: blob.data.sha }]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'chore(format): align mobile preview test with Prettier',
              tree: tree.data.sha, parents: [expectedSha]
            });
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: false
            });
            core.info('Committed verified Prettier-only repair: ' + commit.data.sha);
