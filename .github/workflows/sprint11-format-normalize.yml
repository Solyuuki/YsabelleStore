name: Sprint 11 Format Normalize

on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"
    paths:
      - ".github/workflows/sprint11-format-normalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.11/sprint-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize repository formatting
        run: npx prettier --write .
      - name: Verify repository formatting
        run: npx prettier --check .
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add .github/workflows/sprint11-format-normalize.yml
          HUSKY=0 git commit -m "style: normalize sprint 11 repository formatting"
          HUSKY=0 git push origin HEAD:sprint/v0.11/sprint-11
