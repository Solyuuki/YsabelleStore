name: Phase 6 Format

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/phase6-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply report download selector QoL pass
        run: python scripts/apply-report-download-selector-qol.py
      - name: Format report selector changes
        run: npx prettier --write frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/ReportDownloadDialog.tsx frontend/src/utils/reportExport.ts frontend/src/services/restockApi.ts scripts/restock-phase4-6-ui-contract-test.ts
      - name: Verify formatting
        run: npx prettier --check frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/ReportDownloadDialog.tsx frontend/src/utils/reportExport.ts frontend/src/services/restockApi.ts scripts/restock-phase4-6-ui-contract-test.ts
      - name: Run frontend contracts
        run: npm run test --workspace frontend
      - name: Build frontend
        run: npm run build --workspace frontend
      - name: Commit report selector pass if needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/ReportDownloadDialog.tsx frontend/src/utils/reportExport.ts frontend/src/services/restockApi.ts scripts/restock-phase4-6-ui-contract-test.ts; then
            echo "Report selector changes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/ReportDownloadDialog.tsx frontend/src/utils/reportExport.ts frontend/src/services/restockApi.ts scripts/restock-phase4-6-ui-contract-test.ts
          HUSKY=0 git commit -m "feat(reports): separate downloadable report types"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
