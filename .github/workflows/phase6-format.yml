name: Phase 6 Format

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/phase6-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reports QoL density pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reports_path = Path("frontend/src/pages/ReportsPage.tsx")
          reports = reports_path.read_text()

          old_recharts = 'import { Cell, Pie, PieChart, ResponsiveContainer } from "recharts";'
          new_recharts = 'import { Bar, BarChart, Cell, Pie, PieChart, ResponsiveContainer } from "recharts";'
          if old_recharts not in reports:
              raise SystemExit("Reports Recharts import marker not found")
          reports = reports.replace(old_recharts, new_recharts, 1)

          metric_marker = '''  const averageReceipt = completedSales.length > 0 ? recentGrossSales / completedSales.length : 0;

  const stats = summary'''
          metric_replacement = '''  const averageReceipt = completedSales.length > 0 ? recentGrossSales / completedSales.length : 0;
  const recentReceiptChartData = useMemo(
    () =>
      completedSales
        .slice(0, 8)
        .reverse()
        .map((sale, index) => ({
          amount: Number(sale.totalAmount),
          receipt: `Receipt ${index + 1}`
        })),
    [completedSales]
  );

  const stats = summary'''
          if metric_marker not in reports:
              raise SystemExit("Recent receipt metric insertion marker not found")
          reports = reports.replace(metric_marker, metric_replacement, 1)

          secondary_start = reports.index('          <section className="grid items-start gap-4 xl:grid-cols-[0.9fr_1.1fr]">')
          card_start = reports.index("            <Card>", secondary_start)
          card_end = reports.index("\n\n            <InventoryHealthCard", card_start)
          compact_receipts = '''            <Card>
              <CardHeader className="pb-2">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <CardTitle>Recent receipt metrics</CardTitle>
                  <StatusBadge variant={completedSales.length > 0 ? "success" : "info"}>
                    {completedSales.length > 0
                      ? `${completedSales.length.toLocaleString()} receipt${completedSales.length === 1 ? "" : "s"}`
                      : "No sales yet"}
                  </StatusBadge>
                </div>
              </CardHeader>
              <CardContent>
                <div className="grid gap-4 sm:grid-cols-[minmax(0,1fr)_180px] sm:items-end">
                  <div className="min-w-0">
                    <p className="text-xs text-slate-500">Gross sales</p>
                    <p className="mt-1 text-2xl font-semibold text-slate-950">
                      {currency(recentGrossSales)}
                    </p>
                    <div className="mt-3 grid grid-cols-2 gap-x-4 gap-y-2">
                      <MiniMetric label="Units sold" value={recentUnits.toLocaleString()} />
                      <MiniMetric label="Average receipt" value={currency(averageReceipt)} />
                    </div>
                  </div>

                  {recentReceiptChartData.length > 1 ? (
                    <div className="rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
                      <p className="text-xs font-medium text-slate-600">Recent receipts</p>
                      <p className="text-[11px] text-slate-400">Latest completed sale amounts</p>
                      <div className="mt-2 h-16">
                        <ResponsiveContainer height="100%" width="100%">
                          <BarChart data={recentReceiptChartData}>
                            <Bar
                              dataKey="amount"
                              fill="#4f46e5"
                              maxBarSize={16}
                              radius={[3, 3, 0, 0]}
                            />
                          </BarChart>
                        </ResponsiveContainer>
                      </div>
                    </div>
                  ) : (
                    <div className="rounded-md border border-dashed border-slate-200 px-3 py-3 text-xs leading-5 text-slate-500">
                      {completedSales.length === 0
                        ? "No completed receipts yet."
                        : "Another completed receipt will unlock the recent activity chart."}
                    </div>
                  )}
                </div>

                <p className="mt-3 text-xs text-slate-500">
                  Based on recent completed receipts · Full details in the downloadable report.
                </p>
              </CardContent>
            </Card>'''
          reports = reports[:card_start] + compact_receipts + reports[card_end:]

          old_mini_metric = '''function MiniMetric({ label, value }: { label: string; value: string }) {
  return (
    <div className="rounded-md border border-slate-200 bg-slate-50 px-3 py-2.5">
      <p className="text-xs text-slate-500">{label}</p>
      <p className="mt-1 text-base font-semibold text-slate-950">{value}</p>
    </div>
  );
}'''
          new_mini_metric = '''function MiniMetric({ label, value }: { label: string; value: string }) {
  return (
    <div className="min-w-0">
      <p className="text-xs text-slate-500">{label}</p>
      <p className="mt-0.5 truncate text-sm font-semibold text-slate-950">{value}</p>
    </div>
  );
}'''
          if old_mini_metric not in reports:
              raise SystemExit("MiniMetric marker not found")
          reports = reports.replace(old_mini_metric, new_mini_metric, 1)

          health_marker = '''  const healthy = inventory.lowStockItems === 0 && inventory.outOfStockItems === 0;

  return ('''
          health_replacement = '''  const healthy = inventory.lowStockItems === 0 && inventory.outOfStockItems === 0;
  const healthSummary = healthy
    ? "No inventory issues need attention right now."
    : inventory.lowStockItems > 0 && inventory.outOfStockItems > 0
      ? "Low-stock and out-of-stock products need attention."
      : inventory.outOfStockItems > 0
        ? "Out-of-stock products need attention."
        : "Low-stock products need attention.";

  return ('''
          if health_marker not in reports:
              raise SystemExit("Inventory health summary marker not found")
          reports = reports.replace(health_marker, health_replacement, 1)

          inventory_start = reports.index("function InventoryHealthCard")
          footer_start = reports.index(
              '        <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-slate-100 pt-3 text-xs text-slate-500">',
              inventory_start
          )
          footer_end = reports.index("\n        </div>", footer_start) + len("\n        </div>")
          health_footer = '''        <p className="mt-3 border-t border-slate-100 pt-3 text-xs text-slate-500">
          {healthSummary}
        </p>'''
          reports = reports[:footer_start] + health_footer + reports[footer_end:]
          reports_path.write_text(reports)

          panel_path = Path("frontend/src/components/reports/RestockPlanningPanel.tsx")
          panel = panel_path.read_text()
          header_start = panel.index("      <CardHeader>", panel.index("  return (\n    <Card>"))
          header_end = panel.index("\n      </CardHeader>", header_start) + len("\n      </CardHeader>")
          compact_header = '''      <CardHeader className="pb-2">
        <div className="flex flex-col gap-2 lg:flex-row lg:items-center lg:justify-between">
          <div className="min-w-0">
            <div className="flex flex-wrap items-center gap-2">
              <CardTitle>Restock planner</CardTitle>
              <Badge variant="info">Recommended</Badge>
              {draftOrder ? (
                <Badge variant={statusVariant(draftOrder.status)}>
                  {statusLabel(draftOrder.status)}
                </Badge>
              ) : null}
            </div>
            <p className="mt-1 text-xs text-slate-500">
              Review and prepare products for restocking.
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <Badge>{selectedCount.toLocaleString()} products</Badge>
            <Badge>{requestedUnits.toLocaleString()} units</Badge>
            <Button
              aria-label="Refresh restock recommendations"
              disabled={loading || Boolean(draftOrder) || busyAction !== null}
              onClick={() => void loadRecommendations()}
              size="sm"
              type="button"
              variant="secondary"
            >
              <RefreshCw aria-hidden="true" className="h-4 w-4" />
              Refresh
            </Button>
          </div>
        </div>
      </CardHeader>'''
          panel = panel[:header_start] + compact_header + panel[header_end:]
          panel_path.write_text(panel)

          contract_path = Path("scripts/restock-phase4-6-ui-contract-test.ts")
          contract = contract_path.read_text()
          contract = contract.replace(
              'assert.match(panelSource, /Recommended restock/);',
              'assert.match(panelSource, /<Badge variant="info">Recommended<\\/Badge>/);\nassert.match(panelSource, /Review and prepare products for restocking\\./);\nassert.doesNotMatch(panelSource, /Large restock lists stay paged/);'
          )
          insert_marker = 'assert.match(reportsSource, /ResponsiveContainer/);'
          insert_replacement = '''assert.match(reportsSource, /ResponsiveContainer/);
assert.match(reportsSource, /Recent receipts/);
assert.match(reportsSource, /No inventory issues need attention right now/);
assert.doesNotMatch(reportsSource, /Operational snapshot only\\. Download the report/);'''
          if insert_marker not in contract:
              raise SystemExit("QoL contract insertion marker not found")
          contract = contract.replace(insert_marker, insert_replacement, 1)
          contract_path.write_text(contract)
          PY
      - name: Format QoL changes
        run: npx prettier --write frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase4-6-ui-contract-test.ts
      - name: Verify formatting
        run: npx prettier --check frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase4-6-ui-contract-test.ts
      - name: Run frontend contracts
        run: npm run test --workspace frontend
      - name: Build frontend
        run: npm run build --workspace frontend
      - name: Commit QoL pass if needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase4-6-ui-contract-test.ts; then
            echo "QoL changes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase4-6-ui-contract-test.ts
          HUSKY=0 git commit -m "feat(reports): tighten operational QoL density"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
