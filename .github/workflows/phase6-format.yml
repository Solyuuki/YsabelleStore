name: Phase 6 Format

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/phase6-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reliable print-window behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/pages/ReportsPage.tsx")
          source = path.read_text()

          old_handler = '''  async function handlePrintReport() {
            setExportBusy("print");
            setExportError(null);

            try {
              const snapshot = await prepareExportSnapshot();
              openPrintableReport(snapshot);
              setExportOpen(false);
            } catch (exportRequestError) {
              setExportError(
                exportRequestError instanceof Error
                  ? exportRequestError.message
                  : "The printable report could not be prepared."
              );
            } finally {
              setExportBusy(null);
            }
          }
          '''

          new_handler = '''  async function handlePrintReport() {
            setExportError(null);

            const printWindow = window.open("", "_blank", "width=1100,height=800");
            if (!printWindow) {
              setExportError("Pop-up was blocked. Allow pop-ups for Ysabelle Store and try again.");
              return;
            }

            printWindow.opener = null;
            printWindow.document.open();
            printWindow.document.write(
              '<!doctype html><title>Preparing report…</title><p style="font:14px Arial;padding:24px">Preparing Ysabelle Store report…</p>'
            );
            printWindow.document.close();
            setExportBusy("print");

            try {
              const snapshot = await prepareExportSnapshot();
              renderPrintableReport(printWindow, snapshot);
              setExportOpen(false);
            } catch (exportRequestError) {
              printWindow.close();
              setExportError(
                exportRequestError instanceof Error
                  ? exportRequestError.message
                  : "The printable report could not be prepared."
              );
            } finally {
              setExportBusy(null);
            }
          }
          '''

          old_renderer = '''function openPrintableReport(snapshot: ReportExportSnapshot) {
            const printWindow = window.open("", "_blank", "width=1100,height=800");

            if (!printWindow) {
              throw new Error("Pop-up was blocked. Allow pop-ups for Ysabelle Store and try again.");
            }

            printWindow.opener = null;
            printWindow.document.open();
            printWindow.document.write(buildPrintableReport(snapshot));
            printWindow.document.close();
            printWindow.focus();
            printWindow.setTimeout(() => printWindow.print(), 250);
          }
          '''

          new_renderer = '''function renderPrintableReport(printWindow: Window, snapshot: ReportExportSnapshot) {
            printWindow.document.open();
            printWindow.document.write(buildPrintableReport(snapshot));
            printWindow.document.close();
            printWindow.focus();
            printWindow.setTimeout(() => printWindow.print(), 250);
          }
          '''

          if old_handler not in source:
              raise SystemExit("Expected print handler was not found.")
          if old_renderer not in source:
              raise SystemExit("Expected printable renderer was not found.")

          source = source.replace(old_handler, new_handler).replace(old_renderer, new_renderer)
          path.write_text(source)
          PY
      - name: Normalize Reports QoL formatting with CI formatter
        run: npx prettier --write frontend/src/pages/ReportsPage.tsx
      - name: Verify Reports QoL formatting
        run: npx prettier --check frontend/src/pages/ReportsPage.tsx
      - name: Commit QoL fix if needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/ReportsPage.tsx; then
            echo "ReportsPage is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx
          HUSKY=0 git commit -m "fix(reports): make printable export popup reliable"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
