name: Phase 6 Format

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/phase6-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize Reports QoL formatting with CI formatter
        run: npx prettier --write frontend/src/pages/ReportsPage.tsx
      - name: Verify Reports QoL formatting
        run: npx prettier --check frontend/src/pages/ReportsPage.tsx
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/ReportsPage.tsx; then
            echo "ReportsPage is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx
          HUSKY=0 git commit -m "style(reports): normalize QoL formatting"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
