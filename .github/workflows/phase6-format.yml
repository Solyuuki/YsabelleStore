name: Phase 6 Format

on:
  push:
    branches:
      - "m1/v0.10/chore/sprint10-release-repair"
    paths:
      - ".github/workflows/phase6-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.10/chore/sprint10-release-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair stale Sprint 10 release fixtures
        run: node scripts/sprint10-release-repair.mjs
      - name: Regenerate Prisma client
        run: npm run prisma:generate
      - name: Normalize repository formatting with CI formatter
        run: npx prettier --write .
      - name: Verify repository formatting
        run: npx prettier --check .
      - name: Verify workspace type checking
        run: npm run typecheck
      - name: Verify guardrail regression tests
        run: npm run test:guardrails
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add .github/workflows/phase6-format.yml
          HUSKY=0 git commit -m "chore(release): repair Sprint 10 quality gates"
          HUSKY=0 git push origin HEAD:m1/v0.10/chore/sprint10-release-repair
