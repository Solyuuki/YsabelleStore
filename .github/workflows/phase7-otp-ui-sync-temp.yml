name: Phase 7 OTP UI Sync Temp

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-mobile-otp"
    paths:
      - ".github/workflows/phase7-otp-ui-sync-temp.yml"
      - "frontend/package.json"
      - "frontend/src/components/ui/input-otp.tsx"
      - "frontend/src/components/customer/CustomerEmailAuthPanel.tsx"
      - "frontend/src/styles/customer-auth-quick-sign.css"
      - "scripts/test/customer-email-otp-boxes.test.mjs"

permissions:
  contents: write

jobs:
  verify-and-sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Focused OTP contract
        run: node --test scripts/test/customer-email-otp-boxes.test.mjs
      - name: Frontend tests
        run: npm test --workspace frontend
      - name: Frontend typecheck
        run: npm run typecheck --workspace frontend
      - name: Frontend build
        run: npm run build --workspace frontend
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync input otp lockfile"
          git push
