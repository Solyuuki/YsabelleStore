name: Sprint 7 Integration Format

on:
  push:
    branches:
      - m1/v0.7/fix/sprint6-sprint7-integration

permissions:
  contents: write

concurrency:
  group: sprint-7-integration-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable integration branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.7/fix/sprint6-sprint7-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format integration surfaces
        run: >-
          npx prettier --write
          .github/workflows/sprint-7-integration-format.yml
          .github/workflows/sprint-7-integration-pr-validation.yml
          .github/workflows/sprint-7-integration-resolution.yml
          scripts/brand-assets-test.mjs

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/sprint-7-integration-format.yml \
            .github/workflows/sprint-7-integration-pr-validation.yml \
            .github/workflows/sprint-7-integration-resolution.yml \
            scripts/brand-assets-test.mjs
          git commit -m "style: format Sprint 7 integration surfaces"
          git push origin HEAD:m1/v0.7/fix/sprint6-sprint7-integration
