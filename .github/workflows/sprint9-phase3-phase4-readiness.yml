name: Sprint 9 Phase 3 + Phase 4 Readiness

on:
  push:
    branches:
      - integration/sprint9-phase3-phase4-readiness

permissions:
  contents: read

concurrency:
  group: sprint9-phase3-phase4-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-red-green:
    name: Phase 3 + Phase 4 integration gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: integration/sprint9-phase3-phase4-readiness
      YSABELLE_HEAD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build disposable CI database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Full backend regression suite
        run: npm test --workspace backend

      - name: Customer auth frontend contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-frontend-test.ts

      - name: Customer account frontend contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-account-frontend-test.ts

      - name: Customer auth form contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-form-contract-test.ts

      - name: Customer auth UI contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-ui-contract-test.ts

      - name: Phase 3 auth UI regressions
        run: >-
          node --test
          scripts/test/customer-auth-ui-redesign.test.mjs
          scripts/test/retailer-brand-unification.test.mjs
          scripts/test/auth-brand-boundary.test.mjs
          scripts/test/customer-internal-access-separation.test.mjs

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository lint
        run: npm run lint

      - name: Repository formatting
        run: npm run format:check

      - name: All workspace builds
        run: npm run build

      - name: Repository guardrails
        run: npm run test:guardrails

      - name: Production dependency audit
        run: npm run security:audit:production
