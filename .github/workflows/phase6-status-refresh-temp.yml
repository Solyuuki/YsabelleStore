name: Phase 6 Status Refresh Temp

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-social-auth"
    paths:
      - ".github/workflows/phase6-status-refresh-temp.yml"

permissions:
  contents: write

jobs:
  refresh-status:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      CUSTOMER_OAUTH_TRANSACTION_KEY: ci-only-oauth-transaction-key-32-bytes-minimum
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: ${{ github.head_ref || github.ref_name }}
      YSABELLE_BASE_REF: ${{ github.base_ref }}
      YSABELLE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      YSABELLE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh committed Phase 6 status evidence
        run: npm run status:update -- --validation Passed
      - name: Verify refreshed status evidence
        run: npm run verify:status
      - name: Commit refreshed status evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-artifacts/m1-abarado docs/sprints/sprint-9
          if git diff --cached --quiet; then
            echo "No status evidence changes to commit."
            exit 0
          fi
          git commit -m "docs(auth): refresh phase 6 status evidence"
          git push origin HEAD:m1/v0.9/feat/customer-social-auth
