name: Temporary Phase 10 Expiry Normalization

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - scripts/temp-phase10-expiry-normalization.mjs
      - .github/workflows/temp-phase10-expiry-normalization.yml

permissions:
  contents: write

env:
  DATABASE_URL: mysql://ysabelle:ysabelle@127.0.0.1:3306/ysabelle

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Apply UTC expiry normalization patch
        run: node scripts/temp-phase10-expiry-normalization.mjs

      - name: Format touched files
        run: >-
          npx prettier --write
          backend/src/services/inventoryImportService.ts
          backend/test/bulk-delivery-phase10-contract.test.ts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Run Phase 10 backend contract
        run: cd backend && npx tsx --test test/bulk-delivery-phase10-contract.test.ts

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/services/inventoryImportService.ts \
            backend/test/bulk-delivery-phase10-contract.test.ts
          if git diff --cached --quiet; then
            echo "Expiry normalization fix already applied."
            exit 0
          fi
          git commit --no-verify -m "fix(inventory): normalize bulk expiry dates in UTC"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
