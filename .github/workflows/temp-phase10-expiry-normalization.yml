name: Temporary Phase 10 Stock Cost Unblock

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - scripts/temp-phase10-expiry-normalization.mjs
      - .github/workflows/temp-phase10-expiry-normalization.yml

permissions:
  contents: write

env:
  DATABASE_URL: mysql://ysabelle:ysabelle@127.0.0.1:3306/ysabelle

concurrency:
  group: phase10-stock-cost-unblock
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Apply stock cost unblock and expiry normalization
        run: node scripts/temp-phase10-expiry-normalization.mjs

      - name: Format touched TypeScript files
        run: >-
          npx prettier --write
          backend/src/services/inventoryImportService.ts
          backend/src/services/stockDomainService.ts
          backend/test/bulk-delivery-phase10-contract.test.ts

      - name: Format Prisma schema
        run: npx prisma format --schema=database/prisma/schema.prisma

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Run Phase 10 backend contract
        run: cd backend && npx tsx --test test/bulk-delivery-phase10-contract.test.ts

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/services/inventoryImportService.ts \
            backend/src/services/stockDomainService.ts \
            backend/test/bulk-delivery-phase10-contract.test.ts \
            database/prisma/schema.prisma \
            database/prisma/migrations/20260913143000_allow_unknown_inventory_batch_cost/migration.sql
          if git diff --cached --quiet; then
            echo "Phase 10 stock cost unblock is already applied."
            exit 0
          fi
          git commit --no-verify -m "fix(inventory): allow receipt with unknown procurement cost"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
