name: Temporary Support Integration Format

on:
  push:
    branches:
      - "m3/v0.11/fix/customer-support-integration"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: m3/v0.11/fix/customer-support-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --no-verify -m "style: normalize Sprint 11 formatting"
          git push origin HEAD:m3/v0.11/fix/customer-support-integration
