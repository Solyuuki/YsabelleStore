name: One-time restock forecast format

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format forecast files
        run: |
          npx prettier --write \
            frontend/src/components/reports/RestockForecastPanel.tsx \
            frontend/src/services/restockApi.ts

      - name: Verify touched files
        run: |
          npx prettier --check \
            frontend/src/components/reports/RestockForecastPanel.tsx \
            frontend/src/services/restockApi.ts
          npm run build --workspace frontend

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/reports/RestockForecastPanel.tsx \
            frontend/src/services/restockApi.ts
          git commit -m "style(reports): format simplified forecast"
          HUSKY=0 git push origin HEAD:${{ github.ref_name }}
