name: Sprint 7 Phase 4 Auth Security Test

on:
  push:
    branches:
      - sprint/v0.7/sprint-7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-7-phase4-auth-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-security:
    name: Phase 4 formatter diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed Sprint 7 state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print exact Phase 4 formatter delta
        run: |
          npx prettier --write backend/test/auth-security.test.ts
          git diff -- backend/test/auth-security.test.ts
          test -z "$(git status --short backend/test/auth-security.test.ts)"
