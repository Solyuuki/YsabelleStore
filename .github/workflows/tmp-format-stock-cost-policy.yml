name: Temporary Format Stock Cost Policy Guard

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format guard
        run: npx prettier --write scripts/test/stock-receipt-cost-policy.test.mjs

      - name: Commit formatted guard and remove helper
        shell: bash
        run: |
          git rm .github/workflows/tmp-format-stock-cost-policy.yml
          git add scripts/test/stock-receipt-cost-policy.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "style(inventory): format cost policy guard"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
