name: Targeted customer email auth test

on: push

jobs:
  email-registration:
    if: github.event.head_commit.message == 'test(auth): run targeted email registration red'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: targeted-test-secret
      CUSTOMER_OAUTH_TRANSACTION_KEY: targeted-test-oauth-key-32-bytes-minimum
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate
      - run: npx tsx --test --test-concurrency=1 backend/test/customer-email-registration.test.ts
