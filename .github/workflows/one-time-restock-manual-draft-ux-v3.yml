name: Apply Restock Manual Draft UX Once

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/one-time-restock-manual-draft-ux-v3.yml

permissions:
  contents: write

jobs:
  patch-restock-ux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply restock UX patch
        run: node scripts/one-time-restock-manual-draft-ux.mjs

      - name: Format touched files
        run: npx prettier --write frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase7-9-ui-contract-test.ts

      - name: Run targeted UI contract
        run: cd frontend && node ../scripts/restock-phase7-9-ui-contract-test.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase7-9-ui-contract-test.ts
          if git diff --cached --quiet; then
            echo "Restock UX is already up to date."
            exit 0
          fi
          git commit -m "fix(reports): separate manual restock drafts from forecast"
          git push origin HEAD:sprint/v0.10/sprint-10

# one-time retry after contract adjustment
