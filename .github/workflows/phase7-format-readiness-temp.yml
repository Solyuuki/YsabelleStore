name: Phase 7 Format Readiness

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-mobile-otp"
    paths:
      - ".github/workflows/phase7-format-readiness-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-mobile-otp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize repository formatting with CI formatter
        run: npx prettier --write .
      - name: Verify repository formatting
        run: npx prettier --check .
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add .github/workflows/phase7-format-readiness-temp.yml
          HUSKY=0 git commit -m "style: normalize formatting for phase 7 readiness"
          HUSKY=0 git push origin HEAD:m1/v0.9/feat/customer-mobile-otp
