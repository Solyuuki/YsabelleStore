name: Sprint 6 Format Brand Test

on:
  push:
    branches:
      - sprint/v0.6/sprint-6

permissions:
  contents: write

jobs:
  format-brand-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 6
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.6/sprint-6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format blocking Sprint 6 test
        run: npx prettier --write scripts/brand-assets-test.mjs

      - name: Commit formatting fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/brand-assets-test.mjs
          git rm .github/workflows/sprint-6-format-brand-test.yml
          git commit -m "style: format brand asset regression test"
          git push origin HEAD:sprint/v0.6/sprint-6
