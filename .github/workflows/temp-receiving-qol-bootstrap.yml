name: Temporary Receiving QoL Bootstrap

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/temp-receiving-qol-bootstrap.yml
      - .github/temp/receiving_qol_wrapper.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - name: Apply Receiving QoL patch
        run: python3 .github/temp/receiving_qol_wrapper.py
      - name: Commit Receiving QoL patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Armando R. Abarado Jr."
          git config user.email "abaradoaj@gmail.com"
          git add backend frontend scripts
          git commit -m "feat(receiving): add return history and pagination"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
