name: Temporary Sprint 12 Release Markdown Format Diff
on:
  push:
    branches:
      - staging
jobs:
  show-prettier-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact release Markdown Prettier diff
        run: |
          npx prettier --write docs/sprints/sprint-12/RELEASE-PROMOTION-REVIEW.md
          git diff --no-ext-diff -- docs/sprints/sprint-12/RELEASE-PROMOTION-REVIEW.md
