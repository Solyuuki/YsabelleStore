name: One-time stock health format

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix forecast watchlist page selection
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "frontend/src/components/reports/RestockForecastPanel.tsx";
          let source = fs.readFileSync(path, "utf8");
          const before = `    const pageItems = items.slice(start, start + WATCHLIST_PAGE_SIZE);\n    if (\n      pageItems.length > 0 &&\n      !pageItems.some((item) => item.product.id === selectedProductId)\n    ) {\n      setSelectedProductId(pageItems[0].product.id);\n    }`;
          const after = `    const pageItems = items.slice(start, start + WATCHLIST_PAGE_SIZE);\n    const firstPageItem = pageItems[0];\n    if (\n      firstPageItem &&\n      !pageItems.some((item) => item.product.id === selectedProductId)\n    ) {\n      setSelectedProductId(firstPageItem.product.id);\n    }`;
          if (!source.includes(before)) {
            throw new Error("Expected Forecast Watchlist page-selection block was not found.");
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Format touched stock health files
        run: |
          npx prettier --write \
            backend/src/services/restockForecastDecisionService.ts \
            backend/src/services/restockPlanningService.ts \
            backend/src/services/stockHealthService.ts \
            frontend/src/components/reports/RestockForecastPanel.tsx

      - name: Verify frontend build
        run: npm run build --workspace frontend

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/services/restockForecastDecisionService.ts \
            backend/src/services/restockPlanningService.ts \
            backend/src/services/stockHealthService.ts \
            frontend/src/components/reports/RestockForecastPanel.tsx
          git commit -m "fix(restock): stabilize automatic stock health"
          HUSKY=0 git push origin HEAD:${{ github.ref_name }}
