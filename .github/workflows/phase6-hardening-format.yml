name: Phase 6 Hardening Format

on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"
    paths:
      - "scripts/phase6-release-rehearsal.mjs"
      - ".github/workflows/phase6-hardening-format.yml"

permissions:
  contents: write

jobs:
  format:
    name: Format Phase 6 hardening source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Phase 6 source
        run: npx prettier --write scripts/phase6-release-rehearsal.mjs

      - name: Commit formatted Phase 6 source
        shell: bash
        run: |
          if git diff --quiet -- scripts/phase6-release-rehearsal.mjs; then
            echo "Phase 6 source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase6-release-rehearsal.mjs
          HUSKY=0 git commit -m "style(db): format phase 6 release rehearsal"
          HUSKY=0 git push origin HEAD:sprint/v0.11/sprint-11
