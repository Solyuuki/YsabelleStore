name: Sprint 12 one-time guardrail repair verification
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
    paths:
      - .github/workflows/sprint12-guardrail-repair-once.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only changed source-contract tests
        run: npx prettier --write scripts/test/brand-logo-fallback.test.mjs scripts/test/delivery-rider-handoff-contract.test.mjs scripts/test/retail-dashboard-mobile-v2.test.mjs scripts/test/retail-deliveries-mobile-v2.test.mjs scripts/test/retail-forecast-mobile-v2.test.mjs scripts/test/retail-products-mobile-v2.test.mjs scripts/test/retail-reports-mobile-v2.test.mjs scripts/test/storefront-adaptive-mobile.test.mjs
      - name: Validate formatting, lint, and patch hygiene
        run: |
          npx prettier --check scripts/test/brand-logo-fallback.test.mjs scripts/test/delivery-rider-handoff-contract.test.mjs scripts/test/retail-dashboard-mobile-v2.test.mjs scripts/test/retail-deliveries-mobile-v2.test.mjs scripts/test/retail-forecast-mobile-v2.test.mjs scripts/test/retail-products-mobile-v2.test.mjs scripts/test/retail-reports-mobile-v2.test.mjs scripts/test/storefront-adaptive-mobile.test.mjs
          npm run lint
          git diff --check
      - name: Test every source contract and record remaining failures
        shell: bash
        run: |
          node --test scripts/test/*.test.mjs > /tmp/guardrails.txt 2>&1 || true
          echo '=== Failure names and counts ==='
          grep -E '^not ok |^# tests |^# pass |^# fail ' /tmp/guardrails.txt | tail -n 110 || true
      - name: Commit only checked source-contract formatting changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {execFileSync}= require('node:child_process');
            const owner=context.repo.owner,repo=context.repo.repo,branch='sprint/v0.12/sprint-12';
            const baseSha=context.sha;
            const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+branch})).data;
            if(ref.object.sha!==baseSha)throw new Error('Branch advanced; no stale changes allowed.');
            const files=execFileSync('git',['diff','--name-only','-z']).toString('utf8').split('\0').filter(Boolean);
            if(files.some(p=>!p.startsWith('scripts/test/')||!p.endsWith('.test.mjs')))throw new Error('Refusing changes outside source contracts.');
            if(!files.length){core.info('No formatting changes needed.');return;}
            const tree=[];
            for(const path of files){
              const blob=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:baseSha})).data;
            const next=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,message:'chore(format): normalize responsive UI regression contracts',tree:next.sha,parents:[baseSha]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:commit.sha,force:false});
            core.info('Committed: '+commit.sha);
      - name: Preserve failed-test signal
        shell: bash
        run: |
          if grep -q '^not ok ' /tmp/guardrails.txt; then
            echo 'Guardrail failures remain and require targeted changes.'
            exit 1
          fi
