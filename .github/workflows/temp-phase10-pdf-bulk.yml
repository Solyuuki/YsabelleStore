name: Temporary Phase 10 PDF Bulk Extraction

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - scripts/temp-phase10-pdf-bulk.mjs
      - scripts/temp-phase10-pdf-bulk-compile-fix.mjs
      - .github/workflows/temp-phase10-pdf-bulk.yml

permissions:
  contents: write

env:
  DATABASE_URL: mysql://ysabelle:ysabelle@127.0.0.1:3306/ysabelle

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Add PDF.js text extraction dependency
        run: npm install pdfjs-dist --workspace backend --save

      - name: Apply automatic PDF bulk extraction patch
        run: node scripts/temp-phase10-pdf-bulk.mjs

      - name: Apply compiler compatibility patch
        run: node scripts/temp-phase10-pdf-bulk-compile-fix.mjs

      - name: Format touched production files
        run: >-
          npx prettier --write
          backend/package.json
          backend/src/services/pdfDeliveryImportService.ts
          backend/src/services/inventoryImportService.ts
          backend/src/controllers/bulkDeliveryController.ts
          backend/src/routes/inventory.routes.ts
          backend/test/bulk-delivery-phase10-contract.test.ts
          frontend/src/components/inventory/InventoryImportDialog.tsx
          frontend/src/services/bulkDeliveryApi.ts
          frontend/src/services/catalogApi.ts
          scripts/restock-phase10-ui-contract-test.ts

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck repository
        run: npm run typecheck

      - name: Build repository
        run: npm run build

      - name: Run Phase 10 backend contract
        run: cd backend && npx tsx --test test/bulk-delivery-phase10-contract.test.ts

      - name: Run Phase 10 UI contract
        run: cd frontend && npx tsx --tsconfig tsconfig.app.json ../scripts/restock-phase10-ui-contract-test.ts

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package-lock.json \
            backend/package.json \
            backend/src/services/pdfDeliveryImportService.ts \
            backend/src/services/inventoryImportService.ts \
            backend/src/controllers/bulkDeliveryController.ts \
            backend/src/routes/inventory.routes.ts \
            backend/test/bulk-delivery-phase10-contract.test.ts \
            frontend/src/components/inventory/InventoryImportDialog.tsx \
            frontend/src/services/bulkDeliveryApi.ts \
            frontend/src/services/catalogApi.ts \
            scripts/restock-phase10-ui-contract-test.ts
          if git diff --cached --quiet; then
            echo "Production PDF bulk extraction fix already applied."
            exit 0
          fi
          git commit --no-verify -m "fix(inventory): automate PDF bulk delivery extraction"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
