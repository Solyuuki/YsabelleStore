name: Sprint 10 Release Repair

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/sprint10-release-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/sprint/v0.10/sprint-10'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ysabelle_ci
      NODE_ENV: test
    steps:
      - name: Checkout Sprint 10
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair stale storefront test fixtures
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const accountPath = 'scripts/customer-account-frontend-test.ts';
          let account = fs.readFileSync(accountPath, 'utf8');
          const marker = '      customerPhone: "09171234567",\n      fulfillmentMethod: "STORE_PICKUP",';
          if (account.includes(marker) && !account.includes('customerAddress: {')) {
            account = account.replace(
              marker,
              `      customerPhone: "09171234567",\n      customerAddress: {\n        addressLine1: "123 Sample Street",\n        addressLine2: "",\n        barangay: "Sample Barangay",\n        cityMunicipality: "Pasig City",\n        provinceRegion: "Metro Manila",\n        postalCode: "1600",\n        country: "Philippines"\n      },\n      fulfillmentMethod: "STORE_PICKUP",`
            );
            fs.writeFileSync(accountPath, account);
          }

          const lightingPath = 'scripts/test/customer-surface-premium-lighting.test.mjs';
          let lighting = fs.readFileSync(lightingPath, 'utf8');
          lighting = lighting.replace(
            'assert.match(lighting, /#fcfdff/i);',
            'assert.match(lighting, /#f4f6fb/i);'
          );
          fs.writeFileSync(lightingPath, lighting);
          NODE

      - name: Normalize repository formatting
        run: npm run format

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck repository
        run: npm run typecheck

      - name: Lint repository
        run: npm run lint

      - name: Run guardrail tests
        run: npm run test:guardrails

      - name: Commit repaired release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git commit -m "chore(release): repair Sprint 10 validation gates"
          git push origin HEAD:sprint/v0.10/sprint-10
