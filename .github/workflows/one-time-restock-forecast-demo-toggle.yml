name: Apply temporary restock forecast demo once

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/one-time-restock-forecast-demo-toggle.yml

permissions:
  contents: write

jobs:
  patch-restock-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply temporary demo patch
        run: node scripts/one-time-restock-forecast-demo-toggle.mjs

      - name: Format touched files
        run: npx prettier --write frontend/src/components/reports/RestockForecastPanel.tsx frontend/src/components/reports/restockForecastDemo.ts

      - name: Typecheck frontend
        run: npm run typecheck --workspace frontend

      - name: Run targeted UI contract
        run: cd frontend && node ../scripts/restock-phase7-9-ui-contract-test.ts

      - name: Commit demo wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/reports/RestockForecastPanel.tsx frontend/src/components/reports/restockForecastDemo.ts
          if git diff --cached --quiet; then
            echo "Temporary forecast demo is already wired."
            exit 0
          fi
          git commit -m "test(reports): wire temporary restock forecast demo"
          git push origin HEAD:sprint/v0.10/sprint-10
