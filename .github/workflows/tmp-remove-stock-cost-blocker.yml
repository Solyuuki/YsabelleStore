name: Temporary Remove Stock Cost Blocker

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove procurement-cost receipt blocker
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          service_path = Path('backend/src/services/stockDomainService.ts')
          source = service_path.read_text()

          old_allocation = '''type BatchAllocation = {
            batchId: string;
            quantity: number;
            unitCost: Prisma.Decimal;
          };'''
          new_allocation = '''type BatchAllocation = {
            batchId: string;
            quantity: number;
            unitCost: Prisma.Decimal | null;
          };'''
          assert old_allocation in source, 'BatchAllocation contract not found'
          source = source.replace(old_allocation, new_allocation, 1)

          old_resolver = '''function requireProductCostPrice(product: { costPrice: Prisma.Decimal | null; id: string }) {
            if (product.costPrice) return product.costPrice;

            throw new HttpError(
              422,
              "A verified procurement cost is required before stock can be recorded.",
              {
                code: "PRODUCT_COST_PRICE_REQUIRED",
                details: { productId: product.id }
              }
            );
          }'''
          new_resolver = '''function resolveKnownUnitCost(product: {
            costPrice: Prisma.Decimal | null;
            inventoryBatches: Array<{
              createdAt: Date;
              id: string;
              receivedAt: Date;
              unitCost: Prisma.Decimal | null;
            }>;
          }) {
            if (product.costPrice) return product.costPrice;

            const latestKnownBatch = [...product.inventoryBatches]
              .filter((batch) => batch.unitCost !== null)
              .sort((left, right) => {
                const receivedComparison = right.receivedAt.getTime() - left.receivedAt.getTime();
                if (receivedComparison !== 0) return receivedComparison;

                const createdComparison = right.createdAt.getTime() - left.createdAt.getTime();
                if (createdComparison !== 0) return createdComparison;

                return right.id.localeCompare(left.id);
              })
              .at(0);

            return latestKnownBatch?.unitCost ?? null;
          }'''
          assert old_resolver in source, 'Old procurement-cost blocker not found'
          source = source.replace(old_resolver, new_resolver, 1)

          replacements = {
            'const unitCost = input.unitCost ?? requireProductCostPrice(product);':
              'const unitCost = input.unitCost ?? resolveKnownUnitCost(product);',
            'const adjustmentUnitCost = requireProductCostPrice(product);':
              'const adjustmentUnitCost = resolveKnownUnitCost(product);',
            'const reconciliationUnitCost = existingBatch ? undefined : requireProductCostPrice(product);':
              'const reconciliationUnitCost = existingBatch ? undefined : resolveKnownUnitCost(product);',
            'unitCost: reconciliationUnitCost ?? requireProductCostPrice(product)':
              'unitCost: reconciliationUnitCost ?? null'
          }
          for old, new in replacements.items():
            assert old in source, f'Expected stock-domain expression not found: {old}'
            source = source.replace(old, new, 1)

          assert 'PRODUCT_COST_PRICE_REQUIRED' not in source
          assert 'requireProductCostPrice' not in source
          service_path.write_text(source)

          schema_path = Path('database/prisma/schema.prisma')
          schema = schema_path.read_text()
          old_field = '  unitCost           Decimal              @map("unit_cost") @db.Decimal(10, 2)'
          new_field = '  unitCost           Decimal?             @map("unit_cost") @db.Decimal(10, 2)'
          assert old_field in schema, 'InventoryBatch.unitCost schema field not found'
          schema = schema.replace(old_field, new_field, 1)
          schema_path.write_text(schema)

          migration = Path('database/prisma/migrations/20260913030000_allow_unknown_inventory_batch_cost/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Physical inventory must remain recordable when procurement cost has not yet been verified.\nALTER TABLE `inventory_batches`\n  MODIFY `unit_cost` DECIMAL(10, 2) NULL;\n''')
          PY

      - name: Format changed production files
        run: |
          npx prettier --write backend/src/services/stockDomainService.ts
          npx prisma format --schema database/prisma/schema.prisma

      - name: Validate schema and backend
        run: |
          npm run prisma:generate
          npm run prisma:validate
          npm run typecheck --workspace backend
          npm run build --workspace backend

      - name: Commit production fix and remove helper
        shell: bash
        run: |
          git rm .github/workflows/tmp-remove-stock-cost-blocker.yml
          git add backend/src/services/stockDomainService.ts database/prisma/schema.prisma database/prisma/migrations/20260913030000_allow_unknown_inventory_batch_cost/migration.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --no-verify -m "fix(inventory): stop missing cost from blocking stock receipts"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
