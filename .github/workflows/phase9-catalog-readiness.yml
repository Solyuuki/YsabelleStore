name: Phase 9 Catalog Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - "m1/v0.9/feat/catalog-data-readiness"
    paths:
      - ".github/workflows/phase9-catalog-readiness.yml"
      - "backend/src/modules/catalog/**"
      - "backend/src/scripts/extractSarimaSourceManifest.ts"
      - "backend/src/scripts/buildDriveImageManifest.ts"
      - "backend/src/scripts/reconcileCatalogImages.ts"
      - "backend/src/scripts/generateCatalogPromotionPreview.ts"
      - "backend/src/services/productService.ts"
      - "backend/src/validators/product.validators.ts"
      - "backend/test/sarima-source-manifest.test.ts"
      - "backend/test/drive-image-manifest.test.ts"
      - "backend/test/drive-image-snapshot.test.ts"
      - "backend/test/catalog-image-reconciliation.test.ts"
      - "backend/test/catalog-image-reconciliation-report.test.ts"
      - "backend/test/catalog-quality-filter.test.ts"
      - "backend/test/catalog-promotion-preview.test.ts"
      - "backend/test/catalog-operational-audit.test.ts"
      - "backend/test/generate-catalog-promotion-preview.test.ts"
      - "backend/test/reconcile-catalog-images-script.test.ts"
      - "frontend/src/pages/ProductsPage.tsx"
      - "frontend/src/services/catalogApi.ts"
      - "scripts/catalog-quality-filter-ui-test.ts"
      - "catalog-image-engine/**"
      - "data/forecasting/historical-sales-2024.xlsx"
      - "data/forecasting/historical-sales-2025.xlsx"
      - "artifacts/catalog/phase9/**"
      - "docs/catalog/phase9-image-reconciliation-report.md"
      - "docs/catalog/phase9-catalog-promotion-preview.md"

permissions:
  contents: read

jobs:
  catalog-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install catalog image engine dependencies
        run: python -m pip install -r catalog-image-engine/requirements.txt
      - name: Compile backend
        run: npm run build --workspace backend
      - name: Compile frontend
        run: npm run build --workspace frontend
      - name: Run focused manifest, reconciliation, promotion preview, operational audit, and catalog filter contract tests
        run: >-
          npx tsx --test
          backend/test/sarima-source-manifest.test.ts
          backend/test/drive-image-manifest.test.ts
          backend/test/drive-image-snapshot.test.ts
          backend/test/catalog-image-reconciliation.test.ts
          backend/test/catalog-image-reconciliation-report.test.ts
          backend/test/catalog-quality-filter.test.ts
          backend/test/catalog-promotion-preview.test.ts
          backend/test/catalog-operational-audit.test.ts
          backend/test/generate-catalog-promotion-preview.test.ts
          backend/test/reconcile-catalog-images-script.test.ts
      - name: Run catalog quality filter UI contract
        run: npx tsx scripts/catalog-quality-filter-ui-test.ts
      - name: Run catalog image engine tests
        env:
          PYTHONPATH: catalog-image-engine
        run: python -m unittest discover -s catalog-image-engine/tests -p 'test_*.py'
      - name: Generate SARIMA source manifest
        run: npx tsx backend/src/scripts/extractSarimaSourceManifest.ts
      - name: Generate Drive image manifest
        run: npx tsx backend/src/scripts/buildDriveImageManifest.ts
      - name: Generate image reconciliation artifacts
        run: npx tsx backend/src/scripts/reconcileCatalogImages.ts
      - name: Generate catalog promotion preview
        run: npx tsx backend/src/scripts/generateCatalogPromotionPreview.ts
      - name: Upload SARIMA source manifest
        uses: actions/upload-artifact@v4
        with:
          name: phase9-sarima-source-manifest
          path: artifacts/catalog/phase9/sarima-source-manifest.json
          if-no-files-found: error
      - name: Upload Drive image manifest
        uses: actions/upload-artifact@v4
        with:
          name: phase9-drive-image-manifest
          path: artifacts/catalog/phase9/drive-image-manifest.json
          if-no-files-found: error
      - name: Upload image reconciliation bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase9-image-reconciliation
          path: |
            artifacts/catalog/phase9/image-reconciliation.json
            artifacts/catalog/phase9/image-reconciliation.csv
            docs/catalog/phase9-image-reconciliation-report.md
          if-no-files-found: error
      - name: Upload catalog promotion preview
        uses: actions/upload-artifact@v4
        with:
          name: phase9-catalog-promotion-preview
          path: |
            artifacts/catalog/phase9/catalog-promotion-preview.json
            docs/catalog/phase9-catalog-promotion-preview.md
          if-no-files-found: error
