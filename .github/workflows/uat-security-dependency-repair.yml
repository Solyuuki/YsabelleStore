name: UAT Zod Compatibility Migration (Temporary)

on:
  push:
    branches:
      - "m1/v0.13/fix/uat-compatibility-and-usability"

permissions:
  contents: write

jobs:
  preserve-zod-api:
    if: ${{ !contains(github.event.head_commit.message, '[uat-security-auto]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve existing Zod 3 schema API under secure Zod 4
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const roots = ['backend/src', 'backend/test', 'frontend/src', 'scripts', 'electron/src', 'tools'];
          const excludes = new Set(['node_modules', '.git', 'dist', 'build', 'coverage']);
          const extensions = ['.ts', '.tsx', '.mts', '.cts', '.js', '.jsx', '.mjs', '.cjs'];
          let updated = 0;
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (excludes.has(entry.name)) continue;
              const filename = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(filename); continue; }
              if (!extensions.some(ext => filename.endsWith(ext))) continue;
              const before = fs.readFileSync(filename, 'utf8');
              let after = before
                .split('from "zod"').join('from "zod/v3"')
                .split("from 'zod'").join("from 'zod/v3'")
                .split('require("zod")').join('require("zod/v3")')
                .split("require('zod')").join("require('zod/v3')")
                .split('import("zod")').join('import("zod/v3")')
                .split("import('zod')").join("import('zod/v3')");
              if (before === after) continue;
              fs.writeFileSync(filename, after);
              updated++;
              console.log('Zod v3 import:', filename);
            }
          }
          for (const root of roots) walk(root);
          console.log('Total updated:', updated);
          NODE
      - name: Commit API compatibility changes to UAT branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src backend/test frontend/src scripts electron/src tools
          if git diff --cached --quiet; then
            echo "All imports already compatible"
            exit 0
          fi
          git commit -m "m1/fix(security): retain Zod v3 API using patched Zod 4 [uat-security-auto]"
          git push origin HEAD:m1/v0.13/fix/uat-compatibility-and-usability
