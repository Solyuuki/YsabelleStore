name: Temporary Product Family Format Audit
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
jobs:
  print-prettier-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx prettier --write backend/src/services/storefrontService.ts backend/src/utils/catalogIdentity.ts backend/test/storefront-product-detail.test.ts
          git diff --no-ext-diff -- backend/src/services/storefrontService.ts backend/src/utils/catalogIdentity.ts backend/test/storefront-product-detail.test.ts
