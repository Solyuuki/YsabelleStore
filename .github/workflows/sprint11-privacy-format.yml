name: Sprint 11 Privacy Format

on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"
    paths:
      - ".github/workflows/sprint11-privacy-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.11/sprint-11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format privacy stylesheet
        run: npx prettier --write frontend/src/styles/customer-privacy.css
      - name: Verify privacy stylesheet
        run: npx prettier --check frontend/src/styles/customer-privacy.css
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Privacy stylesheet is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/styles/customer-privacy.css
          HUSKY=0 git commit -m "style(privacy): format slim notice bar"
          HUSKY=0 git push origin HEAD:sprint/v0.11/sprint-11
