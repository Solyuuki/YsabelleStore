name: Temporary Image Recovery Prettier Diff
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
jobs:
  show-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print Prettier diff
        run: |
          npx prettier --write scripts/catalog-image-restore-approved.mjs scripts/test/canonical-runtime-image-overrides.test.mjs
          git diff --no-ext-diff -- scripts/catalog-image-restore-approved.mjs scripts/test/canonical-runtime-image-overrides.test.mjs
