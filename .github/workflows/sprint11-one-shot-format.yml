name: Sprint 11 formatter with Python image-engine dependencies
# CI formatter: normalize reused Storefront galaxy background on retail sign-in (2026-10-10).

on:
  push:
    branches:
      - sprint/v0.11/sprint-11
    paths:
      - .github/workflows/sprint11-one-shot-format.yml

permissions:
  contents: write

jobs:
  format-only:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-theme-format-validation-key-32-bytes
      NODE_ENV: test
      CUSTOMER_OAUTH_TRANSACTION_KEY: ci-only-transaction-encryption-material-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog-image-engine/requirements.txt
      - name: Install image-engine test requirements
        run: python -m pip install -r catalog-image-engine/requirements.txt
      - name: Install locked repository tools
        run: npm ci
      - name: Initialize disposable Prisma test schema
        run: npx prisma db push --schema database/prisma/schema.prisma --skip-generate
      - name: Normalize repository formatting (preserve logic)
        run: npm run format
      - name: Validate frontend contracts after formatting
        run: npm test --workspace @ysabellestore/frontend
      - name: Commit formatted files with all pre-push checks
        shell: bash
        run: |
          # Keep this temporary workflow out of the automated push; remove it via GitHub API after formatting passes.
          git restore -- .github/workflows/sprint11-one-shot-format.yml
          git config user.name "ysabelle-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "style(repo): apply required formatting to Sprint 11 changes"
          git push origin HEAD:refs/heads/sprint/v0.11/sprint-11
