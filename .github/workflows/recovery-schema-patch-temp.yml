name: Recovery Schema Patch Temporary

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-account-recovery"

permissions:
  contents: write

jobs:
  patch-schema:
    if: github.event.head_commit.message == 'ci(auth): add temporary recovery schema patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-account-recovery
          fetch-depth: 0
      - name: Patch Prisma schema and migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('database/prisma/schema.prisma')
          text = path.read_text()
          old = '''  sessions        CustomerSession[]
  orders          CustomerOrder[]

  @@index([status], map: "idx_customer_accounts_status")'''
          new = '''  sessions            CustomerSession[]
  passwordResetTokens CustomerPasswordResetToken[]
  orders              CustomerOrder[]

  @@index([status], map: "idx_customer_accounts_status")'''
          if old not in text:
              raise SystemExit('CustomerAccount relation insertion point not found')
          text = text.replace(old, new, 1)

          marker = 'model CustomerSession {'
          model = '''model CustomerPasswordResetToken {
  id                String          @id @default(cuid()) @db.VarChar(191)
  customerAccountId String          @map("customer_account_id") @db.VarChar(191)
  tokenHash         String          @unique(map: "uq_customer_password_reset_tokens_token_hash") @map("token_hash") @db.VarChar(64)
  expiresAt         DateTime        @map("expires_at")
  usedAt            DateTime?       @map("used_at")
  createdAt         DateTime        @default(now()) @map("created_at")
  customerAccount   CustomerAccount @relation(fields: [customerAccountId], references: [id], onDelete: Cascade, onUpdate: Cascade)

  @@index([customerAccountId], map: "idx_customer_password_reset_tokens_customer")
  @@index([expiresAt], map: "idx_customer_password_reset_tokens_expires")
  @@index([usedAt], map: "idx_customer_password_reset_tokens_used")
  @@map("customer_password_reset_tokens")
}

'''
          if marker not in text:
              raise SystemExit('CustomerSession insertion point not found')
          text = text.replace(marker, model + marker, 1)
          path.write_text(text)
          PY

          mkdir -p database/prisma/migrations/20260827040000_customer_password_recovery
          cat > database/prisma/migrations/20260827040000_customer_password_recovery/migration.sql <<'SQL'
          CREATE TABLE `customer_password_reset_tokens` (
            `id` VARCHAR(191) NOT NULL,
            `customer_account_id` VARCHAR(191) NOT NULL,
            `token_hash` VARCHAR(64) NOT NULL,
            `expires_at` DATETIME(3) NOT NULL,
            `used_at` DATETIME(3) NULL,
            `created_at` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),

            UNIQUE INDEX `uq_customer_password_reset_tokens_token_hash`(`token_hash`),
            INDEX `idx_customer_password_reset_tokens_customer`(`customer_account_id`),
            INDEX `idx_customer_password_reset_tokens_expires`(`expires_at`),
            INDEX `idx_customer_password_reset_tokens_used`(`used_at`),
            PRIMARY KEY (`id`)
          ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

          ALTER TABLE `customer_password_reset_tokens`
            ADD CONSTRAINT `customer_password_reset_tokens_customer_account_id_fkey`
            FOREIGN KEY (`customer_account_id`) REFERENCES `customer_accounts`(`id`)
            ON DELETE CASCADE ON UPDATE CASCADE;
          SQL

      - name: Commit schema implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/prisma/schema.prisma database/prisma/migrations/20260827040000_customer_password_recovery/migration.sql
          git commit -m "feat(auth): add password recovery token persistence"
          git push origin HEAD:m1/v0.9/feat/customer-account-recovery
