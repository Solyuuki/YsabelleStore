name: Temporary Phase 10 Spreadsheet Unification

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/temp-phase10-unify-spreadsheet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expose normalized spreadsheet delivery rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('backend/src/services/inventoryImportService.ts')
          text = service.read_text()

          old = '''export type InventoryImportRowResult = {\n  rowNumber: number;\n  productId: string | null;\n  productName: string | null;\n  valid: boolean;\n  errors: InventoryImportError[];\n  warnings: InventoryImportError[];\n};'''
          new = '''export type InventoryImportRowResult = {\n  rowNumber: number;\n  productId: string | null;\n  productName: string | null;\n  valid: boolean;\n  deliveryData: {\n    sku: string | null;\n    barcode: string | null;\n    quantity: number;\n    batchCode: string;\n    expirationDate: string | null;\n    reason: string;\n  } | null;\n  errors: InventoryImportError[];\n  warnings: InventoryImportError[];\n};'''
          if old not in text:
              raise SystemExit('backend row result type anchor not found')
          text = text.replace(old, new, 1)

          old = '''type ValidatedInventoryRow = InventoryImportRowResult & {\n  normalizedData: NormalizedInventoryRow | null;\n};'''
          new = '''type ValidatedInventoryRow = Omit<InventoryImportRowResult, "deliveryData"> & {\n  normalizedData: NormalizedInventoryRow | null;\n};'''
          if old not in text:
              raise SystemExit('validated row type anchor not found')
          text = text.replace(old, new, 1)

          old = 'const counts = new Map<string, InventoryImportRowResult[]>();'
          new = 'const counts = new Map<string, ValidatedInventoryRow[]>();'
          if old not in text:
              raise SystemExit('within-file duplicate map type anchor not found')
          text = text.replace(old, new, 1)

          old = '''          valid: false,\n          errors: [],\n          warnings: []'''
          new = '''          valid: false,\n          deliveryData: null,\n          errors: [],\n          warnings: []'''
          if old not in text:
              raise SystemExit('file error row anchor not found')
          text = text.replace(old, new, 1)

          old = '''  const rowsResult = normalizedRows.map((row) => ({\n    rowNumber: row.rowNumber,\n    productId: row.productId,\n    productName: row.productName,\n    valid: row.valid,\n    errors: row.errors,\n    warnings: row.warnings\n  }));'''
          new = '''  const rowsResult: InventoryImportRowResult[] = normalizedRows.map((row) => ({\n    rowNumber: row.rowNumber,\n    productId: row.productId,\n    productName: row.productName,\n    valid: row.valid,\n    deliveryData: row.normalizedData\n      ? {\n          sku: row.normalizedData.sku,\n          barcode: row.normalizedData.barcode,\n          quantity: row.normalizedData.quantity,\n          batchCode: row.normalizedData.batchCode,\n          expirationDate: row.normalizedData.expirationDate?.toISOString() ?? null,\n          reason: row.normalizedData.reason\n        }\n      : null,\n    errors: row.errors,\n    warnings: row.warnings\n  }));'''
          if old not in text:
              raise SystemExit('rowsResult anchor not found')
          text = text.replace(old, new, 1)
          service.write_text(text)

          api = Path('frontend/src/services/catalogApi.ts')
          text = api.read_text()
          old = '''export type InventoryImportRowResult = {\n  rowNumber: number;\n  productId: string | null;\n  productName: string | null;\n  valid: boolean;\n  errors: InventoryImportError[];\n  warnings: InventoryImportError[];\n};'''
          new = '''export type InventoryImportRowResult = {\n  rowNumber: number;\n  productId: string | null;\n  productName: string | null;\n  valid: boolean;\n  deliveryData: {\n    sku: string | null;\n    barcode: string | null;\n    quantity: number;\n    batchCode: string;\n    expirationDate: string | null;\n    reason: string;\n  } | null;\n  errors: InventoryImportError[];\n  warnings: InventoryImportError[];\n};'''
          if old not in text:
              raise SystemExit('frontend row result type anchor not found')
          api.write_text(text.replace(old, new, 1))

          dialog = Path('frontend/src/components/inventory/InventoryImportDialog.tsx')
          text = dialog.read_text()
          text = text.replace('''  confirmInventoryStockImport,\n  fetchProducts,''', '''  fetchProducts,''', 1)
          text = text.replace(''',\n  type InventoryImportPreview,\n  type InventoryImportSummary\n} from "@/services/catalogApi";''', ''',\n  type InventoryImportPreview\n} from "@/services/catalogApi";''', 1)
          text = text.replace('''  const [spreadsheetSummary, setSpreadsheetSummary] = useState<InventoryImportSummary | null>(null);\n''', '', 1)
          text = text.replace('''    setSpreadsheetSummary(null);\n''', '', 4)

          start = text.find('  async function completeSpreadsheetReceipt() {')
          end = text.find('\n  async function searchProducts()', start)
          if start < 0 or end < 0:
              raise SystemExit('spreadsheet completion function anchor not found')
          replacement = '''  async function completeSpreadsheetReceipt() {\n    if (\n      !file ||\n      !preview ||\n      mode !== "SPREADSHEET" ||\n      phase !== "preview-ready" ||\n      preview.invalidRows > 0 ||\n      preview.errors.length > 0\n    ) {\n      return;\n    }\n\n    const rows = preview.rows.flatMap((row) => {\n      if (!row.valid || !row.productId || !row.deliveryData) return [];\n      return [\n        {\n          productId: row.productId,\n          receivedQuantity: row.deliveryData.quantity,\n          batchCode: row.deliveryData.batchCode,\n          expiresAt: row.deliveryData.expirationDate,\n          noExpiration: row.deliveryData.expirationDate === null,\n          reason: row.deliveryData.reason\n        }\n      ];\n    });\n\n    if (rows.length !== preview.validRows) {\n      setError("The validated spreadsheet rows could not be prepared as one delivery session.");\n      return;\n    }\n\n    const sessionId = ++requestRef.current;\n    setPhase("importing");\n    setError(null);\n\n    try {\n      const result = await waitForMinimumDuration(\n        completeBulkDeliverySession({\n          sourceType: "SPREADSHEET",\n          sourceFileName: file.name,\n          rows\n        }),\n        IMPORT_MINIMUM_MS\n      );\n      if (sessionId !== requestRef.current) return;\n\n      setDeliverySummary(result);\n      setPhase("success");\n      await onImported();\n      pushToast({\n        title: "Bulk receipt completed",\n        message: `${result.totalLines} delivery lines and ${result.totalUnitsReceived} units were received.`,\n        variant: "success"\n      });\n    } catch (importError) {\n      if (sessionId !== requestRef.current) return;\n      setPhase("preview-ready");\n      setError(importError instanceof Error ? importError.message : "Receipt completion failed.");\n    }\n  }\n'''
          text = text[:start] + replacement + text[end:]

          old = '''                      {mode === "SPREADSHEET" && spreadsheetSummary\n                        ? `${spreadsheetSummary.importedRows} lines and ${spreadsheetSummary.totalUnitsAdded} units were added to Inventory.`\n                        : deliverySummary\n                          ? `${deliverySummary.totalLines} lines and ${deliverySummary.totalUnitsReceived} units were added to Inventory.`\n                          : "The delivery receipt completed successfully."}'''
          new = '''                      {deliverySummary\n                        ? `${deliverySummary.totalLines} lines and ${deliverySummary.totalUnitsReceived} units were added to Inventory.`\n                        : "The delivery receipt completed successfully."}'''
          if old not in text:
              raise SystemExit('success summary anchor not found')
          text = text.replace(old, new, 1)
          dialog.write_text(text)
          PY
      - name: Update Phase 10 contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/restock-phase10-ui-contract-test.ts')
          text = path.read_text()
          anchor = 'assert.match(dialogSource, /completeBulkDeliverySession/);\n'
          replacement = '''assert.match(dialogSource, /completeBulkDeliverySession/);\nassert.match(dialogSource, /sourceType: "SPREADSHEET"/);\nassert.doesNotMatch(dialogSource, /confirmInventoryStockImport/);\n'''
          if anchor not in text:
              raise SystemExit('UI contract anchor not found')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Format changed files
        run: npx prettier --write backend/src/services/inventoryImportService.ts frontend/src/services/catalogApi.ts frontend/src/components/inventory/InventoryImportDialog.tsx scripts/restock-phase10-ui-contract-test.ts
      - name: Verify builds and Phase 10 contracts
        run: |
          npm run build --workspace backend
          npm run build --workspace frontend
          npm run test --workspace frontend
      - name: Commit spreadsheet Delivery Session unification
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/inventoryImportService.ts frontend/src/services/catalogApi.ts frontend/src/components/inventory/InventoryImportDialog.tsx scripts/restock-phase10-ui-contract-test.ts
          HUSKY=0 git commit -m "feat(phase10): unify spreadsheet delivery session"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
