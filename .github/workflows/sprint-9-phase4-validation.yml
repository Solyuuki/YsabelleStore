name: Sprint 9 Phase 4 Validation

on:
  push:
    branches:
      - feature/sprint9-account-security

permissions:
  contents: read

concurrency:
  group: sprint9-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase4-red-green:
    name: Phase 4 red-green gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: feature/sprint9-account-security
      YSABELLE_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build disposable CI database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Phase 4 backend regression tests
        run: >-
          npx tsx --test --test-concurrency=1
          backend/test/customer-account-security.test.ts
          backend/test/customer-account-password-concurrency.test.ts
          backend/test/customer-auth-http.test.ts
          backend/test/customer-auth-identifier.test.ts
          backend/test/customer-auth-password-security.test.ts
          backend/test/customer-auth-privacy.test.ts
          backend/test/customer-auth-rate-limit.test.ts
          backend/test/customer-order-account.test.ts

      - name: Phase 4 frontend account contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-account-frontend-test.ts

      - name: Backend typecheck
        run: npm run typecheck --workspace backend

      - name: Frontend typecheck
        run: npm run typecheck --workspace frontend

      - name: Repository lint
        run: npm run lint

      - name: Formatting check
        run: npm run format:check

      - name: Backend build
        run: npm run build --workspace backend

      - name: Frontend build
        run: npm run build --workspace frontend

      - name: Guardrail tests
        run: npm run test:guardrails

      - name: Production dependency audit
        run: npm run security:audit:production
