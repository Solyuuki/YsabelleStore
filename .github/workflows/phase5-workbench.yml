name: Phase 5 Finalizer

on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Phase 5 implementation
        run: |
          npx prettier --write \
            scripts/canonical-changeset.mjs \
            scripts/canonical-changeset-security.mjs \
            scripts/canonical-data-materializer.mjs \
            scripts/canonical-db-drift.mjs \
            scripts/canonical-state-prepare.mjs \
            scripts/canonical-push-guard.mjs \
            scripts/canonical-rebase.mjs \
            scripts/phase5-publication-rehearsal.mjs \
            scripts/verify-code.mjs \
            scripts/test/canonical-changeset.test.mjs \
            scripts/test/canonical-db-drift.test.mjs \
            scripts/test/canonical-push-guard.test.mjs \
            database/canonical/changesets/README.md \
            docs/sprints/sprint-11/README.md \
            package.json \
            .github/workflows/ci.yml

      - name: Rehearse Phase 5 publication logic
        run: |
          node --test \
            scripts/test/canonical-changeset.test.mjs \
            scripts/test/canonical-db-drift.test.mjs \
            scripts/test/canonical-data-materializer.test.mjs \
            scripts/test/canonical-push-guard.test.mjs
          npm run phase5:rehearsal
          npm run format:check

      - name: Remove temporary finalizer
        run: rm .github/workflows/phase5-workbench.yml

      - name: Commit finalized Phase 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/canonical-changeset.mjs \
            scripts/canonical-changeset-security.mjs \
            scripts/canonical-data-materializer.mjs \
            scripts/canonical-db-drift.mjs \
            scripts/canonical-state-prepare.mjs \
            scripts/canonical-push-guard.mjs \
            scripts/canonical-rebase.mjs \
            scripts/phase5-publication-rehearsal.mjs \
            scripts/verify-code.mjs \
            scripts/test/canonical-changeset.test.mjs \
            scripts/test/canonical-db-drift.test.mjs \
            scripts/test/canonical-push-guard.test.mjs \
            database/canonical/changesets/README.md \
            docs/sprints/sprint-11/README.md \
            package.json \
            .github/workflows/ci.yml \
            .github/workflows/phase5-workbench.yml
          if git diff --cached --quiet; then
            echo "No finalizer changes to commit."
            exit 0
          fi
          git commit --no-verify -m "feat(db): finalize phase 5 canonical publication"
          git push origin HEAD:sprint/v0.11/sprint-11
