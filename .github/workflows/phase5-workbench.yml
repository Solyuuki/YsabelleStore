name: Phase 5 Workbench

on:
  push:
    branches:
      - "sprint/v0.11/sprint-11"

permissions:
  contents: read

jobs:
  format:
    name: Format Phase 5 files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package repository source snapshot
        run: git archive --format=tar.gz --output=phase5-repo.tar.gz HEAD

      - name: Upload repository source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5-repo
          path: phase5-repo.tar.gz
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format Phase 5 files
        run: |
          npx prettier --write \
            scripts/canonical-changeset.mjs \
            scripts/canonical-changeset-security.mjs \
            scripts/canonical-data-materializer.mjs \
            scripts/canonical-db-drift.mjs \
            scripts/test/canonical-changeset.test.mjs \
            scripts/test/canonical-db-drift.test.mjs \
            database/canonical/changesets/README.md

      - name: Package formatted sources
        run: |
          mkdir -p phase5-formatted/scripts/test phase5-formatted/database/canonical/changesets
          cp scripts/canonical-changeset.mjs phase5-formatted/scripts/
          cp scripts/canonical-changeset-security.mjs phase5-formatted/scripts/
          cp scripts/canonical-data-materializer.mjs phase5-formatted/scripts/
          cp scripts/canonical-db-drift.mjs phase5-formatted/scripts/
          cp scripts/test/canonical-changeset.test.mjs phase5-formatted/scripts/test/
          cp scripts/test/canonical-db-drift.test.mjs phase5-formatted/scripts/test/
          cp database/canonical/changesets/README.md phase5-formatted/database/canonical/changesets/

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: phase5-formatted
          path: phase5-formatted
          if-no-files-found: error
