name: Sprint 9 Phase 2 Manual Evidence Fix

on:
  push:
    branches:
      - m1/v0.9/feat/customer-auth-access

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-auth-access
          fetch-depth: 0
      - name: Normalize manual evidence result
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/implementation-artifacts/m1-abarado/TESTING-REPORTS.md';
          let content = fs.readFileSync(path, 'utf8');
          const before = '| 2026-08-26 | Changed files                                                          | Passed                        | Customer registration/login/session/logout and Staff/Owner realm-isolation manual QA completed; cross-realm auth toast containment visually verified.               |';
          const after = '| 2026-08-26 | Changed files                                                          | Manually verified             | Customer registration/login/session/logout and Staff/Owner realm-isolation manual QA completed; cross-realm auth toast containment visually verified.               |';
          if (!content.includes(before)) {
            throw new Error('Expected Phase 2 manual evidence row was not found.');
          }
          content = content.replace(before, after);
          fs.writeFileSync(path, content);
          NODE
      - name: Format artifact Markdown
        run: npx prettier --write docs/implementation-artifacts/m1-abarado/TESTING-REPORTS.md
      - name: Commit corrected evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-artifacts/m1-abarado/TESTING-REPORTS.md
          git commit -m "docs(sprint9): classify Phase 2 manual QA evidence"
          git -c core.hooksPath=/dev/null push origin HEAD:m1/v0.9/feat/customer-auth-access
