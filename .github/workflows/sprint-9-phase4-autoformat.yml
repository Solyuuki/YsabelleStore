name: Sprint 9 Phase 4 Autoformat

on:
  push:
    branches:
      - feature/sprint9-account-security

permissions:
  contents: write

concurrency:
  group: sprint9-phase4-autoformat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-phase4:
    name: Format files blocking Phase 4 gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 4 and inherited blocking files
        run: >-
          npx prettier --write
          backend/src/controllers/customerAccountController.ts
          backend/src/middleware/authRateLimit.ts
          backend/src/routes/customerAccount.routes.ts
          backend/src/routes/customerAuth.routes.ts
          backend/src/security/security.constants.ts
          backend/src/services/customerAccountService.ts
          backend/src/services/customerAuthService.ts
          backend/src/utils/customerRegistrationIntent.ts
          backend/src/validators/customerAccount.validators.ts
          backend/test/customer-account-security.test.ts
          backend/test/customer-account-password-concurrency.test.ts
          backend/test/customer-auth-rate-limit.test.ts
          docs/superpowers/plans/2026-08-25-auth-separation-and-customer-login.md
          docs/superpowers/plans/2026-08-25-customer-auth-security-foundation.md
          docs/superpowers/plans/2026-08-25-customer-identifier-login.md
          frontend/src/app/CustomerApp.tsx
          frontend/src/pages/customer/CustomerAccountPage.tsx
          frontend/src/services/customerAccountService.ts
          frontend/src/services/customerAuthService.ts
          frontend/src/styles/auth-brand.css
          frontend/src/styles/customer-account.css
          frontend/src/types/customerAccount.ts
          README.md
          scripts/customer-account-frontend-test.ts
          scripts/customer-auth-form-contract-test.ts
          scripts/customer-auth-frontend-test.ts
          scripts/customer-auth-ui-contract-test.ts
          scripts/test/auth-brand-boundary.test.mjs
          .github/workflows/sprint-9-phase4-validation.yml
          .github/workflows/sprint-9-phase4-autoformat.yml

      - name: Verify repository formatting is green
        run: npm run format:check

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting is already green."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          HUSKY=0 git commit -m "style(account): resolve Phase 4 formatting gate"
          git push origin HEAD:feature/sprint9-account-security
