name: Status Screen Format Helper

on:
  push:
    branches:
      - "m1/v0.11/feat/status-screen-system"
    paths:
      - ".github/workflows/status-screen-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.11/feat/status-screen-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format status-screen files
        run: npx prettier --write frontend/src/components/shared/StatusScreen.tsx docs/sprints/sprint-11/STATUS-SCREEN-UX.md
      - name: Remove helper and commit normalized formatting
        shell: bash
        run: |
          git rm .github/workflows/status-screen-format-helper.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/shared/StatusScreen.tsx docs/sprints/sprint-11/STATUS-SCREEN-UX.md
          HUSKY=0 git commit -m "style(ui): normalize status screen files with repository formatter"
          HUSKY=0 git push origin HEAD:m1/v0.11/feat/status-screen-system
