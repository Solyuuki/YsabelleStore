name: Sprint 5 Temporary Validation

on:
  push:
    branches:
      - sprint/v0.5/sprint-5

permissions:
  contents: write

concurrency:
  group: sprint-5-temporary-validation
  cancel-in-progress: true

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
    steps:
      - name: Checkout sprint branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.5/sprint-5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format reported Sprint 5 surfaces
        run: |
          npx prettier --write \
            .agents/skills/ysabelle-context/agents/openai.yaml \
            .agents/skills/ysabelle-context/SKILL.md \
            .github/workflows/sprint-5-temporary-validation.yml \
            config/guardrails.json \
            config/repository-context.json \
            docs/architecture/01-system-framework.md \
            docs/architecture/03-folder-architecture.md \
            docs/architecture/10-thesis-scope-alignment.md \
            docs/PROJECT-SCOPE.md \
            docs/sprints/sprint-5/DEFINITION-OF-DONE.md \
            docs/sprints/sprint-5/GUIDANCE-SOURCE-OF-TRUTH-AUDIT.md \
            docs/sprints/sprint-5/PILOT-BENCHMARKS.md \
            docs/sprints/sprint-5/README.md \
            docs/sprints/sprint-5/REPOSITORY-CONTEXT-PLAN.md \
            docs/sprints/sprint-5/SPRINT-BACKLOG.md \
            docs/sprints/sprint-5/SPRINT-GOAL.md \
            docs/standards/01-big-picture.md \
            docs/standards/010-golden-rules.md \
            docs/standards/02-folder-map.md \
            docs/standards/07-member-ownership.md \
            package.json \
            README.md \
            scripts/test/prisma-client-generation.test.mjs \
            scripts/verify-code.mjs \
            tools/repo-context/cli.mjs \
            tools/repo-context/lib/context-core.mjs \
            tools/repo-context/lib/footprint.mjs \
            tools/repo-context/lib/mcp-handler.mjs \
            tools/repo-context/lib/repository-runtime.mjs \
            tools/repo-context/lib/runtime.mjs \
            tools/repo-context/mcp-server.mjs \
            tools/repo-context/README.md \
            tools/repo-context/test/repo-context-finalization.test.mjs \
            tools/repo-context/test/repo-context.test.mjs

      - name: Commit formatting before verification
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            package.json \
            config/guardrails.json \
            config/repository-context.json \
            docs \
            .agents/skills/ysabelle-context \
            .github/workflows/sprint-5-temporary-validation.yml \
            scripts/test/prisma-client-generation.test.mjs \
            scripts/verify-code.mjs \
            tools/repo-context
          git commit -m "style: format sprint 5 context finalization [skip ci]"
          git push origin HEAD:sprint/v0.5/sprint-5

      - name: Run full read-only repository verification
        run: npm run verify:code
