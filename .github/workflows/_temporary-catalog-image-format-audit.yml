name: Temporary Catalog Image Format Audit
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
jobs:
  print-prettier-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx prettier --write scripts/canonical-data-materializer.mjs scripts/canonical-runtime-image-overrides.mjs scripts/canonical-asset-materializer.mjs scripts/catalog-image-publication-proposal.mjs scripts/test/canonical-runtime-image-overrides.test.mjs frontend/src/pages/customer/ProductDetailPage.tsx frontend/src/services/storefrontService.ts backend/src/controllers/storefrontController.ts backend/src/services/productService.ts docs/architecture/CATALOG-IMAGE-RUNTIME-PERSISTENCE.md package.json
          git diff --no-ext-diff -- scripts/canonical-data-materializer.mjs scripts/canonical-runtime-image-overrides.mjs scripts/canonical-asset-materializer.mjs scripts/catalog-image-publication-proposal.mjs scripts/test/canonical-runtime-image-overrides.test.mjs frontend/src/pages/customer/ProductDetailPage.tsx frontend/src/services/storefrontService.ts backend/src/controllers/storefrontController.ts backend/src/services/productService.ts docs/architecture/CATALOG-IMAGE-RUNTIME-PERSISTENCE.md package.json
