name: Generation 2 Format Review

on:
  push:
    branches:
      - "sprint/**"
    paths:
      - ".github/workflows/generation2-format-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Generation 2 sources
        run: |
          npx prettier --write             database/prisma/MIGRATION_GENERATION_2.md             scripts/migration-checksums.mjs             scripts/migration-security.mjs             scripts/test/migration-security.test.mjs
          for file in             database/prisma/MIGRATION_GENERATION_2.md             scripts/migration-checksums.mjs             scripts/migration-security.mjs             scripts/test/migration-security.test.mjs
          do
            echo "-----BEGIN FILE:$file-----"
            cat "$file"
            echo "-----END FILE:$file-----"
          done
