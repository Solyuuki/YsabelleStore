name: Sprint 9 Phase 2 Artifact Refresh

on:
  push:
    branches:
      - m1/v0.9/feat/customer-auth-access

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-auth-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh M1 Sprint 9 artifacts
        run: npm run artifact-update -- --validation=Passed
      - name: Record completed Phase 2 manual QA
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/implementation-artifacts/m1-abarado/TESTING-REPORTS.md';
          let content = fs.readFileSync(path, 'utf8');
          const date = '2026-08-26';
          const lines = content.split(/\r?\n/);
          let inManual = false;
          for (let i = 0; i < lines.length; i += 1) {
            if (lines[i].trim() === '## Manual Review Evidence') inManual = true;
            else if (inManual && lines[i].startsWith('## ')) inManual = false;
            if (inManual && lines[i].startsWith(`| ${date} |`)) {
              const cells = lines[i].split('|').map((cell) => cell.trim());
              if (cells.length >= 6) {
                cells[3] = 'Passed';
                cells[4] = 'Customer registration/login/session/logout and Staff/Owner realm-isolation manual QA completed; cross-realm auth toast containment visually verified.';
                lines[i] = `| ${cells.slice(1, -1).join(' | ')} |`;
              }
            }
          }
          fs.writeFileSync(path, lines.join('\n'));
          NODE
      - name: Format artifact Markdown
        run: npx prettier --write docs/implementation-artifacts/m1-abarado
      - name: Commit refreshed evidence
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No artifact changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-artifacts/m1-abarado
          git commit -m "docs(sprint9): record Phase 2 verification evidence"
          git -c core.hooksPath=/dev/null push origin HEAD:m1/v0.9/feat/customer-auth-access
