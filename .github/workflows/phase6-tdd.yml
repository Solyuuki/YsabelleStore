name: Phase 6 TDD

on:
  workflow_dispatch:
  push:
    branches:
      - "m1/v0.9/feat/customer-social-auth"
    paths:
      # Keep the gate itself in scope so Phase 6 workflow changes self-verify.
      - ".github/workflows/phase6-tdd.yml"
      - "tsconfig.json"
      - "backend/src/config/env.ts"
      - "backend/src/services/customerSocialAuthService.ts"
      - "backend/src/services/customerOAuthTransactionService.ts"
      - "backend/src/services/customerOAuthProviderService.ts"
      - "backend/src/services/customerOAuthService.ts"
      - "backend/src/controllers/customerSocialAuthController.ts"
      - "backend/src/routes/customerAuth.routes.ts"
      - "backend/src/utils/customerOAuthCookie.ts"
      - "backend/test/customer-oauth-env.test.ts"
      - "backend/test/customer-social-auth.test.ts"
      - "backend/test/customer-oauth-transaction.test.ts"
      - "backend/test/customer-oauth-provider.test.ts"
      - "backend/test/customer-oauth-flow.test.ts"
      - "backend/test/customer-oauth-electron-flow.test.ts"
      - "backend/test/customer-social-auth-http.test.ts"
      - "database/prisma/schema.prisma"
      - "database/prisma/migrations/**"
      - "frontend/src/components/customer/CustomerSocialAuthButtons.tsx"
      - "frontend/src/pages/customer/CustomerLoginPage.tsx"
      - "frontend/src/pages/customer/CustomerRegisterPage.tsx"
      - "frontend/src/styles/customer-auth-quick-sign.css"
      - "frontend/src/services/customerSocialAuthService.ts"
      - "scripts/customer-auth-ui-contract-test.ts"
      - "scripts/customer-social-auth-ui-test.ts"
      - "scripts/test/customer-auth-quick-sign-preview.test.mjs"

permissions:
  contents: read

jobs:
  backend-social-auth:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_phase6
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_phase6
      JWT_SECRET: phase6-test-jwt-secret
      CUSTOMER_OAUTH_TRANSACTION_KEY: phase6-test-oauth-transaction-key-at-least-32-bytes
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate
      - name: Compile backend
        run: npm run build --workspace backend
      - name: Run focused Phase 6 backend tests
        run: npx tsx --test --test-concurrency=1 backend/test/customer-oauth-env.test.ts backend/test/customer-social-auth.test.ts backend/test/customer-oauth-transaction.test.ts backend/test/customer-oauth-provider.test.ts backend/test/customer-oauth-flow.test.ts backend/test/customer-oauth-electron-flow.test.ts backend/test/customer-social-auth-http.test.ts

  frontend-social-auth-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run customer auth route contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-auth-ui-contract-test.ts
      - name: Run customer social auth UI contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-social-auth-ui-test.ts
      - name: Build frontend
        run: npm run build --workspace frontend
