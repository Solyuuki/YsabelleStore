name: Temporary Prettier Diff

on:
  push:
    branches:
      - sprint/v0.11/sprint-11

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: npx prettier --write frontend/src/pages/DashboardPage.tsx

      - name: Print Prettier diff
        run: git diff -- frontend/src/pages/DashboardPage.tsx
