name: Temporary Prettier Fix

on:
  push:
    branches:
      - sprint/v0.11/sprint-11

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.11/sprint-11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: >-
          npx prettier --write
          frontend/src/pages/DashboardPage.tsx
          frontend/src/components/reports/RestockForecastPanel.tsx
          scripts/test/dashboard-monthly-inventory-report.test.mjs
          scripts/test/staff-support-contract.test.mjs

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/DashboardPage.tsx             frontend/src/components/reports/RestockForecastPanel.tsx             scripts/test/dashboard-monthly-inventory-report.test.mjs             scripts/test/staff-support-contract.test.mjs
          git commit -m "chore: apply prettier formatting"
          git push origin HEAD:sprint/v0.11/sprint-11
