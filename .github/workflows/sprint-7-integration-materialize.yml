name: Sprint 7 Integration Materialize

on:
  push:
    branches:
      - m1/v0.7/fix/sprint6-sprint7-integration
  pull_request:
    branches:
      - sprint/v0.7/sprint-7

permissions:
  contents: write

concurrency:
  group: sprint-7-integration-materialize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  materialize-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable integration branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.7/fix/sprint6-sprint7-integration
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge accepted Sprint 6 and resolve exact known conflicts
        id: merge
        run: |
          set -euo pipefail
          git fetch origin sprint/v0.6/sprint-6 sprint/v0.7/sprint-7

          if git merge-base --is-ancestor origin/sprint/v0.6/sprint-6 HEAD; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_merged=false" >> "$GITHUB_OUTPUT"
          set +e
          git merge --no-commit --no-ff origin/sprint/v0.6/sprint-6
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "backend/package.json"
              "backend/src/controllers/storefrontController.ts"
              "docs/sprints/sprint-6/SPRINT-BACKLOG.md"
              "frontend/package.json"
              "frontend/src/app/CustomerApp.tsx"
              "frontend/src/components/customer/CustomerHeader.tsx"
            )
            printf '%s\n' "${conflicts[@]}" | sort > /tmp/actual-conflicts.txt
            printf '%s\n' "${expected[@]}" | sort > /tmp/expected-conflicts.txt
            diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt

            git checkout --ours backend/package.json
            git checkout --ours backend/src/controllers/storefrontController.ts
            git checkout --theirs docs/sprints/sprint-6/SPRINT-BACKLOG.md
            git checkout --ours frontend/package.json
            git checkout --ours frontend/src/app/CustomerApp.tsx
            git checkout --ours frontend/src/components/customer/CustomerHeader.tsx
          fi

          node <<'NODE'
          const fs = require('fs');
          const backend = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
          backend.scripts.test = [
            'tsx --test --test-concurrency=1',
            'test/auth-security.test.ts', 'test/customer-auth.test.ts',
            'test/customer-auth-http.test.ts', 'test/customer-order-account.test.ts',
            'test/cors.test.ts', 'test/catalog-image-process-gate.test.ts',
            'test/catalog-image-engine-runner.test.ts', 'test/catalog-image-storage.test.ts',
            'test/catalog-image-foundation.test.ts', 'test/catalog-image-approval.test.ts',
            'test/catalog-image-storefront.test.ts', 'test/catalog-image-url.test.ts',
            'test/catalog-image-backfill.test.ts', 'test/catalog-image-latest-candidate.test.ts',
            'test/catalog-quality.test.ts', 'test/data-flow.test.ts', 'test/storefront.test.ts',
            'test/storefront-product-detail.test.ts', 'test/forecast-delivery.test.ts',
            'test/forecast-fallback.test.ts', 'test/historical-sales-rules.test.ts',
            'test/inventory-import.test.ts'
          ].join(' ');
          backend.scripts.lint = 'eslint src test';
          fs.writeFileSync('backend/package.json', JSON.stringify(backend, null, 2) + '\n');

          const frontend = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
          frontend.scripts.lint = 'eslint src vite.config.ts tailwind.config.ts postcss.config.js';
          fs.writeFileSync('frontend/package.json', JSON.stringify(frontend, null, 2) + '\n');
          NODE

          python <<'PY'
          from pathlib import Path

          p = Path('backend/src/controllers/storefrontController.ts')
          s = p.read_text()
          auth = 'import { getAuthenticatedCustomer } from "../middleware/customerAuthMiddleware.js";\n'
          ciqe = 'import { resolveProductDetailImageUrl } from "../modules/catalog-image/catalogImageUrls.js";\n'
          if ciqe not in s:
              if auth not in s: raise SystemExit('missing storefront auth import anchor')
              s = s.replace(auth, auth + ciqe)
          old = '    const product = await getStorefrontProduct(params.id);\n    response.json(createSuccessResponse("Storefront product loaded.", product));'
          new = '    const product = await getStorefrontProduct(params.id);\n    response.json(\n      createSuccessResponse("Storefront product loaded.", {\n        ...product,\n        detailImageUrl: resolveProductDetailImageUrl(product.imageUrl)\n      })\n    );'
          if old in s: s = s.replace(old, new)
          elif 'detailImageUrl: resolveProductDetailImageUrl(product.imageUrl)' not in s:
              raise SystemExit('missing storefront product-detail anchor')
          p.write_text(s)

          p = Path('frontend/src/app/CustomerApp.tsx')
          s = p.read_text()
          anchor = 'import { CustomerLayout } from "@/layouts/CustomerLayout";\n'
          about = 'import { AboutExperiencePage } from "@/pages/customer/AboutExperiencePage";\n'
          if about not in s:
              if anchor not in s: raise SystemExit('missing CustomerApp import anchor')
              s = s.replace(anchor, anchor + about)
          old_css = 'import "@/styles/customer.css";\nimport "@/styles/customer-auth.css";\n'
          new_css = 'import "driver.js/dist/driver.css";\nimport "@/styles/customer.css";\nimport "@/styles/customer-auth.css";\nimport "@/styles/brand.css";\nimport "@/styles/shopping-guide.css";\n'
          if 'import "@/styles/brand.css";' not in s:
              if old_css not in s: raise SystemExit('missing CustomerApp stylesheet anchor')
              s = s.replace(old_css, new_css)
          old_path = '  const pathname = new URL(location, window.location.origin).pathname.replace(/\\/$/, "") || "/";'
          new_path = '  const rawPathname =\n    new URL(location, window.location.origin).pathname.replace(/\\/$/, "") || "/";\n  const pathname =\n    window.location.protocol === "file:" && rawPathname.endsWith("/index.html")\n      ? "/"\n      : rawPathname;'
          if old_path in s: s = s.replace(old_path, new_path)
          elif 'rawPathname.endsWith("/index.html")' not in s: raise SystemExit('missing CustomerApp pathname anchor')
          s = s.replace(
              '  else if (pathname === "/about") page = <DiscoverPage navigate={navigate} />;',
              '  else if (pathname === "/about") page = <AboutExperiencePage navigate={navigate} />;'
          )
          p.write_text(s)

          p = Path('frontend/src/components/customer/CustomerHeader.tsx')
          s = p.read_text()
          s = s.replace(
              'import { CircleHelp, Menu, ShoppingBasket, Store, UserRound, X } from "lucide-react";',
              'import { CircleHelp, Menu, ShoppingBasket, UserRound, X } from "lucide-react";'
          )
          anchor = 'import { GlobalStorefrontSearch } from "./GlobalStorefrontSearch";\n'
          brand = 'import { YsabelleBrandMark } from "./YsabelleBrandMark";\n'
          if brand not in s:
              if anchor not in s: raise SystemExit('missing CustomerHeader import anchor')
              s = s.replace(anchor, anchor + brand)
          old_brand = '          <span className="customer-brand__mark">\n            <Store aria-hidden="true" size={22} />\n          </span>'
          if old_brand in s: s = s.replace(old_brand, '          <YsabelleBrandMark eager />')
          elif '<YsabelleBrandMark eager />' not in s: raise SystemExit('missing CustomerHeader brand anchor')
          p.write_text(s)
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up Node.js
        if: steps.merge.outputs.already_merged == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.merge.outputs.already_merged == 'false'
        run: npm ci

      - name: Format merge result and remove temporary workflows
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          npx prettier --write \
            backend/package.json \
            backend/src/controllers/storefrontController.ts \
            docs/sprints/sprint-6/SPRINT-BACKLOG.md \
            frontend/package.json \
            frontend/src/app/CustomerApp.tsx \
            frontend/src/components/customer/CustomerHeader.tsx \
            scripts/brand-assets-test.mjs
          rm -f .github/workflows/sprint-7-integration-materialize.yml
          rm -f .github/workflows/sprint-7-materialize-diagnostic.yml
          rm -f .github/workflows/sprint-6-format-brand-test.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Commit and push actual two-parent merge
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          git commit -m "merge: integrate accepted Sprint 6 into Sprint 7"
          git push origin HEAD:m1/v0.7/fix/sprint6-sprint7-integration
