name: Sprint 7 Integration Materialize

on:
  push:
    branches:
      - m1/v0.7/fix/sprint6-sprint7-integration

permissions:
  contents: write

concurrency:
  group: sprint-7-integration-materialize
  cancel-in-progress: true

jobs:
  materialize-verified-merge:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: sprint-7-integration-materialize-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: m1/v0.7/fix/sprint6-sprint7-integration
      YSABELLE_BASE_REF: sprint/v0.7/sprint-7
    steps:
      - name: Checkout writable integration branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.7/fix/sprint6-sprint7-integration
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge accepted Sprint 6 and resolve exact known conflicts
        id: merge
        run: |
          set -euo pipefail
          git fetch origin sprint/v0.6/sprint-6 sprint/v0.7/sprint-7

          if git merge-base --is-ancestor origin/sprint/v0.6/sprint-6 HEAD; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "Sprint 6 is already an ancestor of this branch."
            exit 0
          fi

          echo "already_merged=false" >> "$GITHUB_OUTPUT"
          set +e
          git merge --no-commit --no-ff origin/sprint/v0.6/sprint-6
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "backend/package.json"
              "backend/src/controllers/storefrontController.ts"
              "docs/sprints/sprint-6/SPRINT-BACKLOG.md"
              "frontend/package.json"
              "frontend/src/app/CustomerApp.tsx"
              "frontend/src/components/customer/CustomerHeader.tsx"
            )

            printf '%s\n' "${conflicts[@]}" | sort > /tmp/actual-conflicts.txt
            printf '%s\n' "${expected[@]}" | sort > /tmp/expected-conflicts.txt
            if ! diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt; then
              echo "Unexpected merge-conflict set; refusing to guess."
              exit 1
            fi

            git checkout --ours backend/package.json
            git checkout --ours backend/src/controllers/storefrontController.ts
            git checkout --theirs docs/sprints/sprint-6/SPRINT-BACKLOG.md
            git checkout --ours frontend/package.json
            git checkout --ours frontend/src/app/CustomerApp.tsx
            git checkout --ours frontend/src/components/customer/CustomerHeader.tsx
          fi

          node <<'NODE'
          const fs = require('fs');

          const backendPath = 'backend/package.json';
          const backend = JSON.parse(fs.readFileSync(backendPath, 'utf8'));
          backend.scripts.test = [
            'tsx --test --test-concurrency=1',
            'test/auth-security.test.ts',
            'test/customer-auth.test.ts',
            'test/customer-auth-http.test.ts',
            'test/customer-order-account.test.ts',
            'test/cors.test.ts',
            'test/catalog-image-process-gate.test.ts',
            'test/catalog-image-engine-runner.test.ts',
            'test/catalog-image-storage.test.ts',
            'test/catalog-image-foundation.test.ts',
            'test/catalog-image-approval.test.ts',
            'test/catalog-image-storefront.test.ts',
            'test/catalog-image-url.test.ts',
            'test/catalog-image-backfill.test.ts',
            'test/catalog-image-latest-candidate.test.ts',
            'test/catalog-quality.test.ts',
            'test/data-flow.test.ts',
            'test/storefront.test.ts',
            'test/storefront-product-detail.test.ts',
            'test/forecast-delivery.test.ts',
            'test/forecast-fallback.test.ts',
            'test/historical-sales-rules.test.ts',
            'test/inventory-import.test.ts'
          ].join(' ');
          backend.scripts.lint = 'eslint src test';
          fs.writeFileSync(backendPath, `${JSON.stringify(backend, null, 2)}\n`);

          const frontendPath = 'frontend/package.json';
          const frontend = JSON.parse(fs.readFileSync(frontendPath, 'utf8'));
          frontend.scripts.lint = 'eslint src vite.config.ts tailwind.config.ts postcss.config.js';
          fs.writeFileSync(frontendPath, `${JSON.stringify(frontend, null, 2)}\n`);
          NODE

          python <<'PY'
          from pathlib import Path

          path = Path('backend/src/controllers/storefrontController.ts')
          text = path.read_text()
          auth_import = 'import { getAuthenticatedCustomer } from "../middleware/customerAuthMiddleware.js";\n'
          ciqe_import = 'import { resolveProductDetailImageUrl } from "../modules/catalog-image/catalogImageUrls.js";\n'
          if ciqe_import not in text:
              if auth_import not in text:
                  raise SystemExit('storefrontController auth import anchor not found')
              text = text.replace(auth_import, auth_import + ciqe_import)
          old = '    const product = await getStorefrontProduct(params.id);\n    response.json(createSuccessResponse("Storefront product loaded.", product));'
          new = '    const product = await getStorefrontProduct(params.id);\n    response.json(\n      createSuccessResponse("Storefront product loaded.", {\n        ...product,\n        detailImageUrl: resolveProductDetailImageUrl(product.imageUrl)\n      })\n    );'
          if old in text:
              text = text.replace(old, new)
          elif 'detailImageUrl: resolveProductDetailImageUrl(product.imageUrl)' not in text:
              raise SystemExit('storefrontController product-detail merge anchor not found')
          path.write_text(text)

          path = Path('frontend/src/app/CustomerApp.tsx')
          text = path.read_text()
          anchor = 'import { CustomerLayout } from "@/layouts/CustomerLayout";\n'
          about_import = 'import { AboutExperiencePage } from "@/pages/customer/AboutExperiencePage";\n'
          if about_import not in text:
              if anchor not in text:
                  raise SystemExit('CustomerApp import anchor not found')
              text = text.replace(anchor, anchor + about_import)
          css_old = 'import "@/styles/customer.css";\nimport "@/styles/customer-auth.css";\n'
          css_new = (
              'import "driver.js/dist/driver.css";\n'
              'import "@/styles/customer.css";\n'
              'import "@/styles/customer-auth.css";\n'
              'import "@/styles/brand.css";\n'
              'import "@/styles/shopping-guide.css";\n'
          )
          if 'import "@/styles/brand.css";' not in text:
              if css_old not in text:
                  raise SystemExit('CustomerApp stylesheet anchor not found')
              text = text.replace(css_old, css_new)
          old_path = '  const pathname = new URL(location, window.location.origin).pathname.replace(/\\/$/, "") || "/";'
          new_path = (
              '  const rawPathname =\n'
              '    new URL(location, window.location.origin).pathname.replace(/\\/$/, "") || "/";\n'
              '  const pathname =\n'
              '    window.location.protocol === "file:" && rawPathname.endsWith("/index.html")\n'
              '      ? "/"\n'
              '      : rawPathname;'
          )
          if old_path in text:
              text = text.replace(old_path, new_path)
          elif 'rawPathname.endsWith("/index.html")' not in text:
              raise SystemExit('CustomerApp pathname merge anchor not found')
          text = text.replace(
              '  else if (pathname === "/about") page = <DiscoverPage navigate={navigate} />;',
              '  else if (pathname === "/about") page = <AboutExperiencePage navigate={navigate} />;'
          )
          path.write_text(text)

          path = Path('frontend/src/components/customer/CustomerHeader.tsx')
          text = path.read_text()
          text = text.replace(
              'import { CircleHelp, Menu, ShoppingBasket, Store, UserRound, X } from "lucide-react";',
              'import { CircleHelp, Menu, ShoppingBasket, UserRound, X } from "lucide-react";'
          )
          link_import = 'import { GlobalStorefrontSearch } from "./GlobalStorefrontSearch";\n'
          brand_import = 'import { YsabelleBrandMark } from "./YsabelleBrandMark";\n'
          if brand_import not in text:
              if link_import not in text:
                  raise SystemExit('CustomerHeader import anchor not found')
              text = text.replace(link_import, link_import + brand_import)
          old_brand = '''          <span className="customer-brand__mark">\n            <Store aria-hidden="true" size={22} />\n          </span>'''
          if old_brand in text:
              text = text.replace(old_brand, '          <YsabelleBrandMark eager />')
          elif '<YsabelleBrandMark eager />' not in text:
              raise SystemExit('CustomerHeader brand merge anchor not found')
          path.write_text(text)
          PY

          git add -A
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Remove temporary integration-only workflows from merge result
        run: |
          rm -f .github/workflows/sprint-7-integration-format.yml
          rm -f .github/workflows/sprint-7-integration-materialize.yml
          rm -f .github/workflows/sprint-6-format-brand-test.yml
          git add -A

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install CIQE Python dependencies
        run: python -m pip install -r catalog-image-engine/requirements.txt

      - name: Format resolved merge surface
        run: >-
          npx prettier --write
          backend/package.json
          backend/src/controllers/storefrontController.ts
          docs/sprints/sprint-6/SPRINT-BACKLOG.md
          frontend/package.json
          frontend/src/app/CustomerApp.tsx
          frontend/src/components/customer/CustomerHeader.tsx
          scripts/brand-assets-test.mjs

      - name: Stage formatted merge result
        run: git add -A

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build disposable integration database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Run focused Sprint 6 and Sprint 7 backend regressions
        run: >-
          npx tsx --test --test-concurrency=1
          backend/test/auth-security.test.ts
          backend/test/customer-auth.test.ts
          backend/test/customer-auth-http.test.ts
          backend/test/customer-order-account.test.ts
          backend/test/catalog-image-process-gate.test.ts
          backend/test/catalog-image-engine-runner.test.ts
          backend/test/catalog-image-storage.test.ts
          backend/test/catalog-image-foundation.test.ts
          backend/test/catalog-image-approval.test.ts
          backend/test/catalog-image-storefront.test.ts
          backend/test/catalog-image-url.test.ts
          backend/test/catalog-image-backfill.test.ts
          backend/test/catalog-image-latest-candidate.test.ts

      - name: Run CIQE Python suite
        run: npm run catalog-images:test

      - name: Run backend workspace suite
        run: npm test --workspace @ysabellestore/backend

      - name: Run frontend authentication suite
        run: npm test --workspace @ysabellestore/frontend

      - name: Check formatting
        run: npm run format:check

      - name: Lint repository
        run: npm run lint

      - name: Typecheck repository
        run: npm run typecheck

      - name: Run guardrail regressions
        run: npm run test:guardrails

      - name: Build repository
        run: npm run build

      - name: Audit production dependency reachability
        run: npm run security:audit:production

      - name: Run read-only repository verification
        run: npm run verify:code

      - name: Commit and push actual verified two-parent merge
        if: steps.merge.outputs.already_merged == 'false'
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          git commit -m "merge: integrate accepted Sprint 6 into Sprint 7"
          git push origin HEAD:m1/v0.7/fix/sprint6-sprint7-integration
