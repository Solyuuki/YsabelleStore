name: Sprint 8 Frontend Health Refresh

on:
  push:
    branches:
      - sprint/v0.8/sprint-8

permissions:
  contents: write

jobs:
  refresh-health-indicator:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 8
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.8/sprint-8
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update health indicator copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/WelcomePage.tsx')
          text = path.read_text()
          old_copy = '''const systemHealthFooterCopy: Record<SystemHealthState, string> = {
            checking: "Checking system...",
            healthy: "All Systems Normal",
            warning: "Service Warning",
            "database-unavailable": "Database Unavailable",
            offline: "System Offline"
          };'''
          new_copy = '''const systemHealthFooterCopy: Record<SystemHealthState, string> = {
            checking: "Checking system...",
            healthy: "All Systems Normal",
            degraded: "Service Degraded",
            "database-unavailable": "Database Unavailable",
            "backend-unavailable": "Backend Unavailable",
            timeout: "Health Check Timed Out",
            offline: "Device Offline"
          };'''
          old_dot = '''const systemHealthFooterDotClass: Record<SystemHealthState, string> = {
            checking: "bg-sky-400",
            healthy: "bg-emerald-500",
            warning: "bg-amber-500",
            "database-unavailable": "bg-orange-500",
            offline: "bg-red-500"
          };'''
          new_dot = '''const systemHealthFooterDotClass: Record<SystemHealthState, string> = {
            checking: "bg-sky-400",
            healthy: "bg-emerald-500",
            degraded: "bg-amber-500",
            "database-unavailable": "bg-orange-500",
            "backend-unavailable": "bg-red-500",
            timeout: "bg-violet-500",
            offline: "bg-slate-500"
          };'''
          if old_copy not in text or old_dot not in text:
              raise SystemExit('Expected Sprint 8 health indicator blocks were not found')
          path.write_text(text.replace(old_copy, new_copy).replace(old_dot, new_dot))
          PY
          npx prettier --write frontend/src/pages/WelcomePage.tsx frontend/src/services/systemHealthService.ts scripts/system-health-reliability-test.ts
      - name: Verify frontend reliability state work
        run: |
          npm run test --workspace @ysabellestore/frontend
          npm run typecheck --workspace @ysabellestore/frontend
          npm run build --workspace @ysabellestore/frontend
      - name: Commit health indicator update and remove workflow
        run: |
          rm -f .github/workflows/sprint8-frontend-health-refresh-temp.yml
          git add frontend/src/pages/WelcomePage.tsx frontend/src/services/systemHealthService.ts scripts/system-health-reliability-test.ts .github/workflows/sprint8-frontend-health-refresh-temp.yml
          git diff --cached --check
          git commit -m "feat(sprint8): surface detailed reliability states"
      - name: Push verified frontend update
        env:
          HUSKY: "0"
        run: git push origin HEAD:sprint/v0.8/sprint-8
