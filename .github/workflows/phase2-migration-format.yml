name: Phase 2 Migration Format

on:
  push:
    branches:
      - "sprint/**"
    paths:
      - ".github/workflows/phase2-migration-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Phase 2 migration security files
        run: |
          npx prettier --write \
            scripts/migration-security.mjs \
            scripts/test/migration-security.test.mjs \
            scripts/migration-upgrade-rehearsal.mjs \
            scripts/canonical-push-guard.mjs \
            scripts/test/canonical-push-guard.test.mjs \
            database/prisma/state/legacy-migration-blobs.json \
            package.json \
            .github/workflows/ci.yml \
            database/prisma/MIGRATION_GENERATION_2.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/migration-security.mjs \
            scripts/test/migration-security.test.mjs \
            scripts/migration-upgrade-rehearsal.mjs \
            scripts/canonical-push-guard.mjs \
            scripts/test/canonical-push-guard.test.mjs \
            database/prisma/state/legacy-migration-blobs.json \
            package.json \
            .github/workflows/ci.yml \
            database/prisma/MIGRATION_GENERATION_2.md
          git commit -m "style(db): format phase 2 migration security"
          git push origin HEAD:${{ github.ref_name }}
