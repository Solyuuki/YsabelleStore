name: Phase 2 Format Repair

on:
  push:
    branches:
      - feature/sprint9-auth-access

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sprint9-auth-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Phase 2 files
        run: >-
          npx prettier --write
          backend/src/middleware/authRateLimit.ts
          backend/src/routes/customerAuth.routes.ts
          backend/src/services/customerAuthService.ts
          backend/src/utils/customerRegistrationIntent.ts
          backend/test/customer-auth-rate-limit.test.ts
          docs/superpowers/plans/2026-08-25-auth-separation-and-customer-login.md
          docs/superpowers/plans/2026-08-25-customer-auth-security-foundation.md
          docs/superpowers/plans/2026-08-25-customer-identifier-login.md
          frontend/src/services/customerAuthService.ts
          frontend/src/styles/auth-brand.css
          README.md
          scripts/customer-account-frontend-test.ts
          scripts/customer-auth-form-contract-test.ts
          scripts/customer-auth-frontend-test.ts
          scripts/customer-auth-ui-contract-test.ts
          scripts/test/auth-brand-boundary.test.mjs
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/src/middleware/authRateLimit.ts \
            backend/src/routes/customerAuth.routes.ts \
            backend/src/services/customerAuthService.ts \
            backend/src/utils/customerRegistrationIntent.ts \
            backend/test/customer-auth-rate-limit.test.ts \
            docs/superpowers/plans/2026-08-25-auth-separation-and-customer-login.md \
            docs/superpowers/plans/2026-08-25-customer-auth-security-foundation.md \
            docs/superpowers/plans/2026-08-25-customer-identifier-login.md \
            frontend/src/services/customerAuthService.ts \
            frontend/src/styles/auth-brand.css \
            README.md \
            scripts/customer-account-frontend-test.ts \
            scripts/customer-auth-form-contract-test.ts \
            scripts/customer-auth-frontend-test.ts \
            scripts/customer-auth-ui-contract-test.ts \
            scripts/test/auth-brand-boundary.test.mjs
          git commit -m "style(auth): format Phase 2 files"
          git push origin HEAD:feature/sprint9-auth-access
