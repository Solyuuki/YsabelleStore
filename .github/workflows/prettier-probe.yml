name: Prettier Probe

on:
  pull_request:
    branches:
      - "sprint/**"

permissions:
  contents: read

jobs:
  task5-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Task 5 Prettier diff
        run: |
          npx prettier scripts/test/customer-auth-identifier-client.test.mjs --write
          git diff --no-color -- scripts/test/customer-auth-identifier-client.test.mjs
