name: Phase 6 Nullable Password Test Patch

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-social-auth"
    paths:
      - "scripts/phase6-nullable-password-test-patch.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test narrowing
        run: node scripts/phase6-nullable-password-test-patch.mjs

      - name: Commit test narrowing
        run: |
          if git diff --quiet -- backend/test/customer-account-security.test.ts backend/test/customer-auth-password-security.test.ts backend/test/customer-auth.test.ts; then
            echo "Nullable password test patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/test/customer-account-security.test.ts backend/test/customer-auth-password-security.test.ts backend/test/customer-auth.test.ts
          git commit -m "test(auth): narrow nullable password fixtures"
          git push origin HEAD:m1/v0.9/feat/customer-social-auth
