name: Sprint 8 Integration Materializer

on:
  push:
    branches:
      - sprint/v0.8/sprint-8

permissions:
  contents: write

concurrency:
  group: sprint8-integration-materializer
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
  JWT_SECRET: sprint8-integration-verification-secret
  FRONTEND_URL: http://localhost:5173
  YSABELLE_BRANCH: sprint/v0.8/sprint-8
  YSABELLE_BASE_REF: sprint/v0.7/sprint-7

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Sprint 8
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.8/sprint-8
          fetch-depth: 0

      - name: Configure Git identity and fetch Sprint 7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin sprint/v0.7/sprint-7

      - name: Merge Sprint 7 and enforce exact conflict set
        run: |
          set +e
          git merge --no-commit --no-ff origin/sprint/v0.7/sprint-7
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' backend/package.json frontend/package.json)"
          if [ "$merge_status" -eq 0 ]; then
            echo "Expected the previously diagnosed two package conflicts, but merge completed without them."
            exit 1
          fi
          if [ "$conflicts" != "$expected" ]; then
            echo "Unexpected conflict set:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

      - name: Resolve backend and frontend package scripts
        run: |
          cat > backend/package.json <<'JSON'
          {
            "name": "@ysabellestore/backend",
            "version": "0.1.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "tsx watch src/server.ts",
              "prisma:generate": "npm run prisma:generate --prefix ..",
              "prebuild": "npm run prisma:generate",
              "build": "tsc -p tsconfig.json",
              "test": "tsx --test --test-concurrency=1 test/auth-security.test.ts test/customer-auth.test.ts test/customer-auth-http.test.ts test/customer-order-account.test.ts test/cors.test.ts test/catalog-image-process-gate.test.ts test/catalog-image-engine-runner.test.ts test/catalog-image-storage.test.ts test/catalog-image-foundation.test.ts test/catalog-image-approval.test.ts test/catalog-image-storefront.test.ts test/catalog-image-url.test.ts test/catalog-image-backfill.test.ts test/catalog-image-latest-candidate.test.ts test/catalog-quality.test.ts test/data-flow.test.ts test/storefront.test.ts test/storefront-product-detail.test.ts test/forecast-delivery.test.ts test/forecast-fallback.test.ts test/historical-sales-rules.test.ts test/inventory-import.test.ts test/http-status-contract.test.ts test/health-readiness.test.ts test/error-handler-security.test.ts test/request-traceability.test.ts",
              "start": "node dist/src/server.js",
              "lint": "eslint src test",
              "format": "prettier --write .",
              "typecheck": "tsc --noEmit"
            },
            "dependencies": {
              "cors": "^2.8.5",
              "dotenv": "^16.4.7",
              "express": "^4.21.2",
              "jsonwebtoken": "^9.0.2",
              "multer": "^2.2.0",
              "read-excel-file": "^9.3.1",
              "saxen": "^11.0.2",
              "zod": "^3.24.1"
            },
            "devDependencies": {
              "@types/cors": "^2.8.17",
              "@types/express": "^4.17.21",
              "@types/jsonwebtoken": "^9.0.7",
              "@types/multer": "^2.2.0",
              "@types/node": "^22.10.5",
              "tsx": "^4.19.2"
            }
          }
          JSON
          cat > frontend/package.json <<'JSON'
          {
            "name": "@ysabellestore/frontend",
            "version": "0.1.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc -b && vite build",
              "preview": "vite preview",
              "test": "tsx --tsconfig tsconfig.app.json ../scripts/customer-auth-frontend-test.ts && tsx --tsconfig tsconfig.app.json ../scripts/customer-auth-ui-contract-test.ts && tsx --tsconfig tsconfig.app.json ../scripts/customer-auth-form-contract-test.ts && tsx --tsconfig tsconfig.app.json ../scripts/customer-account-frontend-test.ts && tsx --tsconfig tsconfig.app.json ../scripts/internal-auth-boundary-frontend-test.ts && tsx --tsconfig tsconfig.app.json ../scripts/system-health-reliability-test.ts",
              "lint": "eslint src vite.config.ts tailwind.config.ts postcss.config.js",
              "format": "prettier --write .",
              "typecheck": "tsc --noEmit"
            },
            "dependencies": {
              "@base-ui/react": "^1.7.0",
              "@radix-ui/react-dialog": "^1.1.19",
              "@radix-ui/react-slot": "^1.1.1",
              "chart.js": "^4.4.7",
              "class-variance-authority": "^0.7.1",
              "clsx": "^2.1.1",
              "driver.js": "^1.8.0",
              "gsap": "^3.15.0",
              "lucide-react": "^0.468.0",
              "react": "^19.0.0",
              "react-chartjs-2": "^5.2.0",
              "react-dom": "^19.0.0",
              "recharts": "^2.15.0",
              "tailwind-merge": "^2.6.0",
              "zod": "^3.24.1"
            },
            "devDependencies": {
              "@types/node": "^22.10.5",
              "@types/react": "^19.0.6",
              "@types/react-dom": "^19.0.3",
              "@vitejs/plugin-react": "^4.3.4",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.49",
              "tailwindcss": "^3.4.17",
              "vite": "^6.0.7"
            }
          }
          JSON
          git add backend/package.json frontend/package.json

      - name: Complete detailed frontend health indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/WelcomePage.tsx')
          text = path.read_text()
          text = text.replace(
          '''const systemHealthFooterCopy: Record<SystemHealthState, string> = {
            checking: "Checking system...",
            healthy: "All Systems Normal",
            warning: "Service Warning",
            "database-unavailable": "Database Unavailable",
            offline: "System Offline"
          };''',
          '''const systemHealthFooterCopy: Record<SystemHealthState, string> = {
            checking: "Checking system...",
            healthy: "All Systems Normal",
            degraded: "Service Degraded",
            "database-unavailable": "Database Unavailable",
            "backend-unavailable": "Backend Unavailable",
            timeout: "Health Check Timed Out",
            offline: "Device Offline"
          };''')
          text = text.replace(
          '''const systemHealthFooterDotClass: Record<SystemHealthState, string> = {
            checking: "bg-sky-400",
            healthy: "bg-emerald-500",
            warning: "bg-amber-500",
            "database-unavailable": "bg-orange-500",
            offline: "bg-red-500"
          };''',
          '''const systemHealthFooterDotClass: Record<SystemHealthState, string> = {
            checking: "bg-sky-400",
            healthy: "bg-emerald-500",
            degraded: "bg-amber-500",
            "database-unavailable": "bg-orange-500",
            "backend-unavailable": "bg-red-500",
            timeout: "bg-violet-500",
            offline: "bg-slate-500"
          };''')
          if 'warning: "Service Warning"' in text:
              raise SystemExit('Frontend health indicator replacement did not apply')
          path.write_text(text)
          PY
          git add frontend/src/pages/WelcomePage.tsx

      - name: Remove temporary trigger and format integration tree
        run: |
          rm -f docs/sprints/sprint-8/INTEGRATION-TRIGGER.tmp
          npx --yes prettier@3.4.2 --write backend/package.json frontend/package.json frontend/src/pages/WelcomePage.tsx frontend/src/services/systemHealthService.ts backend/src/middleware/errorHandler.ts backend/src/middleware/requestTrace.ts backend/src/middleware/requestAuditLogger.ts backend/test/error-handler-security.test.ts backend/test/request-traceability.test.ts scripts/system-health-reliability-test.ts scripts/test/server-reliability-contract.test.mjs docs/sprints/sprint-8/*.md .github/workflows/sprint8-integration-materializer-temp.yml
          git add -A
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r catalog-image-engine/requirements.txt

      - name: Build disposable CI database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Verify combined Sprint 7 plus Sprint 8 code
        run: npm run verify:code

      - name: Refresh truthful Sprint 8 validation evidence
        run: |
          node scripts/artifact-update.mjs --validation Passed
          node scripts/sprint-update.mjs --validation Passed
          npx prettier --write docs/implementation-artifacts/m1-abarado/*.md docs/sprints/sprint-8/*.md docs/sprints/sprint-8/members/m1-abarado.md
          npm run verify:status

      - name: Commit verified merge and remove temporary materializer
        run: |
          rm -f .github/workflows/sprint8-integration-materializer-temp.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: integrate verified Sprint 7 into Sprint 8"

      - name: Push verified Sprint 8 merge
        env:
          HUSKY: "0"
        run: git push origin HEAD:sprint/v0.8/sprint-8
