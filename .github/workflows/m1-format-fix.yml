name: M1 Format Fix

on:
  push:
    branches:
      - m1/v0.11/fix/http-status-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format reported files
        run: |
          npx prettier --write             backend/src/middleware/errorHandler.ts             backend/src/routes/apiMethodContract.ts             backend/src/scripts/ensureVerified50Inventory.ts             backend/src/scripts/prepareVerified50Barcodes.ts             backend/src/services/inventoryImportService.ts             backend/test/error-handler-security.test.ts             docs/implementation-artifacts/m1-abarado/SPRINT-PROGRESS.md             docs/implementation-artifacts/m1-abarado/TASKS.md             frontend/src/components/shared/GlobalReliabilityUI.tsx             frontend/src/context/SystemReliabilityContext.tsx             frontend/src/services/httpStatusUi.ts             frontend/src/services/systemReliabilityGate.ts             frontend/src/styles/global.css

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             backend/src/middleware/errorHandler.ts             backend/src/routes/apiMethodContract.ts             backend/src/scripts/ensureVerified50Inventory.ts             backend/src/scripts/prepareVerified50Barcodes.ts             backend/src/services/inventoryImportService.ts             backend/test/error-handler-security.test.ts             docs/implementation-artifacts/m1-abarado/SPRINT-PROGRESS.md             docs/implementation-artifacts/m1-abarado/TASKS.md             frontend/src/components/shared/GlobalReliabilityUI.tsx             frontend/src/context/SystemReliabilityContext.tsx             frontend/src/services/httpStatusUi.ts             frontend/src/services/systemReliabilityGate.ts             frontend/src/styles/global.css
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format Sprint 11 integration"
          git push --no-verify origin HEAD:m1/v0.11/fix/http-status-contract
