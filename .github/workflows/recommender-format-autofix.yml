name: Recommender Format Autofix

on:
  push:
    branches:
      - sprint/v0.11/sprint-11
    paths:
      - backend/src/services/dashboardService.ts
      - backend/src/services/forecastTargetService.ts
      - backend/src/services/recommenderAiService.ts
      - frontend/src/components/dashboard/SalesPulseCard.tsx
      - frontend/src/components/reports/RestockDraftsPanel.tsx
      - frontend/src/pages/DashboardPage.tsx
      - frontend/src/pages/SettingsPage.tsx
      - frontend/src/utils/directPdfExport.ts
      - frontend/src/utils/reportExport.ts
      - .github/workflows/recommender-format-autofix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.11/sprint-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format recommender implementation files
        run: |
          npx prettier --write \
            backend/src/services/dashboardService.ts \
            backend/src/services/forecastTargetService.ts \
            backend/src/services/recommenderAiService.ts \
            frontend/src/components/dashboard/SalesPulseCard.tsx \
            frontend/src/components/reports/RestockDraftsPanel.tsx \
            frontend/src/pages/DashboardPage.tsx \
            frontend/src/pages/SettingsPage.tsx \
            frontend/src/utils/directPdfExport.ts \
            frontend/src/utils/reportExport.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/services/dashboardService.ts \
            backend/src/services/forecastTargetService.ts \
            backend/src/services/recommenderAiService.ts \
            frontend/src/components/dashboard/SalesPulseCard.tsx \
            frontend/src/components/reports/RestockDraftsPanel.tsx \
            frontend/src/pages/DashboardPage.tsx \
            frontend/src/pages/SettingsPage.tsx \
            frontend/src/utils/directPdfExport.ts \
            frontend/src/utils/reportExport.ts
          git commit -m "style(recommender): apply prettier formatting"
          git push --no-verify origin HEAD:sprint/v0.11/sprint-11
