name: Temporary Guardrail Test Format

on:
  push:
    branches:
      - "m3/v0.11/fix/customer-support-integration"

permissions:
  contents: write

jobs:
  format-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3/v0.11/fix/customer-support-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format updated guardrail tests
        run: |
          npx prettier --write \
            scripts/test/about-storefront-handoff.test.mjs \
            scripts/test/brand-logo-integration.test.mjs \
            scripts/test/customer-about-origin-shelf-premium.test.mjs \
            scripts/test/customer-about-scroll-stability.test.mjs \
            scripts/test/customer-cart-sheen.test.mjs \
            scripts/test/storefront-home-premium.test.mjs \
            frontend/src/utils/aboutExperiencePreload.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --no-verify -m "style: format updated guardrail tests"
          git push --no-verify origin HEAD:m3/v0.11/fix/customer-support-integration
