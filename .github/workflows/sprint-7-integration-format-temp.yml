name: Sprint 7 Integration Format Temp

on:
  push:
    branches:
      - m1/v0.7/fix/sprint6-sprint7-integration

permissions:
  contents: write

jobs:
  format-temporary-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.7/fix/sprint6-sprint7-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format temporary integration workflows
        run: >-
          npx prettier --write
          .github/workflows/sprint-7-integration-pr-validation.yml
          .github/workflows/sprint-7-integration-promote.yml
          .github/workflows/sprint-7-integration-resolution.yml

      - name: Commit formatter output and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sprint-7-integration-pr-validation.yml
          git add .github/workflows/sprint-7-integration-promote.yml
          git add .github/workflows/sprint-7-integration-resolution.yml
          git rm .github/workflows/sprint-7-integration-format-temp.yml
          git commit -m "style: format Sprint 7 integration workflows"
          git push origin HEAD:m1/v0.7/fix/sprint6-sprint7-integration
