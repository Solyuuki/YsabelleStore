name: Temporary Phase 10 Normalize

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/temp-phase10-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix StatusBadge string child
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/inventory/InventoryImportDialog.tsx')
          text = path.read_text()
          old = '<StatusBadge variant="info">{pdfRows.length} lines</StatusBadge>'
          new = '<StatusBadge variant="info">{`${pdfRows.length} lines`}</StatusBadge>'
          if old not in text:
              raise SystemExit('StatusBadge anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format Phase 10 files
        run: npx prettier --write backend/src/services/bulkDeliveryService.ts frontend/src/components/inventory/InventoryImportDialog.tsx scripts/restock-phase10-ui-contract-test.ts
      - name: Verify frontend build
        run: npm run build --workspace frontend
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/bulkDeliveryService.ts frontend/src/components/inventory/InventoryImportDialog.tsx scripts/restock-phase10-ui-contract-test.ts
          HUSKY=0 git commit -m "fix(phase10): normalize bulk delivery slice"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
