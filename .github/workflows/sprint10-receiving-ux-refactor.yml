name: Sprint 10 Receiving UX Refactor

on:
  push:
    branches:
      - "sprint/v0.10/sprint-10"
    paths:
      - ".github/workflows/sprint10-receiving-ux-refactor.yml"

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Reports ownership and notification refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          reports_path = Path("frontend/src/pages/ReportsPage.tsx")
          reports = reports_path.read_text()
          reports = reports.replace(
              'import { RestockOrderHistoryPanel } from "@/components/reports/RestockOrderHistoryPanel";\n',
              'import { RestockDraftsPanel } from "@/components/reports/RestockDraftsPanel";\n'
          )
          reports = reports.replace('import { RestockReceivingPanel } from "@/components/reports/RestockReceivingPanel";\n', '')
          reports = reports.replace('import { listRestockOrders } from "@/services/restockApi";\n', '')
          reports = reports.replace(
              '  const [restockView, setRestockView] = useState<"plan" | "orders" | "receiving">("plan");\n  const [restockOrderCount, setRestockOrderCount] = useState<number | null>(null);\n  const [restockOrdersRefreshVersion, setRestockOrdersRefreshVersion] = useState(0);',
              '  const [restockView, setRestockView] = useState<"plan" | "drafts">("plan");\n  const [restockOrdersRefreshVersion, setRestockOrdersRefreshVersion] = useState(0);'
          )
          reports = re.sub(
              r'\n  useEffect\(\(\) => \{\n    let active = true;\n\n    void listRestockOrders\(\{ page: 1, pageSize: 1 \}\)[\s\S]*?\n  \}, \[refreshVersion, restockOrdersRefreshVersion\]\);\n',
              '\n',
              reports,
              count=1
          )
          start = reports.index('          <section className="space-y-3">')
          end = reports.index('          <section className="grid items-start gap-4', start)
          replacement = '''          <section className="space-y-3">
            <div className="flex flex-col gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h2 className="text-base font-semibold text-slate-950">Restock</h2>
                <p className="mt-0.5 text-xs text-slate-500">
                  Build and confirm restock plans here. Confirmed tickets move to Receiving for the physical delivery.
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <Button
                  aria-pressed={restockView === "plan"}
                  onClick={() => setRestockView("plan")}
                  size="sm"
                  type="button"
                  variant={restockView === "plan" ? "default" : "secondary"}
                >
                  Plan restock
                </Button>
                <Button
                  aria-pressed={restockView === "drafts"}
                  onClick={() => setRestockView("drafts")}
                  size="sm"
                  type="button"
                  variant={restockView === "drafts" ? "default" : "secondary"}
                >
                  Saved drafts
                </Button>
              </div>
            </div>

            {restockView === "plan" ? (
              <div className="space-y-3">
                <RestockNewProductCard
                  onOpenOrders={() => setRestockView("drafts")}
                  onOrderCreated={notifyRestockOrdersChanged}
                />
                <RestockPlanningPanel
                  onOpenOrders={() => setRestockView("drafts")}
                  onOrdersChanged={notifyRestockOrdersChanged}
                />
              </div>
            ) : (
              <RestockDraftsPanel
                onDraftConfirmed={notifyRestockOrdersChanged}
                refreshVersion={refreshVersion + restockOrdersRefreshVersion}
              />
            )}
          </section>

'''
          reports = reports[:start] + replacement + reports[end:]
          reports_path.write_text(reports)

          planner_path = Path("frontend/src/components/reports/RestockPlanningPanel.tsx")
          planner = planner_path.read_text()
          planner = planner.replace(
              'import { Alert, AlertDescription, AlertTitle } from "@/components/ui/alert";\n',
              'import { useToast } from "@/components/shared/ToastProvider";\nimport { Alert, AlertDescription, AlertTitle } from "@/components/ui/alert";\n'
          )
          planner = planner.replace(
              'export function RestockPlanningPanel({ onOpenOrders, onOrdersChanged }: RestockPlanningPanelProps) {\n',
              'export function RestockPlanningPanel({ onOpenOrders, onOrdersChanged }: RestockPlanningPanelProps) {\n  const { pushToast } = useToast();\n'
          )
          old = '''      const approved = await approveRestockOrder(order.id, order.version);
      setDraftOrder(approved);
      setDraftDirty(false);
      setReviewOpen(false);
      setNotice(null);
      onOrdersChanged();'''
          new = '''      const approved = await approveRestockOrder(order.id, order.version);
      setReviewOpen(false);
      setNotice(null);
      onOrdersChanged();
      pushToast({
        title: "Restock sent to Receiving",
        message: `${approved.orderNumber} is ready in Receiving. Physical Inventory stays unchanged until the delivery is accepted.`,
        variant: "success"
      });
      await loadRecommendations();'''
          if old not in planner:
              raise SystemExit("Restock planner approval block did not match expected source")
          planner = planner.replace(old, new, 1)
          planner_path.write_text(planner)

          contract_path = Path("scripts/restock-phase7-9-ui-contract-test.ts")
          contract_path.write_text('''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import { resolve } from "node:path";

const reportsSource = readFileSync(resolve(process.cwd(), "src/pages/ReportsPage.tsx"), "utf8");
const newProductSource = readFileSync(
  resolve(process.cwd(), "src/components/reports/RestockNewProductCard.tsx"),
  "utf8"
);
const receivingSource = readFileSync(resolve(process.cwd(), "src/pages/ReceivingPage.tsx"), "utf8");
const returnDialogSource = readFileSync(
  resolve(process.cwd(), "src/components/receiving/ReturnReportDialog.tsx"),
  "utf8"
);
const returnExportSource = readFileSync(
  resolve(process.cwd(), "src/utils/restockReturnExport.ts"),
  "utf8"
);
const routesSource = readFileSync(resolve(process.cwd(), "src/app/routes.ts"), "utf8");
const apiSource = readFileSync(resolve(process.cwd(), "src/services/restockApi.ts"), "utf8");

assert.match(reportsSource, /RestockNewProductCard/);
assert.match(reportsSource, /RestockDraftsPanel/);
assert.doesNotMatch(reportsSource, /RestockReceivingPanel/);
assert.doesNotMatch(reportsSource, /"plan" \\| "orders" \\| "receiving"/);
assert.match(newProductSource, /createProduct/);
assert.match(newProductSource, /createRestockOrder/);
assert.match(newProductSource, /dataQualityStatus: "NEEDS_REVIEW"/);
assert.match(newProductSource, /isStorefrontVisible: false/);
assert.doesNotMatch(newProductSource, /stockInInventory\\s*\\(/);

assert.match(receivingSource, /Complete — No issues/);
assert.match(receivingSource, /Complete — With issues/);
assert.match(receivingSource, /Partial delivery/);
assert.match(receivingSource, /Mark entire delivery damaged/);
assert.match(receivingSource, /Accepted quantity is calculated automatically/);
assert.match(receivingSource, /ReturnReportDialog/);
assert.match(receivingSource, /receiveRestockOrder/);
assert.doesNotMatch(receivingSource, /receiveInventoryStock/);
assert.doesNotMatch(receivingSource, /stockInInventory\\s*\\(/);
assert.match(apiSource, /\\/receipts/);

assert.match(returnDialogSource, /Download return report/);
assert.match(returnDialogSource, /Download PDF/);
assert.match(returnDialogSource, /Print/);
assert.match(returnDialogSource, /Excel-compatible CSV/);
assert.match(returnExportSource, /damagedQuantity/);
assert.match(returnExportSource, /returnQuantity/);
assert.match(returnExportSource, /safeCsvText/);
assert.match(routesSource, /path: "\\/receiving"[\\s\\S]*?icon: Truck/);

console.log("Restock Phase 7-9 UI contract passed.");
''')

          barcode_contract_path = Path("scripts/receiving-barcode-ui-contract-test.ts")
          barcode_contract_path.write_text('''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import { resolve } from "node:path";

import { appRoutes, canRoleAccessRoute } from "../frontend/src/app/routes.ts";

const receivingRoute = appRoutes.find((route) => route.path === "/receiving");
assert.ok(receivingRoute, "Receiving route must be registered.");
assert.equal(canRoleAccessRoute(receivingRoute, "OWNER"), true);
assert.equal(canRoleAccessRoute(receivingRoute, "STAFF"), false);

const appShellSource = readFileSync(resolve(process.cwd(), "src/app/AppShell.tsx"), "utf8");
const sidebarSource = readFileSync(resolve(process.cwd(), "src/components/app/AppSidebar.tsx"), "utf8");
const pageSource = readFileSync(resolve(process.cwd(), "src/pages/ReceivingPage.tsx"), "utf8");
const restockApiSource = readFileSync(resolve(process.cwd(), "src/services/restockApi.ts"), "utf8");

assert.match(appShellSource, /case "\\/receiving":[\\s\\S]*?<ReceivingPage \\/>/);
assert.match(sidebarSource, /"\\/receiving"/);
assert.match(pageSource, /listRestockOrders/);
assert.match(pageSource, /Restock tickets ready for delivery/);
assert.match(pageSource, /Complete — No issues/);
assert.match(pageSource, /Complete — With issues/);
assert.match(pageSource, /Partial delivery/);
assert.match(pageSource, /internalBatchReference/);
assert.doesNotMatch(pageSource, /Barcode on received item/);
assert.doesNotMatch(pageSource, /Register barcode & receive/);
assert.match(restockApiSource, /acceptedQuantity/);
assert.match(restockApiSource, /\\/receipts/);

console.log("Receiving ticket UI contract passed.");
''')
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            frontend/src/pages/ReportsPage.tsx \
            frontend/src/pages/ReceivingPage.tsx \
            frontend/src/app/routes.ts \
            frontend/src/components/reports/RestockPlanningPanel.tsx \
            frontend/src/components/reports/RestockDraftsPanel.tsx \
            frontend/src/components/receiving/ReturnReportDialog.tsx \
            frontend/src/utils/restockReturnExport.ts \
            frontend/src/utils/restockReturnPdf.ts \
            scripts/restock-phase7-9-ui-contract-test.ts \
            scripts/receiving-barcode-ui-contract-test.ts
      - name: Validate frontend refactor
        run: |
          npm run typecheck --workspace frontend
          npm test --workspace frontend
          npm run build --workspace frontend
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx \
            frontend/src/pages/ReceivingPage.tsx \
            frontend/src/app/routes.ts \
            frontend/src/components/reports/RestockPlanningPanel.tsx \
            frontend/src/components/reports/RestockDraftsPanel.tsx \
            frontend/src/components/receiving/ReturnReportDialog.tsx \
            frontend/src/utils/restockReturnExport.ts \
            frontend/src/utils/restockReturnPdf.ts \
            scripts/restock-phase7-9-ui-contract-test.ts \
            scripts/receiving-barcode-ui-contract-test.ts
          if git diff --cached --quiet; then
            echo "No receiving UX changes to commit."
            exit 0
          fi
          HUSKY=0 git commit -m "refactor(receiving): simplify ticket-based delivery UX"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
