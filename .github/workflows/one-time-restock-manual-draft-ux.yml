name: One-time restock manual draft UX cleanup

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply UX patch
        shell: python
        run: |
          from pathlib import Path
          import re

          reports_path = Path('frontend/src/pages/ReportsPage.tsx')
          planning_path = Path('frontend/src/components/reports/RestockPlanningPanel.tsx')
          test_path = Path('scripts/restock-phase7-9-ui-contract-test.ts')

          reports = reports_path.read_text()
          planning = planning_path.read_text()
          test = test_path.read_text()

          old_header = '''            <div className="flex flex-col gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <h2 className="text-base font-semibold text-slate-950">Restock forecast</h2>
                <p className="mt-0.5 text-xs text-slate-500">
                  Automatic SARIMAX-driven recommendations are shown below before projected
                  stockouts. Manual custom restocking stays in the separate Restock planner.
                </p>
              </div>
              <Button
                aria-controls="restock-drafts"
                aria-pressed={draftsOpen}
                onClick={toggleRestockDrafts}
                size="sm"
                type="button"
                variant={draftsOpen ? "default" : "secondary"}
              >
                Saved drafts
              </Button>
            </div>'''
          new_header = '''            <div className="rounded-lg border border-slate-200 bg-white px-4 py-3">
              <h2 className="text-base font-semibold text-slate-950">Restock forecast</h2>
              <p className="mt-0.5 text-xs text-slate-500">
                Automatic SARIMAX-driven recommendations are shown below before projected
                stockouts. Manual custom restocking stays in the separate Restock planner.
              </p>
            </div>'''
          assert old_header in reports, 'forecast header block not found'
          reports = reports.replace(old_header, new_header, 1)

          old_order = '''            {draftsOpen ? (
              <div className="scroll-mt-4" id="restock-drafts" ref={restockDraftsRef}>
                <RestockDraftsPanel
                  onDraftConfirmed={notifyRestockOrdersChanged}
                  refreshVersion={refreshVersion + restockOrdersRefreshVersion}
                />
              </div>
            ) : null}

            <RestockPlanningPanel
              onOpenOrders={openRestockDrafts}
              onOrdersChanged={notifyRestockOrdersChanged}
            />'''
          new_order = '''            <RestockPlanningPanel
              onOpenOrders={toggleRestockDrafts}
              onOrdersChanged={notifyRestockOrdersChanged}
            />

            {draftsOpen ? (
              <div className="scroll-mt-4" id="restock-drafts" ref={restockDraftsRef}>
                <RestockDraftsPanel
                  onDraftConfirmed={notifyRestockOrdersChanged}
                  refreshVersion={refreshVersion + restockOrdersRefreshVersion}
                />
              </div>
            ) : null}'''
          assert old_order in reports, 'draft/planner order block not found'
          reports = reports.replace(old_order, new_order, 1)

          planning = planning.replace('  RefreshCw,\n', '', 1)
          planning = planning.replace('  const [loading, setLoading] = useState(true);', '  const [loading, setLoading] = useState(false);', 1)

          pattern = re.compile(r'''  const loadRecommendations = useCallback\(async \(\) => \{.*?\n  \}, \[\]\);\n\n  useEffect\(\(\) => \{\n    void loadRecommendations\(\);\n  \}, \[loadRecommendations\]\);''', re.S)
          replacement = '''  const resetPlanner = useCallback(() => {
    setLines([]);
    setDraftOrder(null);
    setDraftDirty(false);
    setDraftNotes("");
    setSearchTerm("");
    setSearchResults([]);
    setCatalogMeta(null);
    setCatalogError(null);
    setCatalogOpen(false);
    setReviewOpen(false);
    setRestockPage(1);
    setReviewPage(1);
    setExpandedProductIds(new Set());
    setError(null);
    setNotice(null);
    setLoading(false);
  }, []);

  useEffect(() => {
    resetPlanner();
  }, [resetPlanner]);'''
          planning, count = pattern.subn(replacement, planning, count=1)
          assert count == 1, 'planner reset block not found'
          planning = planning.replace('loadRecommendations', 'resetPlanner')

          old_add = '''    const manual = candidate.recommendedQuantity === 0;
    setLines((current) => [...current, makePlanLine(candidate, manual)]);'''
          assert old_add in planning, 'manual add block not found'
          planning = planning.replace(old_add, '    setLines((current) => [...current, makePlanLine(candidate, true)]);', 1)

          planning = planning.replace('<Badge variant="info">Recommended</Badge>', '<Badge>Manual</Badge>', 1)
          planning = planning.replace('              Review and prepare products for restocking.', '              Create a custom restock by adding products and setting order quantities.', 1)

          old_header_actions = '''            <Badge>{selectedCount.toLocaleString()} products</Badge>
            <Badge>{requestedUnits.toLocaleString()} units</Badge>
            <Button
              aria-label="Refresh restock recommendations"
              disabled={loading || Boolean(draftOrder) || busyAction !== null}
              onClick={() => void resetPlanner()}
              size="sm"
              type="button"
              variant="secondary"
            >
              <RefreshCw aria-hidden="true" className="h-4 w-4" />
              Refresh
            </Button>'''
          new_header_actions = '''            <Badge>{selectedCount.toLocaleString()} products</Badge>
            <Badge>{requestedUnits.toLocaleString()} units</Badge>
            <Button
              aria-controls="restock-drafts"
              onClick={onOpenOrders}
              size="sm"
              type="button"
              variant="secondary"
            >
              Saved drafts
            </Button>'''
          assert old_header_actions in planning, 'planner header actions not found'
          planning = planning.replace(old_header_actions, new_header_actions, 1)

          planning = planning.replace('              No products need restocking right now.', '              No products in this custom restock yet.', 1)
          planning = planning.replace('              Add a product manually if the Owner wants to place a custom restock.', '              Add a product manually to start a custom restock.', 1)

          old_footer_button = '''              <Button
                disabled={!editable || selectedCount === 0 || busyAction !== null}
                onClick={openReview}
                type="button"
              >
                Review restock
              </Button>'''
          new_footer_buttons = '''              <Button
                disabled={
                  !editable ||
                  selectedCount === 0 ||
                  busyAction !== null ||
                  Boolean(draftOrder?.status === "DRAFT" && !draftDirty)
                }
                onClick={() => void saveForLater()}
                type="button"
                variant="secondary"
              >
                {busyAction === "save-for-later"
                  ? "Saving…"
                  : draftOrder?.status === "DRAFT"
                    ? draftDirty
                      ? "Save changes"
                      : "Saved for later"
                    : "Save for later"}
              </Button>
              <Button
                disabled={!editable || selectedCount === 0 || busyAction !== null}
                onClick={openReview}
                type="button"
              >
                Review restock
              </Button>'''
          assert old_footer_button in planning, 'planner footer review button not found'
          planning = planning.replace(old_footer_button, new_footer_buttons, 1)

          review_save = re.compile(r'''\n            <Button\n              disabled=\{busyAction !== null\}\n              onClick=\{\(\) => void saveForLater\(\)\}\n              type="button"\n              variant="secondary"\n            >\n              \{busyAction === "save-for-later" \? "Saving…" : "Save for later"\}\n            </Button>''')
          planning, count = review_save.subn('', planning, count=1)
          assert count == 1, 'review modal save button not found'

          if 'const planningSource' not in test:
            test = test.replace(
              'const reportsSource = readFileSync(resolve(process.cwd(), "src/pages/ReportsPage.tsx"), "utf8");',
              'const reportsSource = readFileSync(resolve(process.cwd(), "src/pages/ReportsPage.tsx"), "utf8");\nconst planningSource = readFileSync(\n  resolve(process.cwd(), "src/components/reports/RestockPlanningPanel.tsx"),\n  "utf8"\n);',
              1,
            )
          test = test.replace('assert.match(reportsSource, /Saved drafts/);', 'assert.doesNotMatch(reportsSource, />Saved drafts</);', 1)
          marker = 'assert.match(reportsSource, /RestockDraftsPanel/);'
          additions = '''assert.match(planningSource, /<Badge>Manual<\\/Badge>/);
assert.match(planningSource, /Save for later/);
assert.match(planningSource, />Saved drafts</);
assert.match(planningSource, /makePlanLine\\(candidate, true\\)/);
assert.doesNotMatch(planningSource, /<Badge variant="info">Recommended<\\/Badge>/);'''
          if additions not in test:
            test = test.replace(marker, marker + '\n' + additions, 1)

          reports_path.write_text(reports)
          planning_path.write_text(planning)
          test_path.write_text(test)
      - name: Format touched files
        run: npx prettier --write frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase7-9-ui-contract-test.ts
      - name: Run targeted frontend contract
        run: npm --workspace frontend test -- --runInBand
        continue-on-error: true
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReportsPage.tsx frontend/src/components/reports/RestockPlanningPanel.tsx scripts/restock-phase7-9-ui-contract-test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(reports): separate manual restock drafts from forecast"
          git push origin HEAD:sprint/v0.10/sprint-10
