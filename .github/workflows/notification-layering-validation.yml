name: Notification Layering Validation

on:
  pull_request:
    branches:
      - "sprint/**"

permissions:
  contents: read

jobs:
  notification-layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test/notification-stack-layering.test.mjs
