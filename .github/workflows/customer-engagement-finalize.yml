name: Customer Engagement Finalize
# Re-run after the reviewed 0005 migration was finalized.

on:
  push:
    branches:
      - sprint/v0.11/sprint-11
    paths:
      - .github/workflows/customer-engagement-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.11/sprint-11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format customer engagement implementation
        run: |
          npx prettier --write \
            backend/src/validators/storefront.validators.ts \
            backend/src/validators/customerModeration.validators.ts \
            backend/src/services/storefrontService.ts \
            backend/src/services/customerModerationService.ts \
            backend/src/services/customerAuthService.ts \
            backend/src/controllers/customerAccountController.ts \
            backend/src/controllers/storefrontController.ts \
            backend/src/controllers/customerModerationController.ts \
            backend/src/routes/customerAccount.routes.ts \
            backend/src/routes/storefront.routes.ts \
            backend/src/routes/customerAdmin.routes.ts \
            backend/src/routes/index.ts \
            backend/src/routes/apiMethodContract.ts \
            backend/test/storefront.test.ts \
            backend/test/customer-engagement.test.ts \
            backend/test/helpers/databaseFixtureScope.ts \
            scripts/test/customer-engagement-contract.test.mjs \
            frontend/src/types/storefront.ts \
            frontend/src/types/customerAuth.ts \
            frontend/src/services/customerAccountService.ts \
            frontend/src/services/storefrontService.ts \
            frontend/src/services/customerModerationApi.ts \
            frontend/src/context/CustomerFavoritesContext.tsx \
            frontend/src/app/CustomerApp.tsx \
            frontend/src/components/customer/ProductCard.tsx \
            frontend/src/pages/customer/CustomerHomePage.tsx \
            frontend/src/pages/customer/CustomerAccountPage.tsx \
            frontend/src/pages/customer/ProductDetailPage.tsx \
            frontend/src/pages/UserManagementPage.tsx \
            frontend/src/utils/storefrontMerchandising.ts \
            frontend/src/styles/customer-commerce-premium.css
      - name: Freeze new migration checksum
        run: npm run migration:checksums:add
      - name: Stage canonical inputs
        run: |
          git add \
            backend/src \
            backend/test \
            scripts/test/customer-engagement-contract.test.mjs \
            frontend/src \
            database/prisma/state/migration-checksums.json
      - name: Roll canonical schema release
        run: npm run state:prepare
      - name: Commit finalized package
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "No finalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "chore(storefront): finalize customer engagement release state"
          git push --no-verify origin HEAD:sprint/v0.11/sprint-11
