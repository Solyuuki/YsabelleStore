name: Sprint 12 rider formatting repair

on:
  push:
    branches:
      - sprint/v0.12/sprint-12
    paths:
      - .github/workflows/sprint12-rider-format-once.yml

permissions:
  contents: write

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format rider CSS with pinned repository Prettier
        run: |
          npx prettier --write frontend/src/styles/customer-delivery-handoff.css frontend/src/styles/retail-deliveries-mobile-v2.css
          npx prettier --check frontend/src/styles/customer-delivery-handoff.css frontend/src/styles/retail-deliveries-mobile-v2.css
          git diff --check
      - name: Validate formatting change with lint and mobile regression
        run: |
          npm run lint
          npm run test:mobile
      - name: Save only validated formatting changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {execFileSync} = require('node:child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'sprint/v0.12/sprint-12';
            const baseSha = context.sha;
            const current = await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
            if (current.data.object.sha !== baseSha) throw new Error('Branch advanced; refuse stale write.');
            const allowed = [
              'frontend/src/styles/customer-delivery-handoff.css',
              'frontend/src/styles/retail-deliveries-mobile-v2.css'
            ];
            const modified = execFileSync('git', ['diff', '--name-only', '-z'])
              .toString('utf8').split('\\0').filter(Boolean);
            if (modified.some(path => !allowed.includes(path))) throw new Error('Unexpected file changed by formatter.');
            if (!modified.length) {
              core.info('No formatting changes required.');
              return;
            }
            const tree = [];
            for (const path of modified) {
              const blob = await github.rest.git.createBlob({
                owner, repo, content: fs.readFileSync(path).toString('base64'), encoding: 'base64'
              });
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const base = await github.rest.git.getCommit({owner,repo,commit_sha:baseSha});
            const newTree = await github.rest.git.createTree({
              owner,repo,base_tree:base.data.tree.sha,tree
            });
            const commit = await github.rest.git.createCommit({
              owner,repo,message:'chore(format): normalize rider handoff card styles',
              tree:newTree.data.sha,parents:[baseSha]
            });
            await github.rest.git.updateRef({
              owner,repo,ref:'heads/'+branch,sha:commit.data.sha,force:false
            });
            core.info('Committed '+commit.data.sha);
