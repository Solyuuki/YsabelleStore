name: Sprint 12 final contract validation
on:
  push:
    branches:
      - sprint/v0.12/sprint-12
    paths:
      - .github/workflows/sprint12-final-contract-check-once.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize test formatting
        run: |
          npx prettier --write scripts/test/storefront-adaptive-mobile.test.mjs scripts/test/storefront-home-premium.test.mjs
          npx prettier --check scripts/test/storefront-adaptive-mobile.test.mjs scripts/test/storefront-home-premium.test.mjs
          git diff --check
      - name: Run exact impacted test files
        shell: bash
        run: |
          node --test scripts/test/storefront-adaptive-mobile.test.mjs scripts/test/storefront-home-premium.test.mjs > /tmp/targeted.log 2>&1 || true
          grep -E '^not ok |^# tests |^# pass |^# fail ' /tmp/targeted.log || true
      - name: Check lint and safe diff
        run: npm run lint
      - name: Save verified Prettier normalization
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const {execFileSync}=require('node:child_process');
            const owner=context.repo.owner,repo=context.repo.repo,branch='sprint/v0.12/sprint-12',baseSha=context.sha;
            const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+branch})).data;
            if(ref.object.sha!==baseSha)throw new Error('Branch advanced; stale write refused.');
            const files=execFileSync('git',['diff','--name-only','-z']).toString('utf8').split('\0').filter(Boolean);
            if(files.some(p=>!['scripts/test/storefront-adaptive-mobile.test.mjs','scripts/test/storefront-home-premium.test.mjs'].includes(p)))throw new Error('Refusing unrelated source changes.');
            if(!files.length){core.info('Already formatted.');return;}
            const tree=[];
            for(const path of files){
              const blob=(await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'})).data;
              tree.push({path,mode:'100644',type:'blob',sha:blob.sha});
            }
            const base=(await github.rest.git.getCommit({owner,repo,commit_sha:baseSha})).data;
            const next=(await github.rest.git.createTree({owner,repo,base_tree:base.tree.sha,tree})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,message:'chore(format): normalize final storefront contract tests',tree:next.sha,parents:[baseSha]})).data;
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:commit.sha,force:false});
            core.info('Committed '+commit.sha);
      - name: Report real test outcome
        shell: bash
        run: |
          if grep -q '^not ok ' /tmp/targeted.log; then
            tail -n 110 /tmp/targeted.log
            exit 1
          fi
