name: Apply customer email identity schema

on:
  push:
    branches:
      - m1/v0.9/feat/customer-mobile-otp

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(auth): apply customer email schema patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-mobile-otp
      - name: Patch Prisma schema and migration
        run: node scripts/apply-customer-email-schema-patch.mjs
      - name: Commit generated schema change
        shell: bash
        run: |
          rm .github/workflows/apply-customer-email-schema.yml
          rm scripts/apply-customer-email-schema-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/prisma/schema.prisma database/prisma/migrations .github/workflows/apply-customer-email-schema.yml scripts/apply-customer-email-schema-patch.mjs
          git commit -m "feat(auth): persist verified customer identities"
          git push origin HEAD:m1/v0.9/feat/customer-mobile-otp
