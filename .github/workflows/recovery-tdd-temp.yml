name: Recovery Tier3 Temporary

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-account-recovery"

permissions:
  contents: read

jobs:
  recovery-tier3:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: m1/v0.9/feat/customer-account-recovery
      YSABELLE_BASE_REF: feature/sprint9-account-security
      YSABELLE_HEAD_SHA: ${{ github.sha }}
      YSABELLE_BASE_SHA: 179dfad2986a97f9482ec039f4d8c8e194adfe18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python image-test dependencies
        run: python -m pip install -r catalog-image-engine/requirements.txt
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate
      - name: Recovery frontend contract
        run: npx tsx --tsconfig frontend/tsconfig.app.json scripts/customer-account-recovery-frontend-test.ts
      - name: Full read-only code verification
        run: npm run verify:code
      - name: Verify committed sprint and artifact status
        run: npm run verify:status
