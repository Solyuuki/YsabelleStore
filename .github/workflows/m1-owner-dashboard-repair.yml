name: M1 Owner Dashboard Repair

on:
  push:
    branches:
      - m1/v0.10/chore/sprint10-release-repair
    paths:
      - .github/workflows/m1-owner-dashboard-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: m1/v0.10/chore/sprint10-release-repair
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Dashboard forecast preference contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/src/pages/DashboardPage.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before = `            <MetricCard\n              detail={forecastStat?.detail ?? "Forecast is not ready"}\n              icon={LineChart}\n              label="Forecast"\n              value={forecastStat?.value ?? "Unavailable"}\n            />`;
          const after = `            {preferences.showForecastSummary ? (\n              <MetricCard\n                detail={forecastStat?.detail ?? "Forecast is not ready"}\n                icon={LineChart}\n                label="Forecast"\n                value={forecastStat?.value ?? "Unavailable"}\n              />\n            ) : null}`;
          if (!source.includes(before)) {
            throw new Error('Dashboard forecast card target was not found.');
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Format repaired source
        run: npx prettier --write frontend/src/pages/DashboardPage.tsx

      - name: Run focused owner module contract
        working-directory: frontend
        run: npx tsx --tsconfig tsconfig.app.json ../scripts/owner-modules-frontend-test.ts

      - name: Typecheck frontend
        run: npm run typecheck --workspace frontend

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/DashboardPage.tsx
          if git diff --cached --quiet; then
            echo "No dashboard repair changes to commit."
            exit 0
          fi
          git commit -m "fix(dashboard): honor forecast summary preference"
          HUSKY=0 git push origin HEAD:m1/v0.10/chore/sprint10-release-repair
