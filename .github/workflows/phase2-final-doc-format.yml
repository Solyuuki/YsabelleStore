name: Phase 2 Final Sprint Docs Format

on:
  push:
    branches:
      - m1/v0.9/feat/customer-auth-access

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/v0.9/feat/customer-auth-access
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Format Sprint 9 governance docs
        run: >-
          npx prettier --write
          docs/sprints/sprint-9/DEFINITION-OF-DONE.md
          docs/sprints/sprint-9/members/m1-abarado.md
          docs/sprints/sprint-9/SPRINT-BACKLOG.md
      - name: Commit formatted docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sprints/sprint-9/DEFINITION-OF-DONE.md docs/sprints/sprint-9/members/m1-abarado.md docs/sprints/sprint-9/SPRINT-BACKLOG.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(sprint9): format final Phase 2 governance docs"
          git -c core.hooksPath=/dev/null push origin HEAD:m1/v0.9/feat/customer-auth-access
