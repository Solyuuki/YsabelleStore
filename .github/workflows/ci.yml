name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository quality gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: sprint-7-ci-only-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=database/prisma/schema.prisma

      - name: Validate guardrail preconditions
        run: npm run guardrail:preflight -- --member m1

      - name: Check formatting
        run: npm run format:check

      - name: Lint repository
        run: npm run lint

      - name: Typecheck repository
        run: npm run typecheck

      - name: Run guardrail tests
        run: npm run test:guardrails

      - name: Run workspace tests
        run: npm test --workspaces --if-present

      - name: Run Sprint 7 customer auth test
        run: npx tsx --test --test-concurrency=1 backend/test/customer-auth.test.ts

      - name: Build repository
        run: npm run build

      - name: Audit production dependency reachability
        run: npm run security:audit:production

      - name: Check version consistency
        run: npm run version:check

      - name: Verify committed sprint and artifact status
        run: npm run verify:status -- --member m1

      - name: Validate Prisma schema
        run: npx prisma validate --schema=database/prisma/schema.prisma

  workspace-validation:
    name: Workspace validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - frontend
          - backend
          - electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace }}
