name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-schema-apply:
    name: Sprint 7 customer schema apply
    if: github.head_ref == 'sprint/v0.7/sprint-7'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
    steps:
      - name: Checkout Sprint 7 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.7/sprint-7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch schema and create migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('database/prisma/schema.prisma')
          s = p.read_text()
          a = "enum UserStatus {\n  ACTIVE\n  INACTIVE\n}\n"
          if 'enum CustomerAccountStatus' not in s:
              if a not in s: raise SystemExit('UserStatus anchor not found')
              s = s.replace(a, a + "\nenum CustomerAccountStatus {\n  ACTIVE\n  INACTIVE\n}\n", 1)
          a = '  @@map("trusted_devices")\n}\n'
          if 'model CustomerAccount' not in s:
              if a not in s: raise SystemExit('TrustedDevice anchor not found')
              s = s.replace(a, a + '''

model CustomerAccount {
  id           String                @id @default(cuid()) @db.VarChar(191)
  name         String                @db.VarChar(120)
  email        String                @unique(map: "uq_customer_accounts_email") @db.VarChar(191)
  phone        String?               @db.VarChar(40)
  passwordHash String                @map("password_hash") @db.VarChar(255)
  status       CustomerAccountStatus @default(ACTIVE)
  createdAt    DateTime              @default(now()) @map("created_at")
  updatedAt    DateTime              @updatedAt @map("updated_at")
  sessions     CustomerSession[]
  orders       CustomerOrder[]

  @@index([status], map: "idx_customer_accounts_status")
  @@map("customer_accounts")
}

model CustomerSession {
  id                String          @id @default(cuid()) @db.VarChar(191)
  customerAccountId String          @map("customer_account_id") @db.VarChar(191)
  tokenHash         String          @unique(map: "uq_customer_sessions_token_hash") @map("token_hash") @db.VarChar(64)
  expiresAt         DateTime        @map("expires_at")
  revokedAt         DateTime?       @map("revoked_at")
  lastUsedAt        DateTime?       @map("last_used_at")
  createdAt         DateTime        @default(now()) @map("created_at")
  updatedAt         DateTime        @updatedAt @map("updated_at")
  customerAccount   CustomerAccount @relation(fields: [customerAccountId], references: [id], onDelete: Cascade, onUpdate: Cascade)

  @@index([customerAccountId], map: "idx_customer_sessions_customer")
  @@index([expiresAt], map: "idx_customer_sessions_expires")
  @@index([revokedAt], map: "idx_customer_sessions_revoked")
  @@map("customer_sessions")
}
''', 1)
          a = "model CustomerOrder {\n  id                String                    @id @default(cuid()) @db.VarChar(191)\n"
          if 'customerAccountId String?' not in s:
              if a not in s: raise SystemExit('CustomerOrder id anchor not found')
              s = s.replace(a, a + '  customerAccountId String?                   @map("customer_account_id") @db.VarChar(191)\n', 1)
          a = '  items             CustomerOrderItem[]\n\n  @@index([status, createdAt], map: "idx_customer_orders_status_created")\n'
          if 'idx_customer_orders_customer_created' not in s:
              if a not in s: raise SystemExit('CustomerOrder items anchor not found')
              s = s.replace(a, '  items             CustomerOrderItem[]\n  customerAccount   CustomerAccount?          @relation(fields: [customerAccountId], references: [id], onDelete: SetNull, onUpdate: Cascade)\n\n  @@index([customerAccountId, createdAt], map: "idx_customer_orders_customer_created")\n  @@index([status, createdAt], map: "idx_customer_orders_status_created")\n', 1)
          p.write_text(s)
          PY

          mkdir -p database/prisma/migrations/20260822_customer_accounts
          cat > database/prisma/migrations/20260822_customer_accounts/migration.sql <<'SQL'
          CREATE TABLE `customer_accounts` (
            `id` VARCHAR(191) NOT NULL,
            `name` VARCHAR(120) NOT NULL,
            `email` VARCHAR(191) NOT NULL,
            `phone` VARCHAR(40) NULL,
            `password_hash` VARCHAR(255) NOT NULL,
            `status` ENUM('ACTIVE', 'INACTIVE') NOT NULL DEFAULT 'ACTIVE',
            `created_at` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
            `updated_at` DATETIME(3) NOT NULL,
            UNIQUE INDEX `uq_customer_accounts_email`(`email`),
            INDEX `idx_customer_accounts_status`(`status`),
            PRIMARY KEY (`id`)
          ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

          CREATE TABLE `customer_sessions` (
            `id` VARCHAR(191) NOT NULL,
            `customer_account_id` VARCHAR(191) NOT NULL,
            `token_hash` VARCHAR(64) NOT NULL,
            `expires_at` DATETIME(3) NOT NULL,
            `revoked_at` DATETIME(3) NULL,
            `last_used_at` DATETIME(3) NULL,
            `created_at` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
            `updated_at` DATETIME(3) NOT NULL,
            UNIQUE INDEX `uq_customer_sessions_token_hash`(`token_hash`),
            INDEX `idx_customer_sessions_customer`(`customer_account_id`),
            INDEX `idx_customer_sessions_expires`(`expires_at`),
            INDEX `idx_customer_sessions_revoked`(`revoked_at`),
            PRIMARY KEY (`id`),
            CONSTRAINT `customer_sessions_customer_account_fkey` FOREIGN KEY (`customer_account_id`) REFERENCES `customer_accounts`(`id`) ON DELETE CASCADE ON UPDATE CASCADE
          ) DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

          ALTER TABLE `customer_orders`
            ADD COLUMN `customer_account_id` VARCHAR(191) NULL,
            ADD INDEX `idx_customer_orders_customer_created`(`customer_account_id`, `created_at`),
            ADD CONSTRAINT `customer_orders_customer_account_fkey` FOREIGN KEY (`customer_account_id`) REFERENCES `customer_accounts`(`id`) ON DELETE SET NULL ON UPDATE CASCADE;
          SQL

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate Prisma
        run: |
          npm run prisma:generate
          npm run prisma:validate

      - name: Build disposable database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Run customer persistence contract
        run: npx tsx --test --test-concurrency=1 backend/test/customer-auth.test.ts

      - name: Commit verified schema
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/prisma/schema.prisma database/prisma/migrations/20260822_customer_accounts/migration.sql
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add customer account persistence"
          git push origin HEAD:sprint/v0.7/sprint-7

  repository-checks:
    name: Repository quality gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate guardrail preconditions
        run: npm run guardrail:preflight -- --member m1
      - name: Check formatting
        run: npm run format:check
      - name: Lint repository
        run: npm run lint
      - name: Typecheck repository
        run: npm run typecheck
      - name: Run guardrail tests
        run: npm run test:guardrails
      - name: Run workspace tests
        run: npm test --workspaces --if-present
      - name: Build repository
        run: npm run build
      - name: Audit production dependency reachability
        run: npm run security:audit:production
      - name: Check version consistency
        run: npm run version:check
      - name: Verify committed sprint and artifact status
        run: npm run verify:status -- --member m1
      - name: Validate Prisma schema
        run: npx prisma validate --schema=database/prisma/schema.prisma

  workspace-validation:
    name: Workspace validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - frontend
          - backend
          - electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace }}
