name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - staging
      - "sprint/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository quality gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      FRONTEND_URL: http://localhost:5173
      YSABELLE_BRANCH: ${{ github.head_ref || github.ref_name }}
      YSABELLE_BASE_REF: ${{ github.base_ref }}
      YSABELLE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      YSABELLE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build disposable CI database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Validate guardrail preconditions
        run: npm run guardrail:preflight

      - name: Print exact Phase 2 Prettier diff
        run: |
          npx prettier backend/src/controllers/healthController.ts backend/src/routes/health.routes.ts --write
          git diff -- backend/src/controllers/healthController.ts backend/src/routes/health.routes.ts
          git checkout -- backend/src/controllers/healthController.ts backend/src/routes/health.routes.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint repository
        run: npm run lint

      - name: Typecheck repository
        run: npm run typecheck

      - name: Run guardrail tests
        run: npm run test:guardrails

      - name: Run workspace tests
        run: npm test --workspaces --if-present

      - name: Build repository
        run: npm run build

      - name: Audit production dependency reachability
        run: npm run security:audit:production

      - name: Check version consistency
        run: npm run version:check

      - name: Verify committed sprint and artifact status
        run: npm run verify:status

  workspace-validation:
    name: Workspace validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - frontend
          - backend
          - electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build --workspace ${{ matrix.workspace }}
