name: Format Restock History

on:
  push:
    branches:
      - sprint/v0.10/sprint-10

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore(format): normalize restock order history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format targeted files
        run: npx prettier --write frontend/src/components/reports/RestockOrderHistoryPanel.tsx scripts/restock-phase4-6-ui-contract-test.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/reports/RestockOrderHistoryPanel.tsx scripts/restock-phase4-6-ui-contract-test.ts
          git commit -m "chore(format): normalize restock order history"
          git push origin HEAD:sprint/v0.10/sprint-10
