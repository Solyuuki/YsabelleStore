name: Phase 7 CSS format preview

on:
  push:
    branches:
      - "m1/v0.9/feat/customer-mobile-otp"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write frontend/src/styles/customer-auth-quick-sign.css
          git diff -- frontend/src/styles/customer-auth-quick-sign.css
