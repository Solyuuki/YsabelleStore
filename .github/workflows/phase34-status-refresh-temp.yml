name: Phase 3+4 Status Refresh (temporary)

on:
  pull_request:
    branches:
      - "sprint/**"

permissions:
  contents: write

concurrency:
  group: phase34-status-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-status:
    if: github.head_ref == 'm1/v0.9/feat/phase3-phase4-readiness'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: ci-only-secret
      FRONTEND_URL: http://localhost:5173
      PYTHONDONTWRITEBYTECODE: "1"
      YSABELLE_BRANCH: ${{ github.head_ref }}
      YSABELLE_BASE_REF: ${{ github.base_ref }}
      YSABELLE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      YSABELLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog-image-engine/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install catalog image validation dependencies
        run: python -m pip install -r catalog-image-engine/requirements.txt

      - name: Build disposable CI database
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Run exact aggregate code verification
        run: npm run verify:code

      - name: Refresh committed status evidence
        run: npm run status:update -- --validation Passed

      - name: Verify refreshed status
        run: npm run verify:status

      - name: Commit refreshed status evidence
        run: |
          if git diff --quiet; then
            echo "Status evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-artifacts/m1-abarado docs/sprints/sprint-9
          git commit -m "docs(sprint9): record phase 3 + phase 4 validation evidence"
          git push origin HEAD:${GITHUB_HEAD_REF}
