name: Apply simplified restock status labels once

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/one-time-simplify-restock-status.yml

permissions:
  contents: write

jobs:
  patch-restock-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 10
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply status label patch
        run: node scripts/one-time-simplify-restock-status.mjs

      - name: Format touched file
        run: npx prettier --write frontend/src/components/reports/RestockForecastPanel.tsx

      - name: Run targeted UI contract
        run: cd frontend && node ../scripts/restock-phase7-9-ui-contract-test.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/reports/RestockForecastPanel.tsx
          if git diff --cached --quiet; then
            echo "Restock status labels are already up to date."
            exit 0
          fi
          git commit -m "fix(reports): simplify restock forecast status labels"
          git push origin HEAD:sprint/v0.10/sprint-10
