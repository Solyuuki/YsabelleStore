name: Temporary Receiving Queue QoL

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/temp-receiving-queue-qol.yml

permissions:
  contents: write

concurrency:
  group: temp-receiving-queue-qol
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sprint branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refactor Receiving queue
        run: echo '' | base64 -d > /tmp/patch_receiving.py && python /tmp/patch_receiving.py

      - name: Format Receiving page
        run: npx prettier --write frontend/src/pages/ReceivingPage.tsx

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Commit Receiving queue refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/ReceivingPage.tsx
          if git diff --cached --quiet; then
            echo "Receiving queue QoL refactor is already applied."
            exit 0
          fi
          git commit --no-verify -m "refactor(receiving): streamline delivery queue"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
