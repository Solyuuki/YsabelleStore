name: Sprint 7 Dependency Audit Diagnostic

on:
  push:
    branches:
      - sprint/v0.7/sprint-7

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture full npm audit report
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          cat npm-audit.json
          echo "npm_audit_exit=$status"
          exit 0

      - name: Show non-destructive npm audit fix plan
        run: npm audit fix --package-lock-only --dry-run || true

      - name: Show Prisma dependency versions
        run: npm ls prisma @prisma/client @prisma/config deepmerge-ts || true
