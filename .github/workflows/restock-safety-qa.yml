name: Restock safety QA

on:
  push:
    branches:
      - staging
      - sprint/v0.11/sprint-11
    paths:
      - "backend/src/services/restock*"
      - "backend/src/services/restockLifecycleService.ts"
      - "frontend/src/components/reports/Restock*"
      - "frontend/src/services/restockApi.ts"
      - "scripts/test/restock*"
      - "backend/src/services/dashboardMonthlyRestockSummary.ts"
      - "backend/src/services/dashboardService.ts"
      - "frontend/src/pages/DashboardPage.tsx"
      - "frontend/src/services/dashboardApi.ts"
      - "scripts/test/dashboard-monthly-inventory-report.test.mjs"
      - "backend/test/restock*"
      - "backend/test/dashboard-monthly-restock-summary.test.ts"
      - "backend/src/scripts/restockSafetyAudit.ts"
      - "backend/src/services/stockHealthService.ts"
      - "database/prisma/schema.prisma"
      - "database/prisma/migrations/**"
      - "database/prisma/state/canonical-state.json"
      - "database/prisma/state/migration-checksums.json"
      - ".github/workflows/restock-safety-qa.yml"
  pull_request:
    paths:
      - "backend/src/services/restock*"
      - "backend/src/services/restockLifecycleService.ts"
      - "frontend/src/components/reports/Restock*"
      - "frontend/src/services/restockApi.ts"
      - "scripts/test/restock*"
      - "backend/src/services/dashboardMonthlyRestockSummary.ts"
      - "backend/src/services/dashboardService.ts"
      - "frontend/src/pages/DashboardPage.tsx"
      - "frontend/src/services/dashboardApi.ts"
      - "scripts/test/dashboard-monthly-inventory-report.test.mjs"
      - "backend/test/restock*"
      - "backend/test/dashboard-monthly-restock-summary.test.ts"
      - "backend/src/scripts/restockSafetyAudit.ts"
      - "backend/src/services/stockHealthService.ts"
      - "database/prisma/schema.prisma"
      - "database/prisma/migrations/**"
      - "database/prisma/state/canonical-state.json"
      - "database/prisma/state/migration-checksums.json"
      - ".github/workflows/restock-safety-qa.yml"

permissions:
  contents: read

concurrency:
  group: restock-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Restock safety unit and backend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Restock safety regressions (no DB writes)
        run: npx tsx --test --test-concurrency=1 backend/test/restock-monthly-cycle.test.ts backend/test/restock-operational-forecast.test.ts backend/test/restock-phase11-decision.test.ts backend/test/restock-phase7-9-contract.test.ts backend/test/restock-owner-policy.test.ts backend/test/restock-draft-removal.test.ts backend/test/dashboard-monthly-restock-summary.test.ts
      - name: Monthly automation and Owner warning UI contracts
        run: node --test scripts/test/restock-monthly-cycle-contract.test.mjs scripts/test/restock-forecast-automation-source.test.mjs scripts/test/restock-owner-warning-ui.test.mjs scripts/test/restock-owner-warning-scroll.test.mjs scripts/test/restock-draft-removal-ui.test.mjs
      - name: Temporary formatting diagnostics
        run: |
          npx prettier --write backend/src/services/restockAutomationService.ts backend/test/restock-monthly-cycle.test.ts frontend/src/pages/DashboardPage.tsx
          for f in backend/src/services/restockAutomationService.ts backend/test/restock-monthly-cycle.test.ts frontend/src/pages/DashboardPage.tsx; do
            echo "FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMAT_END:$f"
          done
      - name: Backend compile
        run: npm run build --workspace backend
