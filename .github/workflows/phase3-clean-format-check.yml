name: Phase 3 Clean Format Repair

on:
  push:
    branches:
      - integration/sprint9-phase3-clean-readiness-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sprint9-phase3-clean-readiness-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to Phase 3 only
        run: |
          npx prettier --write \
            frontend/src/components/app/AppSidebar.tsx \
            frontend/src/components/app/SidebarNavItem.tsx \
            frontend/src/components/customer/CustomerAuthFrame.tsx \
            frontend/src/components/ui/button.tsx \
            frontend/src/layouts/AppLayout.tsx \
            frontend/src/main.tsx \
            frontend/src/pages/customer/CustomerLoginPage.tsx \
            frontend/src/pages/customer/CustomerRegisterPage.tsx \
            frontend/src/styles/customer-auth-interactions.css \
            frontend/src/styles/customer-auth-login-premium.css \
            frontend/src/styles/customer-auth-phase3.css \
            frontend/src/styles/customer-auth-quick-sign.css \
            frontend/src/styles/customer-auth-shaders.css \
            frontend/src/styles/customer-auth-wide-composition.css \
            frontend/src/styles/retailer-brand.css \
            scripts/test/customer-auth-centered-login-shader.test.mjs \
            scripts/test/customer-auth-login-icon.test.mjs \
            scripts/test/customer-auth-premium-hints.test.mjs \
            scripts/test/customer-auth-quick-sign-preview.test.mjs \
            scripts/test/customer-auth-register-density.test.mjs \
            scripts/test/customer-auth-surface-balance.test.mjs \
            scripts/test/customer-auth-ui-redesign.test.mjs \
            scripts/test/customer-auth-wide-composition.test.mjs \
            scripts/test/retailer-brand-unification.test.mjs
      - run: npm run format:check
      - name: Persist canonical Phase 3 formatting
        run: |
          if git diff --quiet; then
            echo "Phase 3 formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/app/AppSidebar.tsx \
            frontend/src/components/app/SidebarNavItem.tsx \
            frontend/src/components/customer/CustomerAuthFrame.tsx \
            frontend/src/components/ui/button.tsx \
            frontend/src/layouts/AppLayout.tsx \
            frontend/src/main.tsx \
            frontend/src/pages/customer/CustomerLoginPage.tsx \
            frontend/src/pages/customer/CustomerRegisterPage.tsx \
            frontend/src/styles/customer-auth-interactions.css \
            frontend/src/styles/customer-auth-login-premium.css \
            frontend/src/styles/customer-auth-phase3.css \
            frontend/src/styles/customer-auth-quick-sign.css \
            frontend/src/styles/customer-auth-shaders.css \
            frontend/src/styles/customer-auth-wide-composition.css \
            frontend/src/styles/retailer-brand.css \
            scripts/test/customer-auth-centered-login-shader.test.mjs \
            scripts/test/customer-auth-login-icon.test.mjs \
            scripts/test/customer-auth-premium-hints.test.mjs \
            scripts/test/customer-auth-quick-sign-preview.test.mjs \
            scripts/test/customer-auth-register-density.test.mjs \
            scripts/test/customer-auth-surface-balance.test.mjs \
            scripts/test/customer-auth-ui-redesign.test.mjs \
            scripts/test/customer-auth-wide-composition.test.mjs \
            scripts/test/retailer-brand-unification.test.mjs
          HUSKY=0 git commit -m "style(phase3): normalize clean auth UI formatting"
          HUSKY=0 git push origin HEAD:integration/sprint9-phase3-clean-readiness-v2
