name: Temporary Receiving Format

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/temp-receiving-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Receiving QoL files
        run: >-
          npx prettier --write
          backend/src/services/restockLifecycleService.ts
          backend/src/services/restockService.ts
          backend/test/restock-phase7-9-contract.test.ts
          frontend/src/components/receiving/ReturnHistoryDialog.tsx
          frontend/src/components/receiving/ReturnReportDialog.tsx
          frontend/src/pages/ReceivingPage.tsx
          frontend/src/utils/restockReturnExport.ts
      - name: Verify formatting
        run: npx prettier --check .
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/restockLifecycleService.ts \
            backend/src/services/restockService.ts \
            backend/test/restock-phase7-9-contract.test.ts \
            frontend/src/components/receiving/ReturnHistoryDialog.tsx \
            frontend/src/components/receiving/ReturnReportDialog.tsx \
            frontend/src/pages/ReceivingPage.tsx \
            frontend/src/utils/restockReturnExport.ts
          HUSKY=0 git commit -m "style(receiving): normalize QoL formatting"
          HUSKY=0 git push origin HEAD:sprint/v0.10/sprint-10
