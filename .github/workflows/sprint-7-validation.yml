name: Sprint 7 Validation

on:
  push:
    branches:
      - sprint/v0.7/sprint-7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint-7-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-backend:
    name: Phase 1 customer auth validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ysabellestore_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ysabellestore_ci
      JWT_SECRET: sprint-7-ci-only-secret
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout Sprint 7 branch
        uses: actions/checkout@v4
        with:
          ref: sprint/v0.7/sprint-7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply candidate customer persistence schema
        run: node scripts/sprint7-phase1-schema-candidate.mjs

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build disposable CI database from candidate schema
        run: npx prisma db push --schema=database/prisma/schema.prisma --skip-generate

      - name: Run customer persistence contract
        run: npx tsx --test --test-concurrency=1 backend/test/customer-auth.test.ts

      - name: Commit verified schema on branch pushes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/prisma/schema.prisma
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Schema already committed."
            exit 0
          fi
          git commit -m "feat: add customer account persistence schema"
          git push origin HEAD:sprint/v0.7/sprint-7

      - name: Run existing backend tests
        run: npm test --workspace @ysabellestore/backend
        continue-on-error: true

      - name: Typecheck backend
        run: npm run typecheck --workspace @ysabellestore/backend

      - name: Build backend
        run: npm run build --workspace @ysabellestore/backend
