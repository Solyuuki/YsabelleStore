name: Sprint 7 Integration Resolution

on:
  push:
    branches:
      - m1/v0.7/fix/sprint6-sprint7-integration
  pull_request:
    branches:
      - sprint/v0.7/sprint-7

permissions:
  contents: read

jobs:
  diagnose-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898248+github-actions[bot]@users.noreply.github.com"

      - name: Attempt Sprint 6 merge and report exact conflicts
        run: |
          set +e
          git fetch origin sprint/v0.6/sprint-6
          git merge --no-commit --no-ff origin/sprint/v0.6/sprint-6
          merge_status=$?
          echo "MERGE_STATUS=$merge_status"
          echo "=== UNMERGED PATHS ==="
          git diff --name-only --diff-filter=U
          echo "=== MERGE STATUS ==="
          git status --short
          if [ "$merge_status" -ne 0 ]; then
            exit 1
          fi
