name: Sprint 10 damage return format

on:
  push:
    branches:
      - sprint/v0.10/sprint-10
    paths:
      - .github/workflows/sprint10-damage-return-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/v0.10/sprint-10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched return-report files
        run: npx prettier --write frontend/src/components/receiving/ReturnReportDialog.tsx frontend/src/utils/restockReturnExport.ts
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/sprint10-damage-return-format.yml
          git config user.name "ysabelle-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(receiving): format damage return flow"
          git push --no-verify origin HEAD:sprint/v0.10/sprint-10
